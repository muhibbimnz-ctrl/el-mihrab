name: android
on:
  workflow_dispatch: {}
  push:
    paths: ['android/**', '.github/workflows/android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        run: |
          keytool -genkeypair -keystore $RUNNER_TEMP/test.jks -storepass testtest -keypass testtest -alias test -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=test"
          cd android
          TEST_KS=$RUNNER_TEMP/test.jks VCODE=${{ github.run_number }} gradle --no-daemon bundleRelease assembleDeneme
          find app/build/outputs -name "*.aab" -o -name "*.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: el-mihrab-android
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/deneme/*.apk
