name: Cuma hutbesi
on:
  schedule:
    - cron: '17 4 * * *'      # her gün 07:17 (TSİ)
    - cron: '41 9 * * 4,5'    # perşembe ve cuma 12:41 (TSİ), hutbe genelde bu günlerde yayımlanır
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pypdf
      - run: python3 tools/hutbe/cek.py
      - name: Değişiklik varsa kaydet
        run: |
          if [ -n "$(git status --porcelain data/hutbe.json)" ]; then
            git config user.name "el-Mihrab hutbe"
            git config user.email "actions@users.noreply.github.com"
            git add data/hutbe.json
            git commit -m "Cuma hutbesi güncellendi ($(date -u +%F))"
            git push
          fi
