name: probe
on: [push]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== QP translations (tr / turkish)"
          for a in 2/2 2/255; do curl -s -m 20 "https://api.quranpedia.net/v1/ayah/$a/translations" | jq -r '.[] | "\(.id) | \(.name) | \(.author)"' | grep -i -E "ترك|turk" ; done
          echo "== QP tafsir list items in Turkish"
          curl -s -m 20 "https://api.quranpedia.net/v1/ayah/2/255/tafsir" | jq -r '.[] | "\(.id) | \(.name) | \(.author)"' | grep -i -E "ترك|turk|türk" || true
          echo "== quranenc tr"
          curl -s -m 20 "https://quranenc.com/api/v1/translations/list/tr" | jq -r '.translations[] | "\(.key) | \(.title)"'
          echo "== rwwad 2:255"
          curl -s -m 20 "https://quranenc.com/api/v1/translation/aya/turkish_rwwad/2/255" | head -c 1500; echo
          echo "== diyanet"
          for u in "https://kuran.diyanet.gov.tr/tefsir" "https://acikkuran.com/2/2"; do curl -s -o /dev/null -m 15 -w "%{http_code} $u\n" "$u"; done
