<!DOCTYPE html><html lang="tr"><head>
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script src="kalkan.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ahlak Dirâsesi — el-Mihrâb</title><meta name="theme-color" content="#7a3b4e">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f3eeee;color:#2e2427}
#hd{background:#faf6f4;border-bottom:1px solid #e2d6d4;padding:10px 12px;position:sticky;top:0;z-index:5}
#hd .top{display:flex;align-items:center;gap:8px}#hd a.bk{color:#7a3b4e;text-decoration:none;font:600 15px system-ui;padding:8px 10px;border-radius:12px;background:#f0e2e4;white-space:nowrap}
#hd h1{margin:0;font:600 17px system-ui;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sek{display:flex;gap:6px;margin-top:10px}.sek button{flex:1;border:1px solid #dccacd;background:#fff;border-radius:14px;padding:9px 6px;font:600 14px system-ui;color:#4d3d42;cursor:pointer}
.sek .on{background:#7a3b4e;color:#fff;border-color:#7a3b4e}
main{max-width:760px;margin:0 auto;padding:12px 12px 90px}
.ar{direction:rtl;font-family:Amiri,serif}
h2.gr{font:600 15px system-ui;color:#7a3b4e;margin:18px 4px 6px;letter-spacing:.3px}
.lst{display:flex;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:12px 14px;margin:8px 0;cursor:pointer;border:1px solid #eadfdf}
.lst .no{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid #b8975a;color:#8a6a2c;display:flex;align-items:center;justify-content:center;font:600 14px system-ui}
.lst .no.ok{background:#7a3b4e;border-color:#7a3b4e;color:#fff}
.lst .t{flex:1;min-width:0}.lst b{display:block;font-size:16px}.lst small{color:#7a6b70}.lst .a{font-size:20px;color:#7a3b4e;white-space:nowrap;max-width:38%;overflow:hidden;text-overflow:ellipsis}
.kart{background:#fff;border-radius:24px;padding:16px;margin:12px 0;border:1px solid #eadfdf;box-shadow:0 2px 10px rgba(60,30,40,.05)}
.kart h2{margin:0;font:600 22px system-ui}.kart .bar{font-size:30px;color:#7a3b4e;margin:4px 0}.kart .oz{color:#6b5a60;font-style:italic;font-family:Lora,Georgia,serif;margin:0 0 8px}
.mt p{font-family:Lora,Georgia,serif;font-size:var(--yz,17.5px);line-height:1.75;margin:0 0 12px}
.pnl{margin-top:12px;background:#faf5f4;border-radius:16px;padding:12px 14px;font-size:16px;line-height:1.65}
.pnl h3{margin:0 0 8px;font-size:15px;color:#7a3b4e}.pnl p{margin:0 0 8px}
.ay{display:block;padding:8px 0;border-bottom:1px dashed #e6d6d6;color:inherit;text-decoration:none}.ay:last-child{border:0}.ay b{color:#7a3b4e;font-size:14px}.ay span{display:block;font-family:Lora,Georgia,serif;font-style:italic}
.am{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}.am i{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid #b07a88;font-style:normal;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}.am.ok i{background:#7a3b4e;border-color:#7a3b4e}.am.ok span{color:#8b7a80;text-decoration:line-through}
.mh{background:#7a3b4e;color:#fff;border-radius:16px;padding:12px 14px;margin-top:12px;font-family:Lora,Georgia,serif;font-size:17px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.btns button,.btns a{border:1px solid #dccacd;background:#fff;border-radius:16px;padding:9px 14px;font:600 14.5px system-ui;color:#3d2f34;cursor:pointer;text-decoration:none}
.btns .on{background:#7a3b4e;color:#fff;border-color:#7a3b4e}
.not{background:#fff;border-radius:16px;padding:14px;line-height:1.6}
.ilr{height:8px;background:#eadfdf;border-radius:6px;overflow:hidden;margin:6px 0 2px}.ilr div{height:100%;background:#7a3b4e}
.gun{background:#fff;border-radius:20px;padding:14px;border:1px solid #eadfdf;margin:10px 0}.gun h3{margin:0 0 6px;font-size:16px}
.gun .q{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed #eadfdf}.gun .q:last-child{border:0}
.gun .q span{flex:1}.gun .q button{border:1px solid #dccacd;background:#fff;border-radius:12px;padding:5px 10px;font:600 13px system-ui;cursor:pointer}.gun .q button.e{background:#2f5d4e;color:#fff;border-color:#2f5d4e}.gun .q button.h{background:#7a1f2b;color:#fff;border-color:#7a1f2b}
input#ara{width:100%;border:1px solid #dccacd;border-radius:14px;padding:11px 14px;font:16px system-ui;margin:4px 0 6px}
</style></head><body>
<div id="hd"><div class="top"><a class="bk" href="./?dirase=kuran">‹ Kur'an</a><h1 id="bs">Ahlak Dirâsesi</h1><a class="bk" href="hadis.html#k=riyad_assalihin">Riyâz</a></div>
<div class="sek"><button id="sK">Konular</button><button id="sM">Muhasebe</button><button id="sH">Hakkında</button></div></div>
<main id="m"><p class="not">Yükleniyor…</p></main>
<script>setTimeout(function(){if(!window.AHLAK_HAZIR){var m=document.getElementById("m");if(m)m.innerHTML='<p class="not">Sayfa açılamadı. <button onclick="location.reload()">Yenile</button> <a href="./?onar">Uygulamayı onar</a></p>'}},9000)</script>
<script>window.AHLAK_HAZIR=1;
const HV='1';let KN=[];const $=s=>document.querySelector(s),M=$('#m');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const bugun=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function sek(id){['sK','sM','sH'].forEach(x=>$('#'+x).classList.toggle('on',x===id))}
function okundu(){return LS.get('mihrab.ahlakOkundu',{})}
function liste(f){sek('sK');$('#bs').textContent='Ahlak Dirâsesi';const ok=okundu(),n=KN.filter(x=>ok[x.id]).length;f=(f||'').toLocaleLowerCase('tr');
 let h=`<div class="not" style="margin-bottom:6px"><b>${KN.length} konu</b> · ${n} okundu<div class="ilr"><div style="width:${KN.length?n*100/KN.length:0}%"></div></div><small>Nevevî’nin Riyâzü’s-Sâlihîn bab düzenini izler: her konuda açıklama, âyetler, hadisler, uygulama ve bir muhasebe sorusu.</small></div><input id="ara" placeholder="Konu ara (sabır, gıybet, komşu…)" value="${esc(f)}">`;let g='';
 KN.forEach((x,i)=>{if(f&&!(x.baslik+' '+x.ozet+' '+x.metin.join(' ')).toLocaleLowerCase('tr').includes(f))return;if(x.grup!==g){g=x.grup;h+=`<h2 class="gr">${esc(g)}</h2>`}
  h+=`<div class="lst" data-i="${i}"><div class="no${ok[x.id]?' ok':''}">${ok[x.id]?'✓':i+1}</div><div class="t"><b>${esc(x.baslik)}</b><small>${esc(x.ozet)}</small></div><div class="a ar">${esc(x.ar)}</div></div>`});
 M.innerHTML=h;M.querySelectorAll('.lst').forEach(e=>e.onclick=()=>{location.hash='k='+KN[+e.dataset.i].id});const a=$('#ara');a.oninput=()=>{const v=a.value,p=a.selectionStart;liste(v);const b=$('#ara');b.focus();b.setSelectionRange(p,p)};if(f)a.focus()}
function konu(i){sek('sK');const x=KN[i];if(!x){liste();return}$('#bs').textContent=x.baslik;LS.set('mihrab.ahlakKaldim',x.id);const yz=LS.get('mihrab.ahlakYazi',17.5),am=LS.get('mihrab.ahlakAmel',{});
 let h=`<div class="kart" style="--yz:${yz}px"><small style="color:#8a6a2c;font-weight:600">${esc(x.grup)}</small><h2>${esc(x.baslik)}</h2><div class="bar ar">${esc(x.ar)}</div><p class="oz">${esc(x.ozet)}</p><div class="mt">${x.metin.map(p=>`<p>${esc(p)}</p>`).join('')}</div>`;
 if(x.ayet.length)h+=`<div class="pnl"><h3>Âyetler</h3>${x.ayet.map(a=>`<a class="ay" href="${a[1]}"><b>${esc(a[0])} ›</b><span>${esc(a[2])}</span></a>`).join('')}</div>`;
 if(x.hadis.length)h+=`<div class="pnl"><h3>Hadisler</h3>${x.hadis.map(a=>`<a class="ay" href="${a[1]}"><b>${esc(a[0])} › Arapça metni aç</b><span>${esc(a[2])}</span></a>`).join('')}</div>`;
 h+=`<div class="pnl"><h3>Bugün uygula</h3>${x.amel.map((a,j)=>{const k=x.id+j,ok=am[k]===bugun();return `<div class="am${ok?' ok':''}" data-k="${k}"><i>${ok?'✓':''}</i><span>${esc(a)}</span></div>`}).join('')}</div>`;
 h+=`<div class="mh"><small style="opacity:.8;font-family:system-ui">Muhasebe sorusu</small><br>${esc(x.muhasebe)}</div>`;
 const ok=okundu()[x.id];h+=`<div class="btns"><button id="okb" class="${ok?'on':''}">${ok?'✓ Okundu':'Okudum'}</button><button id="dn">Dinle</button><button id="km">A−</button><button id="bu">A+</button><button id="kp">Kopyala</button></div>`;
 h+=`<div class="btns">${i>0?`<button id="on">‹ ${esc(KN[i-1].baslik)}</button>`:''}<button id="ls">Konular</button>${i<KN.length-1?`<button id="sn">${esc(KN[i+1].baslik)} ›</button>`:''}</div></div>`;
 M.innerHTML=h;scrollTo(0,0);
 M.querySelectorAll('.am').forEach(e=>e.onclick=()=>{const a=LS.get('mihrab.ahlakAmel',{}),k=e.dataset.k;if(a[k]===bugun())delete a[k];else a[k]=bugun();LS.set('mihrab.ahlakAmel',a);const o=a[k]===bugun();e.classList.toggle('ok',o);e.querySelector('i').textContent=o?'✓':''});
 $('#okb').onclick=()=>{const o=okundu();if(o[x.id])delete o[x.id];else o[x.id]=1;LS.set('mihrab.ahlakOkundu',o);const b=$('#okb');b.classList.toggle('on',!!o[x.id]);b.textContent=o[x.id]?'✓ Okundu':'Okudum'};
 const yaz=d=>{const v=Math.max(14,Math.min(26,LS.get('mihrab.ahlakYazi',17.5)+d));LS.set('mihrab.ahlakYazi',v);M.querySelector('.kart').style.setProperty('--yz',v+'px')};$('#km').onclick=()=>yaz(-1.5);$('#bu').onclick=()=>yaz(1.5);
 $('#dn').onclick=e=>oku(x.baslik+'. '+x.metin.join(' ')+' Muhasebe: '+x.muhasebe,e.target);
 $('#kp').onclick=()=>{const t=x.baslik+'\n\n'+x.metin.join('\n\n')+'\n\nÂyetler:\n'+x.ayet.map(a=>'• '+a[0]+': '+a[2]).join('\n')+'\n\nHadisler:\n'+x.hadis.map(a=>'• '+a[0]+': '+a[2]).join('\n')+'\n\n— el-Mihrâb Ahlak Dirâsesi';(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{$('#kp').textContent='Kopyalandı'}).catch(()=>{})};
 $('#ls').onclick=()=>{location.hash=''};if($('#on'))$('#on').onclick=()=>{location.hash='k='+KN[i-1].id};if($('#sn'))$('#sn').onclick=()=>{location.hash='k='+KN[i+1].id}}
function muhasebe(){sek('sM');$('#bs').textContent='Günlük muhasebe';const g=bugun(),D=LS.get('mihrab.ahlakMuh',{}),b=D[g]||{};
 // günün konusu: tarihe göre dönen 5 soru
 const d0=Math.floor(Date.now()/864e5),S=[];for(let j=0;j<5;j++)S.push(KN[(d0*5+j)%KN.length]);
 let ev=0,top=0;Object.keys(D).forEach(t=>{Object.values(D[t]).forEach(v=>{top++;if(v==='e')ev++})});
 const gun=KN[d0%KN.length];
 let h=`<div class="gun"><h3>Bugünün konusu</h3><div class="lst" id="gk" style="margin:4px 0"><div class="no">★</div><div class="t"><b>${esc(gun.baslik)}</b><small>${esc(gun.ozet)}</small></div></div></div>`;
 h+=`<div class="gun"><h3>Akşam muhasebesi · ${g.split('-').reverse().join('.')}</h3><small style="color:#7a6b70">Hz. Ömer: “Hesaba çekilmeden önce kendinizi hesaba çekin.” Her soruya dürüstçe cevap ver; sadece bu cihazda saklanır.</small>`;
 S.forEach(x=>{const v=b[x.id];h+=`<div class="q" data-id="${x.id}"><span>${esc(x.muhasebe)}<br><small style="color:#8a6a2c">${esc(x.baslik)}</small></span><button data-v="e" class="${v==='e'?'e':''}">İyi</button><button data-v="h" class="${v==='h'?'h':''}">Eksik</button></div>`});
 h+=`</div><div class="not"><b>Kayıt</b>: ${Object.keys(D).length} gün, ${top} cevap, ${top?Math.round(ev*100/top):0}% “iyi”.<br><small>“Eksik” işaretlediğin bir konu için o konunun “Bugün uygula” maddelerinden birini seç.</small></div>`;
 M.innerHTML=h;$('#gk').onclick=()=>{location.hash='k='+gun.id};
 M.querySelectorAll('.q button').forEach(e=>e.onclick=()=>{const D=LS.get('mihrab.ahlakMuh',{}),id=e.parentNode.dataset.id;D[g]=D[g]||{};D[g][id]=D[g][id]===e.dataset.v?undefined:e.dataset.v;if(!D[g][id])delete D[g][id];LS.set('mihrab.ahlakMuh',D);muhasebe()})}
function hakkinda(){sek('sH');$('#bs').textContent='Hakkında';M.innerHTML=`<div class="not"><p><b>Ahlak Dirâsesi</b>, İmam Nevevî’nin <i>Riyâzü’s-Sâlihîn</i>’indeki bab düzenini örnek alır: önce kalbin amelleri (ihlas, tövbe, sabır, şükür…), sonra kalbin ve dilin hastalıkları, kul hakları ve gündelik edepler.</p><p>Her konudaki açıklama el-Mihrâb için yazılmış bir derlemedir. Âyet bağlantıları Kur’an’daki yerine, hadis bağlantıları el-Mihrâb Hadis Dirâsesi’nde Arapça metnin bulunduğu aramaya gider; her bağlantı kitaplarda denetlenmiştir.</p><p>Daha fazlası için: <a href="hadis.html#k=riyad_assalihin">Riyâzü’s-Sâlihîn</a> (tam metin) ve Hadis Dirâsesi’ndeki diğer ahlak kitapları.</p><p><small>Muhasebe kayıtların sadece bu cihazda tutulur. Dinî bilgileri bir hocaya danışarak okumanı tavsiye ederiz.</small></p></div>`}
let okuyan=null;function oku(t,bt){if(!('speechSynthesis' in window))return;const ss=speechSynthesis;if(okuyan===bt){ss.cancel();okuyan=null;bt.textContent='Dinle';return}ss.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';u.rate=.95;const v=ss.getVoices().filter(x=>/^tr/i.test(x.lang))[0];if(v)u.voice=v;u.onend=()=>{okuyan=null;bt.textContent='Dinle'};okuyan=bt;bt.textContent='Durdur';ss.speak(u)}
function yol(){const h=decodeURIComponent(location.hash.slice(1));if(window.speechSynthesis)speechSynthesis.cancel();okuyan=null;
 if(h.startsWith('k=')){const i=KN.findIndex(x=>x.id===h.slice(2));if(i>=0)return konu(i)}if(h==='m')return muhasebe();if(h==='h')return hakkinda();liste()}
$('#sK').onclick=()=>{location.hash=''};$('#sM').onclick=()=>{location.hash='m'};$('#sH').onclick=()=>{location.hash='h'};
addEventListener('hashchange',yol);
fetch('data/ahlak/konular.json?v='+HV).then(r=>r.json()).then(d=>{KN=d;yol()}).catch(()=>{M.innerHTML='<p class="not">Veri yüklenemedi. İnternet bağlantını kontrol edip <button onclick="location.reload()">Yenile</button></p>'});
window.addEventListener('error',function(){try{if(!document.getElementById('hataBar')){var d=document.createElement('div');d.id='hataBar';d.style.cssText='position:fixed;left:10px;right:10px;top:10px;z-index:30;background:#7a1f2b;color:#fff;border-radius:14px;padding:10px 12px;font:14px system-ui';d.innerHTML='Bir şey ters gitti. <button onclick="location.reload()">Yenile</button> <button onclick="this.parentNode.remove()">Kapat</button>';document.body.appendChild(d)}}catch(x){}});
</script><script src="hesap-ayar.js?v=3"></script><script src="hesap.js?v=5" defer></script><script src="nasil.js?v=2" data-b="ahlak"></script></body></html>
