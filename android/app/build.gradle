plugins { id 'com.android.application' }
android {
    namespace 'app.elmihrab.quran'
    compileSdk 36
    defaultConfig {
        applicationId 'app.elmihrab.quran'
        minSdk 24
        targetSdk 36
        versionCode((System.getenv('VCODE') ?: '1') as int)
        versionName '1.0.' + (System.getenv('VCODE') ?: '0')
    }
    signingConfigs {
        test {
            if (System.getenv('TEST_KS')) {
                storeFile file(System.getenv('TEST_KS'))
                storePassword 'testtest'
                keyAlias 'test'
                keyPassword 'testtest'
            }
        }
    }
    buildTypes {
        release { minifyEnabled false }
        deneme { initWith release; signingConfig signingConfigs.test; matchingFallbacks = ['release'] }
    }
    lint { checkReleaseBuilds false; abortOnError false }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0' }
