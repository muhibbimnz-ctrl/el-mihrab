<style>

.ayet .n{font-size:20px;color:var(--gold)}

.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;direction:rtl}.grid{gap:12px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--goldSoft);font-size:13px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:90vw}

body.okGizli .cell small,body.okGizli .okn{display:none}

.ipucu{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin:6px 2px 10px}
.ipucu button{flex:none;border:1.5px solid var(--accent);background:var(--accentSoft);color:var(--accent);border-radius:999px;padding:6px 12px;font:600 13px system-ui;cursor:pointer}
.nav{display:flex;justify-content:space-between;gap:8px;margin:20px 0}

<script>
(function(){

  [].forEach.call(document.querySelectorAll('.ipucu button'),function(x){x.textContent=S.gizli?'👁 Okunuşu göster':'🙈 Okunuşu gizle'})}

/* ---------- harfler ---------- */
// [harf, ad, ad(ar), okunuş ipucu, sınıf]  sınıf: i=ince, k=kalın, h=ح/ع/ر (a-i-u), e=elif
var H=[

var BITISMEZ='ادذرزو';

function formlar(h){var b=BITISMEZ.indexOf(h)>=0,Z='‍';return [h,b?h:h+Z,b?Z+h:Z+h+Z,Z+h]}

ders({u:'Başlangıç',id:'giris',t:'Arap harflerine giriş',s:'Yazı sağdan sola · 28 harf · harekeler',ic:'أ ب ت',f:giris});
[[0,7],[7,14],[14,21],[21,28]].forEach(function(r,i){ders({u:'Harfler',id:'h'+(i+1),t:'Harfler '+(r[0]+1)+'–'+r[1],s:H.slice(r[0],r[1]).map(function(x){return x[1]}).join(', '),ic:H[r[0]][0],f:function(){harfDers(r[0],r[1],this)},q:function(){return harfQuiz(H.slice(r[0],r[1]))}})});
ders({u:'Harfler',id:'yaz',t:'Harflerin bitişik yazılışı',s:'Başta, ortada, sonda · bitişmeyen 6 harf',ic:'ـبـ',f:bitisik,q:function(){return formQuiz()}});
ders({u:'Harekeler',id:'ustun',t:'Üstün (fetha)',s:'Harfin üstünde kısa çizgi: e / a',ic:'بَ',f:function(){hareke(0,this)},q:function(){return heceQuiz([0])}});

ders({u:'Okuma kuralları',id:'sedde',t:'Şedde',s:'Harfi iki kez okumak',ic:'رَبِّ',f:sedde,q:function(){return listeQuiz(SEDD)}});

  durdur();document.getElementById('ttl').textContent="Kur'an Öğren";document.getElementById('ana').hidden=true;
  var n=D.filter(function(d){return bitirildi(d.id)}).length,h='<h1>Kur’an Öğrenme (Elif-Bâ)</h1><p class="lead">Harflerden başlayıp kısa sûreleri okumaya kadar, adım adım. Her harfe ve heceye dokununca sesini duyarsın; her dersin sonunda kısa bir sınav var.</p><div class="prog"><i style="width:'+Math.round(n/D.length*100)+'%"></i></div><p class="lead" style="font-size:14px">'+n+' / '+D.length+' ders tamamlandı</p>';

   '<div class="nav">'+(on?'<a class="btn" href="#'+on.id+'">‹ '+esc(on.t)+'</a>':'<span></span>')+(ar?'<a class="btn" href="#'+ar.id+'">'+esc(ar.t)+' ›</a>':'')+'</div>';

function giris(){sayfa(this,

function heceQuiz(hs){var out=[];shuffle(H).slice(0,10).forEach(function(x){var hi=hs[Math.floor(Math.random()*hs.length)],d=oku(x[0],hi),pool={};pool[d]=1;
  var adaylar=shuffle([[x[0],(hi+1)%3],[x[0],(hi+2)%3]].concat(shuffle(H).slice(0,6).map(function(y){return [y[0],hi]})));var k=[d];
  adaylar.forEach(function(c){var o=oku(c[0],c[1]);if(k.length<4&&!pool[o]){pool[o]=1;k.push(o)}});out.push({s:x[0]+HAR[hi],q:'Bu hece nasıl okunur?',d:d,k:shuffle(k)})});return out}

function kalinQuiz(){return shuffle(H).slice(0,10).map(function(x){var k=KALIN.indexOf(x[0])>=0;return {s:x[0],q:'Bu harf kalın mı okunur, ince mi?',d:k?'Kalın':'İnce',k:['Kalın','İnce']}})}
function quiz(d,Q){
  var el=document.getElementById('quiz'),i=0,dg=0;
  function goster(){
    if(i>=Q.length){var y=Math.round(dg/Q.length*100);el.innerHTML='<div class="score">'+dg+' / '+Q.length+'</div><p style="text-align:center">'+(y>=80?'Çok güzel! Bu dersi tamamladın.':'Biraz daha tekrar edip yeniden dene; %80 ve üstü dersi tamamlar.')+'</p><div class="row" style="justify-content:center"><button class="btn" id="yeni">Yeniden dene</button>'+(D[D.indexOf(d)+1]?'<a class="btn pri" href="#'+D[D.indexOf(d)+1].id+'">Sonraki ders ›</a>':'')+'</div>';
      if(y>=80){S.ok[d.id]=1;sv(S)}document.getElementById('yeni').onclick=function(){quiz(d,d.q())};return}
    var q=Q[i],arKey=/[؀-ۿ]/.test(q.k[0]);
    el.innerHTML='<p class="q">'+(i+1)+'/'+Q.length+' · '+esc(q.q)+'</p><div class="qs ar" data-say="'+esc(q.s)+'">'+esc(q.s)+'</div><div class="opts">'+q.k.map(function(o){return '<button class="btn'+(arKey?' ar':'')+'" data-o="'+esc(o)+'">'+esc(o)+'</button>'}).join('')+'</div>';
    [].forEach.call(el.querySelectorAll('[data-o]'),function(b){b.onclick=function(){
      if(el.dataset.kilit)return;el.dataset.kilit=1;var ok=b.dataset.o===q.d;if(ok)dg++;
      [].forEach.call(el.querySelectorAll('[data-o]'),function(x){if(x.dataset.o===q.d)x.classList.add('ok')});if(!ok)b.classList.add('bad');
      setTimeout(function(){delete el.dataset.kilit;i++;goster()},ok?650:1300)}})}
  goster()}
