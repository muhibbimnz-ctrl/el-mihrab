<style>

.lst,.kart,.nev,.not,.sek button,.sek a,#pop{background:#1b231f;color:#e2e8e2;border-color:#2a352f}.pnl,.nev .tn{background:#222c27}.btns button{background:#1f2823;color:#e2e8e2;border-color:#34413a}

<script>setTimeout(function(){if(!window.FIKIH_HAZIR){var m=document.getElementById("m");if(m)m.innerHTML='<p class="not">Sayfa açılamadı. <button onclick="location.reload()" style="border:0;border-radius:10px;padding:6px 12px;font:600 14px system-ui;background:#2f5d4e;color:#fff">Yenile</button> <a href="./?onar">Uygulamayı onar</a></p>'}},9000)</script>

<script>window.FIKIH_HAZIR=1;
var M=document.getElementById('m'),MS=[],KL=[],KC={},acik='';
var MZ=[['maliki','Mâlikî'],['safii','Şâfiî'],['hanbeli','Hanbelî']];
var KAD={kuduri:'Kudûrî',hidaye:'Hidâye',ihtiyar:'el-İhtiyâr',kenz:'Kenz',bidaye:'Bidâyetü’l-Müctehid',risale:'er-Risâle',minhac:'Minhâc',umde:'Umde'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var HV='8';function getJ(u){return fetch(u+'?v='+HV,{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json()})}
function pop(h){document.getElementById('pc').innerHTML=h;document.getElementById('pop').classList.add('on')}
document.getElementById('px').onclick=function(){document.getElementById('pop').classList.remove('on')};
function anrm(t){return (t||'').replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')}
function sek(w){document.getElementById('sM').classList.toggle('on',w==='M');document.getElementById('sK').classList.toggle('on',w==='K')}
/* ===== Meseleler ===== */
var BL='',AD=[];
var HK={farz:['#7a1f2b','#fbe9ea'],'vâcip':['#8a5a12','#fbf0dc'],'sünnet':['#1d5531','#e1f2e4'],edep:['#3b4f8a','#e6ebf8'],mekruh:['#555','#eee']};
function meseleListe(f){sek('M');document.getElementById('ttl').textContent='Fıkıh Dirâsesi';
  var bl=[];MS.forEach(function(x){if(bl.indexOf(x.yol[0])<0)bl.push(x.yol[0])});
  var h='<p class="not"><b>Fıkıh Dirâsesi</b> · '+MS.length+' mesele<br>Merkez mezhep Hanefî; diğer üç mezhep yan yana. Delillere dokununca Kur’an ve Hadis Dirâsesi’nde ilgili yer açılır.</p>'+
    '<h2 style="font-size:15px;margin:12px 4px 6px;color:#6d7a72">Adım adım (ilmihal)</h2><div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px">'+AD.map(function(a,i){return '<button class="adb" data-a="'+i+'" style="flex:0 0 auto;border:1px solid #c9d3c6;background:#fff;border-radius:14px;padding:10px 12px;font:600 14px system-ui;color:#2f5d4e;cursor:pointer">'+esc(a.baslik.replace(' nasıl alınır?','').replace(' nasıl yapılır?','').replace(' nasıl kılınır?',''))+'</button>'}).join('')+'</div>'+
    '<h2 style="font-size:15px;margin:14px 4px 6px;color:#6d7a72">Meseleler</h2><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px">'+['Tümü'].concat(bl).map(function(x){var on=(x==='Tümü'?!BL:BL===x);return '<button class="blb" data-b="'+esc(x)+'" style="border:0;border-radius:12px;padding:7px 11px;font:600 13px system-ui;cursor:pointer;background:'+(on?'#2f5d4e':'#e3eae2')+';color:'+(on?'#fff':'#2f5d4e')+'">'+esc(x)+'</button>'}).join('')+'</div>'+
    '<input id="mf" type="search" placeholder="Meselelerde ara: niyet, kurban, faiz…" value="'+esc(f||'')+'" style="width:100%;border:1px solid #c9d3c6;border-radius:14px;padding:11px 12px;font:16px system-ui;margin:4px 0 6px">';
  var g=(f||'').toLocaleLowerCase('tr'),yol='',say=0;
  MS.forEach(function(x,i){if(BL&&x.yol[0]!==BL)return;if(g&&(x.baslik+' '+x.hanefi+' '+x.yol.join(' ')+' '+x.ar).toLocaleLowerCase('tr').indexOf(g)<0)return;say++;var y=x.yol.join(' › ');
    if(y!==yol){yol=y;h+='<h2 style="font-size:14px;margin:14px 4px 4px;color:#8a6a2c">'+esc(y)+'</h2>'}
    h+='<div class="lst" data-i="'+i+'"><div class="no">'+(i+1)+'</div><div class="t"><b>'+esc(x.baslik)+'</b><small>Hanefî: '+esc(x.hanefi.slice(0,70))+(x.hanefi.length>70?'…':'')+'</small></div><div class="a ar">'+esc(x.ar)+'</div></div>'});
  if(!say)h+='<p class="not">Bulunamadı.</p>';
  M.innerHTML=h;[].forEach.call(M.querySelectorAll('.lst'),function(d){d.onclick=function(){mesele(+d.getAttribute('data-i'))}});
  [].forEach.call(M.querySelectorAll('.adb'),function(d){d.onclick=function(){adim(+d.getAttribute('data-a'))}});
  [].forEach.call(M.querySelectorAll('.blb'),function(d){d.onclick=function(){var v=d.getAttribute('data-b');BL=v==='Tümü'?'':v;meseleListe(document.getElementById('mf').value)}});
  var mf=document.getElementById('mf'),t;mf.oninput=function(){clearTimeout(t);t=setTimeout(function(){meseleListe(mf.value);var e=document.getElementById('mf');e.focus();e.setSelectionRange(e.value.length,e.value.length)},300)};
  if(!f){history.replaceState(null,'','#');scrollTo(0,0)}}
function ayetListe(k){var p=k.split('-'),L=[];MS.forEach(function(x,i){x.delil.forEach(function(d){if(d[0]==='ayet'&&d[2]==='./#'+k&&L.indexOf(i)<0)L.push(i)})});
  sek('M');document.getElementById('ttl').textContent='Âyetü’l-ahkâm';
  var et='';MS.some(function(x){return x.delil.some(function(d){if(d[0]==='ayet'&&d[2]==='./#'+k){et=d[1];return true}})});
  var h='<div class="kart"><div class="bas"><span>Âyetü’l-ahkâm</span><span>'+L.length+' mesele</span></div><div style="font:600 20px system-ui;margin:2px 0 6px">'+esc(et||('Kur’an '+p[0]+':'+p[1]))+'</div><p style="font-size:15px;line-height:1.6;margin:0 0 10px">Bu âyet aşağıdaki fıkıh meselelerinde delil olarak kullanılmıştır.</p><a href="./#'+esc(k)+'" style="display:inline-block;border:1px solid #c9d3c6;border-radius:12px;padding:6px 12px;text-decoration:none;color:#2f5d4e;font:600 14px system-ui">‹ Âyete dön</a></div>';
  L.forEach(function(i){var x=MS[i];h+='<div class="lst" data-i="'+i+'"><div class="no">'+(i+1)+'</div><div class="t"><b>'+esc(x.baslik)+'</b><small>'+esc(x.yol.join(' › '))+'</small></div><div class="a ar">'+esc(x.ar)+'</div></div>'});
  h+='<div class="nav"><button id="ls">Bütün meseleler</button></div>';M.innerHTML=h;
  [].forEach.call(M.querySelectorAll('.lst'),function(d){d.onclick=function(){mesele(+d.getAttribute('data-i'))}});document.getElementById('ls').onclick=function(){meseleListe()};
  history.replaceState(null,'','#ay='+k);scrollTo(0,0)}
function mIdx(id){for(var i=0;i<MS.length;i++)if(MS[i].id===id)return i;return -1}
function adim(i){var a=AD[i];sek('M');document.getElementById('ttl').textContent='Adım adım';
  var h='<div class="kart"><div class="bas"><span>Adım adım · Hanefî</span><span>'+(i+1)+' / '+AD.length+'</span></div><div style="font:600 21px system-ui;margin:2px 0">'+esc(a.baslik)+'</div><div class="ar" style="font-size:22px;color:#6d7a72;margin-bottom:8px">'+esc(a.ar)+'</div><p style="font-size:15px;line-height:1.6;margin:0 0 10px">'+esc(a.giris)+'</p>'+
    '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">'+['farz','vâcip','sünnet','edep'].map(function(k){return '<span style="font:600 12px system-ui;border-radius:10px;padding:3px 8px;color:'+HK[k][0]+';background:'+HK[k][1]+'">'+k+'</span>'}).join('')+'</div>';
  a.adim.forEach(function(s,j){var c=HK[s[1]]||HK.edep,mi=s[2]?mIdx(s[2]):-1;
    h+='<div style="display:flex;gap:10px;padding:10px 0;border-top:1px solid #e3e8df"><div style="flex:0 0 28px;height:28px;border-radius:50%;background:#2f5d4e;color:#fff;font:600 13px system-ui;display:flex;align-items:center;justify-content:center">'+(j+1)+'</div><div style="flex:1"><div style="font-size:16px;line-height:1.5">'+esc(s[0])+' <span style="font:600 12px system-ui;border-radius:10px;padding:2px 8px;color:'+c[0]+';background:'+c[1]+';white-space:nowrap">'+esc(s[1])+'</span></div>'+(s[3]?'<div style="font-size:13.5px;color:#6d7a72;margin-top:2px">'+esc(s[3])+'</div>':'')+(mi>=0?'<button class="am" data-m="'+mi+'" style="margin-top:6px;border:1px solid #c9d3c6;background:#fff;border-radius:10px;padding:4px 10px;font:600 12.5px system-ui;color:#2f5d4e;cursor:pointer">Mezhepler ve delil: '+esc(MS[mi].baslik)+' ›</button>':'')+'</div></div>'});
  h+='</div><div class="nav"><button id="ön">‹ Önceki</button><button id="ls">Liste</button><button id="sn">Sonraki ›</button></div>';
  M.innerHTML=h;[].forEach.call(M.querySelectorAll('.am'),function(d){d.onclick=function(){mesele(+d.getAttribute('data-m'))}});
  document.getElementById('ön').onclick=function(){if(i>0)adim(i-1)};document.getElementById('sn').onclick=function(){if(i<AD.length-1)adim(i+1)};document.getElementById('ls').onclick=function(){meseleListe()};
  history.replaceState(null,'','#a='+a.id);scrollTo(0,0)}
var KK='mihrab.fikihKayit';function kayitlar(){try{return JSON.parse(localStorage.getItem(KK)||'[]')}catch(e){return []}}
function kayitDegis(id){var L=kayitlar(),i=L.indexOf(id);if(i>=0)L.splice(i,1);else L.unshift(id);try{localStorage.setItem(KK,JSON.stringify(L))}catch(e){}return i<0}
function ibIsle(p,ph){var e=esc(p),g=anrm(ph),n=anrm(e);if(n.length!==e.length)return e;var j=n.indexOf(g);if(j<0)return e;return e.slice(0,j)+'<mark style="background:#f3d98b;color:inherit;border-radius:4px">'+e.slice(j,j+g.length)+'</mark>'+e.slice(j+g.length)}
function mesele(i){var x=MS[i];document.getElementById('ttl').textContent=x.baslik;acik='';
  var h='<div class="kart"><div class="bas"><span>'+esc(x.yol.join(' › '))+'</span><span>'+(i+1)+' / '+MS.length+'</span></div>'+
    '<div style="font:600 21px system-ui;margin:2px 0">'+esc(x.baslik)+'</div><div class="ar" style="font-size:24px;color:#6d7a72;margin-bottom:10px">'+esc(x.ar)+'</div>'+
    '<div style="background:#e1f2e4;color:#1d5531;border-radius:14px;padding:10px 12px;font-size:16px;line-height:1.6;margin-bottom:10px"><b>Hanefî:</b> '+esc(x.hanefi)+'</div>'+(x.ibare?'<div style="border:1px solid #e3d9bf;background:#fbf7ec;border-radius:14px;padding:10px 12px;margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:center;font:600 12.5px system-ui;color:#8a6a2c;margin-bottom:4px"><span>Kudûrî’de geçtiği gibi</span><button id="ibAc" style="border:0;background:none;color:#2f5d4e;font:600 12.5px system-ui;cursor:pointer">Bölümü aç ›</button></div><div class="ar" dir="rtl" style="font-size:21px;line-height:1.9;text-align:right">'+ibIsle(x.ibare[2],x.ibare[3])+'</div></div>':'')+
    '<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px">'+MZ.map(function(z){var v=x.mez[z[0]];return '<div class="mz" data-z="'+z[0]+'" style="border:1px solid #d9e1d5;border-radius:12px;padding:8px 10px;cursor:pointer"><b style="font-size:14px">'+z[1]+'</b><br><span style="font-size:14px;color:#33403a">'+esc(v[0])+'</span></div>'}).join('')+
    '<div style="border:1px solid #d9e1d5;border-radius:12px;padding:8px 10px;background:#f6f8f3"><b style="font-size:14px">İhtilaf sebebi</b><br><span style="font-size:13px;color:#33403a">'+esc(x.sebep.slice(0,90))+'…</span></div></div>'+
    '<div style="font-size:14.5px;line-height:1.8;margin-bottom:8px"><span style="color:#6d7a72">Delil:</span> '+x.delil.map(function(d,j){return '<a class="trm" href="'+d[2]+'" style="text-decoration:none">'+esc(d[1])+'</a>'}).join(' · ')+'</div>'+
    '<div class="btns"><button data-k="mez">Mezhepler</button><button data-k="sebep">İhtilaf sebebi</button><button data-k="delil">Delil</button><button data-k="usul">Usûl</button><button data-k="metin">Metin</button><button data-k="kaydet">'+(kayitlar().indexOf(x.id)>=0?'Kaydedildi ♥':'Kaydet')+'</button><button data-k="kopya">Kopyala</button><button data-k="pay">Paylaş</button></div><div id="pn"></div></div>'+
    '<div class="nav"><button id="ön">‹ Önceki</button><button id="ls">Meseleler</button><button id="sn">Sonraki ›</button></div>';
  M.innerHTML=h;var pn=document.getElementById('pn');var ia=document.getElementById('ibAc');if(ia)ia.onclick=function(){kitapBolum('kuduri',x.ibare[1],x.ibare[3],i)};
  [].forEach.call(M.querySelectorAll('.mz'),function(d){d.onclick=function(){var z=d.getAttribute('data-z'),v=x.mez[z];pop('<h3>'+MZ.filter(function(q){return q[0]===z})[0][1]+': '+esc(v[0])+'</h3><p>'+esc(v[1])+'</p>')}});
  [].forEach.call(M.querySelectorAll('.btns button'),function(b){b.onclick=function(){var k=b.getAttribute('data-k');

function kitapAl(k){return KC[k]?Promise.resolve(KC[k]):getJ('data/fikih/'+k+'.json').then(function(d){KC[k]=d.s;return d.s})}

  kitapAl(k).then(function(S){document.getElementById('ttl').textContent=b.ad;
    M.innerHTML='<p class="not"><b>'+esc(b.ad)+'</b> <span class="ar" style="font-size:18px">'+esc(b.ar)+'</span><br>'+esc(b.muellif)+'</p><input id="uf" type="search" placeholder="Bölümlerde ara (Arapça)" style="width:100%;border:1px solid #c9d3c6;border-radius:14px;padding:10px 12px;font:16px system-ui;margin:4px 0 8px"><div id="ul"></div><div class="nav"><button onclick="kutuphane()">‹ Kütüphane</button></div>';
    var UL=document.getElementById('ul');
    function ciz(f,lim){lim=lim||250;var g=anrm(f),x='',say=0,faz=false;S.forEach(function(s,i){if(faz)return;if(g&&anrm(s[0]+' '+s[1]).indexOf(g)<0)return;if(++say>lim){faz=true;return}x+='<div class="lst" data-i="'+i+'" style="padding:10px 12px"><div class="no" style="width:34px;height:34px;font-size:13px">'+(i+1)+'</div><div class="t"><b class="ar" style="font-size:18px;font-weight:400">'+esc(s[0])+'</b></div></div>'});

      [].forEach.call(UL.querySelectorAll('[data-i]'),function(d){d.onclick=function(){kitapBolum(k,+d.getAttribute('data-i'),g?f:'')}})}
    ciz('');var t;document.getElementById('uf').oninput=function(e){clearTimeout(t);t=setTimeout(function(){ciz(e.target.value)},300)};history.replaceState(null,'','#kt='+k);scrollTo(0,0)}).catch(function(){M.innerHTML='<p class="not">Yüklenemedi.</p>'})}
function kitapBolum(k,i,vurgu,donus){var b=KL.filter(function(x){return x.k===k})[0]||{ad:k};M.innerHTML='<p class="not">Yükleniyor…</p>';
  kitapAl(k).then(function(S){var s=S[i];document.getElementById('ttl').textContent=b.ad;
    var v=vurgu?anrm(vurgu):'';
    function isle(p){var e=esc(p).replace(/\*\*([^*]+)\*\*/g,'<b style="color:#8a6a2c">$1</b>');if(!v)return e;var n=anrm(e);if(n.length!==e.length)return e;var o='',j=0,q;while((q=n.indexOf(v,j))>=0){o+=e.slice(j,q)+'<mark style="background:#f3d98b;color:inherit">'+e.slice(q,q+v.length)+'</mark>';j=q+v.length}return o+e.slice(j)}
    M.innerHTML=(donus!=null?'<div class="nav" style="margin-top:0"><button id="geri">‹ Meseleye dön</button></div>':'')+'<div class="kart"><div class="bas"><span>'+esc(b.ad)+'</span><span>'+(i+1)+' / '+S.length+'</span></div><h3 class="ar" style="font-size:24px;color:#2f5d4e;margin:4px 0 10px">'+esc(s[0])+'</h3>'+s[1].split('\n\n').map(function(p){return '<p class="ar" style="font-size:21px;line-height:2;margin:0 0 12px;text-align:justify">'+isle(p)+'</p>'}).join('')+'<div class="btns"><button id="ud">Dinle</button><button id="uc">Kopyala</button></div></div>'+
      '<div class="nav"><button id="up">‹ Önceki</button><button id="ux">Bölümler</button><button id="un">Sonraki ›</button></div>';

    if(donus!=null)document.getElementById('geri').onclick=function(){mesele(donus)};
    document.getElementById('up').onclick=function(){if(i>0)kitapBolum(k,i-1)};document.getElementById('un').onclick=function(){if(i<S.length-1)kitapBolum(k,i+1)};document.getElementById('ux').onclick=function(){kitap(k)};
    document.getElementById('ud').onclick=function(){oku(s[1].replace(/\*\*/g,''),this)};document.getElementById('uc').onclick=function(){try{navigator.clipboard.writeText(s[0]+'\n\n'+s[1].replace(/\*\*/g,'')+'\n— '+b.ad);pop('<p>Kopyalandı.</p>')}catch(e){}};
    history.replaceState(null,'','#kt='+k+'&s='+i)}).catch(function(){M.innerHTML='<p class="not">Yüklenemedi.</p>'})}
var okuyan=null;
function oku(t,bt){if(!('speechSynthesis' in window)){pop('<p>Bu cihazda sesli okuma yok.</p>');return}var ss=speechSynthesis;if(okuyan===bt){ss.cancel();okuyan=null;bt.textContent='Dinle';return}ss.cancel();
  var u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.82;var k='';try{k=localStorage.getItem('mihrab.hadisSes')||''}catch(e){}var v=speechSynthesis.getVoices().filter(function(x){return k?x.voiceURI===k:/^ar/i.test(x.lang)})[0];if(v)u.voice=v;u.pitch=k?1:.75;
  u.onend=function(){if(okuyan===bt){okuyan=null;bt.textContent='Dinle'}};okuyan=bt;bt.textContent='Durdur';ss.speak(u)}
