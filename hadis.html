<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#eef1ec;color:#22302a}

main{max-width:760px;margin:0 auto;padding:12px 12px 90px}

.lst .no{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid #b8975a;color:#8a6a2c;display:flex;align-items:center;justify-content:center;font:600 15px system-ui}
.lst .t{flex:1;min-width:0}.lst b{display:block;font-size:16px}.lst small{color:#6d7a72}.lst .a{font-size:20px;color:#2f5d4e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42%}

.kart .bas{display:flex;justify-content:space-between;align-items:center;color:#8a6a2c;font:600 13px system-ui;margin-bottom:6px}

.btns button.on{background:#2f5d4e;color:#fff;border-color:#2f5d4e}

.pnl h3{margin:0 0 6px;font-size:15px;color:#2f5d4e}.pnl p{margin:0 0 8px}.pnl ul{margin:0;padding-left:20px}.pnl li{margin:0 0 6px}

.zn .rv .ar{font-size:19px}.zn .rv small{color:#6d7a72;display:block}

#pop.on{transform:translateX(-50%) translateY(0);visibility:visible}#pop .x{float:right;border:0;background:#e3eae2;border-radius:10px;padding:6px 10px;font:600 14px system-ui;cursor:pointer}
#pop h3{margin:0 0 4px;font-size:18px}#pop .ar{font-size:21px}
.nev{background:#fff;border-radius:18px;padding:14px;margin:10px 0;border:1px solid #e1e6dc}.nev h3{margin:0 0 4px;font-size:17px}.nev .ar.t{font-size:22px;color:#2f5d4e}
.nev .tn{background:#f6f8f3;border-radius:12px;padding:10px 12px;margin:8px 0}.nev.kisa{opacity:.75}

@media(prefers-color-scheme:dark){body{background:#121815;color:#e2e8e2}#hd{background:#18201c;border-color:#2a352f}#hd a.bk{background:#24302a;color:#9fd1bd}
.lst,.kart,.nev,.not,.sek button,.sek a,#pop{background:#1b231f;color:#e2e8e2;border-color:#2a352f}.pnl,.nev .tn{background:#222c27}.btns button{background:#1f2823;color:#e2e8e2;border-color:#34413a}
.mtn{color:#bfe3d3}.meal{color:#cfd8d2}.zn .rv{background:#1f2823;border-color:#34413a}#pop .x{background:#2a352f;color:#e2e8e2}}

<div id="hd"><div class="top"><a class="bk" href="./">‹ el-Mihrâb</a><h1 id="ttl">Hadis Dirâsesi</h1><span style="width:70px"></span></div>
<div class="sek"><a href="./?dirase=kuran">Kur'an Dirâsesi</a><button id="sH" class="on">Hadis</button><button id="sU">Usûl · Bâis</button></div></div>
<main id="m"><p class="not">Yükleniyor…</p></main>
<script>setTimeout(function(){if(!window.HADIS_HAZIR){var m=document.getElementById("m");if(m)m.innerHTML='<p class="not">Sayfa açılamadı. <button onclick="location.reload()" style="border:0;border-radius:10px;padding:6px 12px;font:600 14px system-ui;background:#2f5d4e;color:#fff">Yenile</button> <a href="./?onar" style="margin-left:6px">Uygulamayı onar</a></p>'}},9000)</script>
<div id="pop"><button class="x" id="px">Kapat</button><div id="pc"></div></div>
<script>window.HADIS_HAZIR=1;
var M=document.getElementById('m'),E=null,B=null,R={},cur=0,acik='';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
/* Metin içi işaretler: {t:anahtar|görünen} usûl terimi (Bâis'e bağlanır), {r:id|görünen} râvî, **kalın** */
function zen(s){return esc(s).replace(/\{t:([a-z0-9_]+)\|([^}]*)\}/g,'<span class="trm" data-t="$1">$2</span>').replace(/\{r:([a-z0-9_]+)\|([^}]*)\}/g,'<span class="rv" data-r="$1">$2</span>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}
var HV='2';function dv(u){return /^data\/(hadis|usul)\//.test(u)?u+(u.indexOf('?')<0?'?v=':'&v=')+HV:u}
function getJ(u){u=dv(u);return fetch(u,{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json()})}
function pop(h){document.getElementById('pc').innerHTML=h;document.getElementById('pop').classList.add('on')}
document.getElementById('px').onclick=function(){document.getElementById('pop').classList.remove('on')};
function nevBul(k){if(!B)return null;for(var i=0;i<B.nev.length;i++)if(B.nev[i].k===k||(B.nev[i].al||[]).indexOf(k)>=0)return B.nev[i];return null}
function terimAc(k){var n=nevBul(k);if(!n){pop('<p>Bu terim için açıklama hazırlanıyor.</p>');return}
  pop('<h3>'+n.n+'. nev’ · '+esc(n.tr)+'</h3><div class="ar" style="color:#2f5d4e">'+esc(n.ar)+'</div>'+(n.tanim?'<div class="ar" style="margin:6px 0">'+esc(n.tanim)+'</div>':'')+'<p>'+zen(n.ozet||'')+'</p><p><button class="x" style="float:none" onclick="usul('+n.n+')">Bâis’te bu bölümü aç ›</button></p>')}
function raviAc(id){var r=E.rical[id];if(!r){pop('<p>Bilgi yok.</p>');return}
  pop('<h3>'+esc(r.ad)+'</h3><div class="ar">'+esc(r.ar)+'</div><p style="color:#6d7a72;margin:2px 0 8px">'+esc(r.v||'')+'</p><p>'+zen(r.not||'')+'</p>')}
document.addEventListener('click',function(e){var t=e.target.closest('[data-t]');if(t){terimAc(t.getAttribute('data-t'));return}var r=e.target.closest('[data-r]');if(r){raviAc(r.getAttribute('data-r'));return}});
var PN=[['serh','Şerh'],['meal','Meâl'],['vurud','Vürûd sebebi'],['tahric','Tahrîc'],['sened','Sened'],['fikh','Fıkhu’l-hadîs'],['dinle','Dinle'],['kaydet','Kaydet'],['kopya','Kopyala']];
function liste(){document.getElementById('ttl').textContent='Kırk Hadis';acik='';
  var h='<p class="not"><b>'+esc(E.kitap)+'</b> — '+esc(E.aciklama)+'</p>';
  E.h.forEach(function(x,i){h+='<div class="lst" data-i="'+i+'"><div class="no">'+x.n+'</div><div class="t"><b>'+esc(x.baslik)+'</b><small>'+esc(x.kaynak||'')+'</small></div><div class="a ar">'+esc(x.kisa||'')+'</div></div>'});
  if(E.yakinda)h+='<p class="not">'+esc(E.yakinda)+'</p>';h+='<div class="nav"><button onclick="kutuphane()">‹ Kütüphane</button></div>';
  M.innerHTML=h;[].forEach.call(M.querySelectorAll('.lst'),function(d){d.onclick=function(){hadis(+d.getAttribute('data-i'))}});
  history.replaceState(null,'','#k=erbain');scrollTo(0,0)}
function panel(x,k){var p=x.p||{},v=p[k],h='';
  if(k==='sened'){h='<h3>Sened · '+esc(x.senedKaynak||'')+'</h3><div class="zn">';(x.sened||[]).forEach(function(id,j){var r=E.rical[id]||{ad:id,ar:''};h+='<div class="h"><i>'+(j?'↓':'•')+'</i><div class="rv" data-r="'+id+'"><span class="ar">'+esc(r.ar)+'</span><small>'+esc(r.ad)+(r.v?' · '+esc(r.v):'')+'</small></div></div>'});h+='</div>'+(p.sened?'<p style="margin-top:8px">'+zen(p.sened)+'</p>':'');return h}
  if(k==='usul'){h='<h3>Bu hadiste usûl</h3>'+(v?'<p>'+zen(v)+'</p>':'');h+='<p>Terimlere dokununca İbn Kesîr’in <i>İhtisâru Ulûmi’l-Hadîs</i> (el-Bâis el-Hasîs) tertibindeki ilgili bölüm açılır.</p>';return h}
  if(!v)return '<p>Bu bölüm hazırlanıyor.</p>';
  if(k==='irab')return '<table class="ir">'+v.map(function(a){return '<tr><td class="ar">'+esc(a[0])+'</td><td>'+zen(a[1])+'</td></tr>'}).join('')+'</table>';
  if(k==='garib')return '<table class="ir">'+v.map(function(a){return '<tr><td class="ar">'+esc(a[0])+'</td><td>'+zen(a[1])+'</td></tr>'}).join('')+'</table>';
  if(k==='meal')return v.map(function(a){return '<h3>'+esc(a[0])+'</h3><p>'+zen(a[1])+'</p>'}).join('');
  if(k==='fikh')return '<ul>'+v.map(function(a){return '<li>'+zen(a)+'</li>'}).join('')+'</ul>';
  return v.split('\n\n').map(function(a){return '<p>'+zen(a)+'</p>'}).join('')}
function hadis(i){cur=i;var x=E.h[i];document.getElementById('ttl').textContent=x.n+'. '+x.baslik;
  var isn=zen(x.isnad||'').replace(/<span class="rv"/g,'<span class="rv"');
  var h='<div class="kart"><div class="bas"><span>'+esc(E.kisaAd)+' · '+x.n+'</span><span>'+esc(x.kaynak||'')+'</span></div>'+
    (x.isnad?'<div class="isn ar">'+isn+'</div>':'')+'<div class="mtn ar">'+esc(x.matn)+'</div><div class="meal">'+esc(x.mealKisa)+'</div>'+
    '<div class="roz">'+(x.derece||[]).map(function(d){return '<span class="'+(d[2]||'d1')+'" data-t="'+d[0]+'">'+esc(d[1])+'</span>'}).join('')+'</div>'+
    '<div class="btns">'+PN.map(function(p){return '<button data-k="'+p[0]+'">'+p[1]+'</button>'}).join('')+'</div><div id="pn"></div></div>'+
    '<div class="nav"><button id="ön">‹ Önceki</button><button id="ls">Liste</button><button id="sn">Sonraki ›</button></div>';
  M.innerHTML=h;var kb=M.querySelector('.btns button[data-k=kaydet]');if(kb&&kayitVar('erbain',x.n))kb.textContent='Kaydedildi ♥';
  [].forEach.call(M.querySelectorAll('.btns button'),function(b){b.onclick=function(){var k=b.getAttribute('data-k'),pn=document.getElementById('pn');
    if(k==='dinle'){oku(x.matn,b);return}if(k==='kopya'){try{navigator.clipboard.writeText(x.matn+'\n\n'+x.mealKisa+'\n— Nevevî, Kırk Hadis '+x.n);pop('<p>Hadis kopyalandı.</p>')}catch(e){}return}
    if(k==='kaydet'){var v=kayitDegis({k:'erbain',n:x.n,e:'Kırk Hadis '+x.n+' · '+x.baslik,ar:x.matn,tr:x.mealKisa,l:'#h='+x.n});b.textContent=v?'Kaydedildi ♥':'Kaydet';return}
    if(acik===k){acik='';pn.innerHTML='';b.classList.remove('on');return}
    [].forEach.call(M.querySelectorAll('.btns button'),function(z){z.classList.remove('on')});b.classList.add('on');acik=k;
    pn.innerHTML='<div class="pnl">'+panel(x,k)+'</div>'}});
  document.getElementById('ön').onclick=function(){if(i>0)hadis(i-1)};document.getElementById('sn').onclick=function(){if(i<E.h.length-1)hadis(i+1)};document.getElementById('ls').onclick=liste;
  acik='';history.replaceState(null,'','#h='+x.n);scrollTo(0,0)}
function usul(n){document.getElementById('pop').classList.remove('on');sek('U');
  var h='<p class="not"><b>'+esc(B.kitap)+'</b><br>'+esc(B.aciklama)+'</p>';
  B.nev.forEach(function(x){h+='<div class="nev'+(x.ozet?'':' kisa')+'" id="nv'+x.n+'"><h3>'+x.n+'. '+esc(x.tr)+'</h3><div class="ar t">'+esc(x.ar)+'</div>'+(x.tanim?'<div class="tn ar">'+esc(x.tanim)+'</div>':'')+(x.ozet?'<p>'+zen(x.ozet)+'</p>':'<p style="color:#6d7a72">Özeti hazırlanıyor.</p>')+(x.ornek?'<p><b>Kırk Hadis’ten örnek:</b> '+zen(x.ornek)+'</p>':'')+'</div>'});
  h+='<div class="nav"><button onclick="usulKutup()">‹ Usûl kütüphanesi</button></div>';  M.innerHTML=h;document.getElementById('ttl').textContent='Usûl · el-Bâis el-Hasîs';
  if(n){var e=document.getElementById('nv'+n);e&&e.scrollIntoView({block:'start'});history.replaceState(null,'','#u='+n)}else{scrollTo(0,0);history.replaceState(null,'','#u')}}
function sek(w){document.getElementById('sH').classList.toggle('on',w==='H');document.getElementById('sU').classList.toggle('on',w==='U')}

/* ===== Kütüphane: Kırk Hadis (el-Mihrâb dirâsesi) + açık hadis kaynağından kitaplar ===== */
var KT=null,API=['https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/','https://fastly.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/'];
function apiJ(yol){var i=0;function dene(){return fetch(API[i]+yol).then(function(r){if(!r.ok)throw 0;return r.json()}).catch(function(e){if(++i<API.length)return dene();throw e})}return dene()}
function kitapBul(k){for(var i=0;i<KT.length;i++)if(KT[i].k===k){if(!KT[i].src)KT[i].src='fa';return KT[i]}return null}
function kutuphane(){sek('H');document.getElementById('ttl').textContent='Hadis Dirâsesi';
  var h='<div class="lst" data-k="erbain"><div class="no" style="border-color:#2f5d4e;color:#2f5d4e">٤٠</div><div class="t"><b>Kırk Hadis — İmam Nevevî</b><small>el-Mihrâb dirâsesi: şerh, sened, tahrîc, fıkıh, usûl</small></div></div>';
  h='<div style="background:#fff;border:1px solid #e1e6dc;border-radius:18px;padding:12px;margin:8px 0"><div style="display:flex;gap:8px"><input id="aq" type="search" placeholder="Hadislerde ara: niyet, النيات, Ebû Hüreyre…" style="flex:1;min-width:0;border:1px solid #c9d3c6;border-radius:14px;padding:11px 12px;font:16px system-ui"><button id="ab" style="border:0;border-radius:14px;padding:10px 16px;background:#2f5d4e;color:#fff;font:600 15px system-ui">Ara</button></div>'+
    '<select id="ak2" style="margin-top:8px;width:100%;border:1px solid #c9d3c6;border-radius:12px;padding:9px;font:15px system-ui;background:#fff"><option value="sitte">Kütüb-i sitte + Kırk Hadis</option><option value="tisa">Kütüb-i tis‘a (9 kitap)</option><option value="hepsi">Bütün kitaplar (32)</option>'+KT.map(function(b){return '<option value="k:'+b.k+'">'+esc(b.ad)+'</option>'}).join('')+'</select>'+
    '<p style="font-size:12.5px;color:#6d7a72;margin:6px 2px 0">Arapça yazarsanız Arapça metinde, Türkçe yazarsanız Türkçe tercümede (Kütüb-i sitte ve Muvatta) arar. Harekesiz yazabilirsiniz.</p></div>'+h;
  var kay=kayitlar();if(kay.length)h+='<div class="lst" data-k="_kayit"><div class="no" style="border-color:#b23a48;color:#b23a48">♥</div><div class="t"><b>Kaydettiklerim</b><small>'+kay.length+' hadis</small></div></div>';
  var GS=['Kütüb-i sitte','Kütüb-i tis‘a','Diğer','Sahihler','Sünenler','Müsnedler','Musannefler','Mu‘cemler','Derlemeler','Ahlak ve şemâil','Kırk hadis'],SR=KT.slice().sort(function(a,b){return GS.indexOf(a.grup)-GS.indexOf(b.grup)});
  var gr='';SR.forEach(function(b){if(b.grup!==gr){gr=b.grup;h+='<h2 style="font-size:15px;margin:16px 4px 4px;color:#6d7a72">'+esc(gr)+'</h2>'}
    h+='<div class="lst" data-k="'+b.k+'"><div class="no">'+b.b.length+'</div><div class="t"><b>'+esc(b.ad)+'</b><small>'+esc(b.muellif)+' · '+b.adet+' hadis'+(b.tr?' · Türkçe':b.src==='yerel'?' · Arapça':' · Arapça + İngilizce')+'</small></div><div class="a ar">'+esc(b.ar)+'</div></div>'});
  h+='<div class="lst" data-k="_ses"><div class="no">♪</div><div class="t"><b>Okuyucu sesi</b><small>Dinle kutucuğu için erkek ses seçimi</small></div></div>';h+='<p class="not">Kitaplar açık kaynaklı hadis veri tabanlarından (hadith-api, hadith-json, Open-Hadith-Data, OpenITI) anında yüklenir. Bölüm açıldıkça indirilir.</p>';
  M.innerHTML=h;var aq=document.getElementById('aq');document.getElementById('ab').onclick=function(){ara(aq.value,document.getElementById('ak2').value)};aq.onkeydown=function(e){if(e.key==='Enter')ara(aq.value,document.getElementById('ak2').value)};
  [].forEach.call(M.querySelectorAll('.lst'),function(d){d.onclick=function(){var k=d.getAttribute('data-k');if(k==='erbain')liste();else if(k==='_kayit')kayitListe();else if(k==='_ses')sesAyar();else kitap(k)}});
  history.replaceState(null,'','#');scrollTo(0,0)}
function kitap(k){var b=kitapBul(k);if(!b)return kutuphane();document.getElementById('ttl').textContent=b.ad;
  var h='<p class="not"><b>'+esc(b.ad)+'</b> <span class="ar" style="font-size:18px">'+esc(b.ar)+'</span><br>'+esc(b.muellif)+' · '+b.adet+' hadis</p>'+

/* ===== Arama ===== */
function anrm(t){return (t||'').replace(/[ً-ٰٟـۖ-ۭ‌-‏]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[^ء-ي\s]/g,' ').replace(/\s+/g,' ').trim()}

function araKitaplar(kap){var S=['bukhari','muslim','abudawud','tirmidhi','nasai','ibnmajah'];if(kap==='sitte')return S;if(kap==='tisa')return S.concat(['malik','ahmed','darimi']);if(kap.indexOf('k:')===0)return [kap.slice(2)];return KT.map(function(b){return b.k})}
function secAdi(b,sid){var z=b.b.filter(function(q){return q[0]===sid})[0];return z?z[1]:sid}
var ISCI=null;
function araDur(){try{if(ISCI){ISCI.postMessage({tur:'dur'});ISCI.terminate()}}catch(e){}ISCI=null}
function ara(q,kap){q=(q||'').trim();if(q.length<2){pop('<p>En az iki harf yazın.</p>');return}
  var arap=/[؀-ۿ]/.test(q),W=(arap?anrm(q):tnrm(q)).split(' ').filter(function(w){return w.length>1||arap});if(!W.length)return;
  araDur();var L=araKitaplar(kap).map(kitapBul).filter(Boolean);if(!arap)L=L.filter(function(b){return b.tr});
  /* Bütün kitaplarda arama ilk seferde ≈24 MB indirir (sonra telefonda kalır): önceden sor */
  if(L.length>9){var tm=false;try{tm=localStorage.getItem('mihrab.hadisTum')==='1'}catch(e){}
    if(!tm){var cn=navigator.connection,mob=cn&&(cn.saveData||/cellular|2g|3g/.test((cn.type||'')+(cn.effectiveType||'')));
      if(!confirm('Bütün kitaplarda ilk arama yaklaşık 24 MB veri indirir (bir kez; sonra internetsiz de çalışır).'+(mob?' Mobil veri kullanıyorsunuz; Wi-Fi önerilir.':'')+' Devam edilsin mi?\n\nVazgeçerseniz yalnız Kütüb-i Sitte\'de arayabilirsiniz.'))return;
      try{localStorage.setItem('mihrab.hadisTum','1')}catch(e){}}}
  var bulunan=[],gos=0;sek('H');document.getElementById('ttl').textContent='Arama';history.replaceState(null,'','#');
  M.innerHTML='<p class="not">“'+esc(q)+'” aranıyor… <span id="ad"></span><br><button id="adur" style="margin-top:6px;border:0;border-radius:10px;padding:6px 12px;background:#e3eae2;font:600 13px system-ui;cursor:pointer">Durdur</button></p><div id="ar"></div><div class="nav"><button id="akut">‹ Kütüphane</button><button id="am" style="display:none">Daha fazla</button></div>';
  var AR=document.getElementById('ar'),AD=document.getElementById('ad');
  document.getElementById('akut').onclick=function(){araDur();kutuphane()};document.getElementById('adur').onclick=function(){araDur();AD.textContent='— durduruldu, '+bulunan.length+' sonuç';this.remove()};
  function isaretle(x){x=esc(x);W.forEach(function(w){x=x.split(esc(w)).join('<mark style="background:#f3d98b;color:inherit">'+esc(w)+'</mark>')});return x}
  function goster(){var son=Math.min(bulunan.length,gos+30),h='';for(var j=gos;j<son;j++){var r=bulunan[j];h+='<div class="kart" style="padding:12px 14px"><div class="bas"><span>'+esc(r.b.ad)+'</span><span>'+esc(r.etk)+'</span></div><div class="'+(arap?'ar':'')+'" style="'+(arap?'font-size:20px;line-height:1.9':'font-size:15.5px;line-height:1.6')+'">'+isaretle(r.metin)+'</div><div class="btns"><button data-ac="'+j+'">Aç ›</button></div></div>'}
    AR.insertAdjacentHTML('beforeend',h);[].forEach.call(AR.querySelectorAll('[data-ac]'),function(d){d.onclick=function(){araDur();aramaAc(bulunan[+d.getAttribute('data-ac')])}});gos=son;document.getElementById('am').style.display=gos<bulunan.length?'':'none'}
  document.getElementById('am').onclick=goster;
  function etiket(b,ref){return Array.isArray(ref)?(b.src==='hj'?secAdi(b,ref[0])+' · '+ref[1]:'No '+ref[1]):'No '+ref}
  if(kap!=='tisa'&&kap.indexOf('k:')<0&&E){E.h.forEach(function(x){var t=arap?anrm(x.matn):tnrm(x.mealKisa+' '+x.baslik),ok=W.every(function(w){return t.indexOf(w)>=0});if(ok)bulunan.push({b:{ad:'Kırk Hadis (el-Mihrâb)',k:'erbain'},etk:'No '+x.n,metin:t.slice(0,240),ref:x.n})})}
  if(!L.length){AD.textContent='';AR.innerHTML='<p class="not">Seçilen kitabın Türkçe tercümesi yok; Arapça yazarak arayın.</p>';return}
  try{ISCI=new Worker('hadis-arama.js')}catch(e){ISCI=null}
  if(!ISCI){AR.innerHTML='<p class="not">Bu tarayıcı arka planda aramayı desteklemiyor.</p>';return}
  ISCI.onmessage=function(e){var d=e.data,b=kitapBul(d.k);
    if(d.tur==='ilerle')AD.textContent='— '+(b?b.ad:'')+' ('+d.i+'/'+d.n+'), '+bulunan.length+' sonuç';
    else if(d.tur==='sonuc'){d.r.forEach(function(r){bulunan.push({b:b,ref:r[0],metin:r[1],etk:etiket(b,r[0])})});if(gos<30)goster()}
    else if(d.tur==='bitti'){AD.textContent='— '+bulunan.length+' sonuç'+(d.n>=1500?' (ilk 1500)':'');var x=document.getElementById('adur');if(x)x.remove();if(!bulunan.length)AR.innerHTML='<p class="not">Sonuç bulunamadı. Kelimeyi harekesiz ya da daha kısa yazmayı deneyin.</p>';else if(!gos)goster();ISCI&&ISCI.terminate();ISCI=null}};
  ISCI.onerror=function(){AD.textContent='— arama sırasında hata oluştu';araDur()};
  ISCI.postMessage({q:W,arap:arap,sinir:1500,kitaplar:L.map(function(b){return {k:b.k,u:new URL(dv('data/hadis/ara/'+b.k+'.json'),location.href).href}})})}

  if(!Array.isArray(r.ref))return tekHadis(b.k,r.ref);var sec=b.b.filter(function(z){return z[0]===r.ref[0]})[0];if(!sec)return kitap(b.k);
