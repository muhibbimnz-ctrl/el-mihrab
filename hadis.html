<!DOCTYPE html><html lang="tr"><head>
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script src="kalkan.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hadis Dirâsesi — el-Mihrâb</title><meta name="theme-color" content="#2f5d4e">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#eef1ec;color:#22302a}
#hd{background:#f7f6ef;border-bottom:1px solid #d9dccf;padding:10px 12px;position:sticky;top:0;z-index:5}
#hd .top{display:flex;align-items:center;gap:8px}#hd a.bk{color:#2f5d4e;text-decoration:none;font:600 15px system-ui;padding:8px 10px;border-radius:12px;background:#e3eae2;white-space:nowrap}
#hd h1{margin:0;font:600 17px system-ui;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sek{display:flex;gap:6px;margin-top:10px}.sek button,.sek a{flex:1;text-align:center;border:1px solid #c9d3c6;background:#fff;border-radius:14px;padding:9px 6px;font:600 14px system-ui;color:#3d4d45;cursor:pointer;text-decoration:none}
.sek .on{background:#2f5d4e;color:#fff;border-color:#2f5d4e}
main{max-width:760px;margin:0 auto;padding:12px 12px 90px}
.ar{direction:rtl;font-family:Amiri,serif}
.lst{display:flex;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:12px 14px;margin:8px 0;cursor:pointer;border:1px solid #e1e6dc}
.lst .no{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid #b8975a;color:#8a6a2c;display:flex;align-items:center;justify-content:center;font:600 15px system-ui}
.lst .t{flex:1;min-width:0}.lst b{display:block;font-size:16px}.lst small{color:#6d7a72}.lst .a{font-size:20px;color:#2f5d4e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42%}
.kart{background:#fff;border-radius:24px;padding:16px 16px 12px;margin:12px 0;border:1px solid #e1e6dc;box-shadow:0 2px 10px rgba(30,50,40,.05)}
.kart .bas{display:flex;justify-content:space-between;align-items:center;color:#8a6a2c;font:600 13px system-ui;margin-bottom:6px}
.isn{font-size:17px;color:#6d7a72;line-height:1.9}.isn .rv{color:#2f5d4e;border-bottom:1.5px dotted #2f5d4e;cursor:pointer}
.mtn{font-size:27px;line-height:2.05;color:#173a2e;margin:4px 0 8px}
.meal{font-family:Lora,Georgia,serif;font-style:italic;font-size:17px;line-height:1.6;color:#33403a;margin:6px 0 10px}
.roz{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.roz span{font-size:12.5px;padding:4px 10px;border-radius:10px;cursor:pointer}
.roz .d1{background:#e1f2e4;color:#22663a}.roz .d2{background:#e6eef8;color:#244f80}.roz .d3{background:#f6ecd9;color:#7a5418}
.btns{display:flex;flex-wrap:wrap;gap:8px;border-top:1px dashed #cfd8cb;padding-top:10px}
.btns button{border:1px solid #c9d3c6;background:#fbfcfa;border-radius:16px;padding:9px 14px;font:600 14.5px system-ui;color:#2f3d36;cursor:pointer}
.btns button.on{background:#2f5d4e;color:#fff;border-color:#2f5d4e}
.pnl{margin-top:10px;background:#f6f8f3;border-radius:16px;padding:12px 14px;font-size:16px;line-height:1.7}
.pnl h3{margin:0 0 6px;font-size:15px;color:#2f5d4e}.pnl p{margin:0 0 8px}.pnl ul{margin:0;padding-left:20px}.pnl li{margin:0 0 6px}
.pnl .ar{font-size:21px;line-height:1.9}
.trm{color:#244f80;border-bottom:1.5px dotted #244f80;cursor:pointer}
table.ir{width:100%;border-collapse:collapse}table.ir td{border-bottom:1px solid #e1e6dc;padding:6px 4px;vertical-align:top}table.ir td.ar{font-size:21px;width:32%;white-space:nowrap}
.zn{display:flex;flex-direction:column;gap:6px}.zn .h{display:flex;gap:8px;align-items:flex-start}.zn .h i{font-style:normal;color:#b8975a}.zn .rv{background:#fff;border:1px solid #d9e1d5;border-radius:12px;padding:8px 10px;cursor:pointer;flex:1}
.zn .rv .ar{font-size:19px}.zn .rv small{color:#6d7a72;display:block}
#pop{position:fixed;left:50%;bottom:14px;transform:translateX(-50%) translateY(140%);width:min(600px,calc(100% - 20px));max-height:72vh;overflow:auto;background:#fff;border-radius:22px;padding:16px;box-shadow:0 14px 40px rgba(0,0,0,.28);transition:transform .2s;z-index:20;visibility:hidden;line-height:1.65}
#pop.on{transform:translateX(-50%) translateY(0);visibility:visible}#pop .x{float:right;border:0;background:#e3eae2;border-radius:10px;padding:6px 10px;font:600 14px system-ui;cursor:pointer}
#pop h3{margin:0 0 4px;font-size:18px}#pop .ar{font-size:21px}
.nev{background:#fff;border-radius:18px;padding:14px;margin:10px 0;border:1px solid #e1e6dc}.nev h3{margin:0 0 4px;font-size:17px}.nev .ar.t{font-size:22px;color:#2f5d4e}
.nev .tn{background:#f6f8f3;border-radius:12px;padding:10px 12px;margin:8px 0}.nev.kisa{opacity:.75}
.not{font-size:13px;color:#6d7a72;background:#fff;border-radius:14px;padding:10px 12px;line-height:1.5;margin:8px 0}
.nav{display:flex;justify-content:space-between;gap:8px;margin:14px 0}.nav button{border:0;border-radius:14px;padding:11px 16px;background:#2f5d4e;color:#fff;font:600 14.5px system-ui;cursor:pointer}
@media(prefers-color-scheme:dark){body{background:#121815;color:#e2e8e2}#hd{background:#18201c;border-color:#2a352f}#hd a.bk{background:#24302a;color:#9fd1bd}
.lst,.kart,.nev,.not,.sek button,.sek a,#pop{background:#1b231f;color:#e2e8e2;border-color:#2a352f}.pnl,.nev .tn{background:#222c27}.btns button{background:#1f2823;color:#e2e8e2;border-color:#34413a}
.mtn{color:#bfe3d3}.meal{color:#cfd8d2}.zn .rv{background:#1f2823;border-color:#34413a}#pop .x{background:#2a352f;color:#e2e8e2}}
</style></head><body>
<div id="hd"><div class="top"><a class="bk" href="./">‹ el-Mihrâb</a><h1 id="ttl">Hadis Dirâsesi</h1><span style="width:70px"></span></div>
<div class="sek"><a href="./?dirase=kuran">Kur'an Dirâsesi</a><button id="sH" class="on">Hadis</button><button id="sU">Usûl · Bâis</button></div></div>
<main id="m"><p class="not">Yükleniyor…</p></main>
<div id="pop"><button class="x" id="px">Kapat</button><div id="pc"></div></div>
<script>
var M=document.getElementById('m'),E=null,B=null,R={},cur=0,acik='';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
/* Metin içi işaretler: {t:anahtar|görünen} usûl terimi (Bâis'e bağlanır), {r:id|görünen} râvî, **kalın** */
function zen(s){return esc(s).replace(/\{t:([a-z0-9_]+)\|([^}]*)\}/g,'<span class="trm" data-t="$1">$2</span>').replace(/\{r:([a-z0-9_]+)\|([^}]*)\}/g,'<span class="rv" data-r="$1">$2</span>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}
function getJ(u){return fetch(u,{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json()})}
function pop(h){document.getElementById('pc').innerHTML=h;document.getElementById('pop').classList.add('on')}
document.getElementById('px').onclick=function(){document.getElementById('pop').classList.remove('on')};
function nevBul(k){if(!B)return null;for(var i=0;i<B.nev.length;i++)if(B.nev[i].k===k||(B.nev[i].al||[]).indexOf(k)>=0)return B.nev[i];return null}
function terimAc(k){var n=nevBul(k);if(!n){pop('<p>Bu terim için açıklama hazırlanıyor.</p>');return}
  pop('<h3>'+n.n+'. nev’ · '+esc(n.tr)+'</h3><div class="ar" style="color:#2f5d4e">'+esc(n.ar)+'</div>'+(n.tanim?'<div class="ar" style="margin:6px 0">'+esc(n.tanim)+'</div>':'')+'<p>'+zen(n.ozet||'')+'</p><p><button class="x" style="float:none" onclick="usul('+n.n+')">Bâis’te bu bölümü aç ›</button></p>')}
function raviAc(id){var r=E.rical[id];if(!r){pop('<p>Bilgi yok.</p>');return}
  pop('<h3>'+esc(r.ad)+'</h3><div class="ar">'+esc(r.ar)+'</div><p style="color:#6d7a72;margin:2px 0 8px">'+esc(r.v||'')+'</p><p>'+zen(r.not||'')+'</p>')}
document.addEventListener('click',function(e){var t=e.target.closest('[data-t]');if(t){terimAc(t.getAttribute('data-t'));return}var r=e.target.closest('[data-r]');if(r){raviAc(r.getAttribute('data-r'));return}});
var PN=[['serh','Şerh'],['irab','İ’râb'],['belagat','Belâgat'],['garib','Garîb'],['meal','Meâller'],['vurud','Vürûd sebebi'],['tahric','Tahrîc'],['sened','Sened'],['fikh','Fıkhu’l-hadîs'],['usul','Usûl']];
function liste(){document.getElementById('ttl').textContent='Hadis Dirâsesi';acik='';
  var h='<p class="not"><b>'+esc(E.kitap)+'</b> — '+esc(E.aciklama)+'</p>';
  E.h.forEach(function(x,i){h+='<div class="lst" data-i="'+i+'"><div class="no">'+x.n+'</div><div class="t"><b>'+esc(x.baslik)+'</b><small>'+esc(x.kaynak||'')+'</small></div><div class="a ar">'+esc(x.kisa||'')+'</div></div>'});
  if(E.yakinda)h+='<p class="not">'+esc(E.yakinda)+'</p>';
  M.innerHTML=h;[].forEach.call(M.querySelectorAll('.lst'),function(d){d.onclick=function(){hadis(+d.getAttribute('data-i'))}});
  history.replaceState(null,'','#');scrollTo(0,0)}
function panel(x,k){var p=x.p||{},v=p[k],h='';
  if(k==='sened'){h='<h3>Sened · '+esc(x.senedKaynak||'')+'</h3><div class="zn">';(x.sened||[]).forEach(function(id,j){var r=E.rical[id]||{ad:id,ar:''};h+='<div class="h"><i>'+(j?'↓':'•')+'</i><div class="rv" data-r="'+id+'"><span class="ar">'+esc(r.ar)+'</span><small>'+esc(r.ad)+(r.v?' · '+esc(r.v):'')+'</small></div></div>'});h+='</div>'+(p.sened?'<p style="margin-top:8px">'+zen(p.sened)+'</p>':'');return h}
  if(k==='usul'){h='<h3>Bu hadiste usûl</h3>'+(v?'<p>'+zen(v)+'</p>':'');h+='<p>Terimlere dokununca İbn Kesîr’in <i>İhtisâru Ulûmi’l-Hadîs</i> (el-Bâis el-Hasîs) tertibindeki ilgili bölüm açılır.</p>';return h}
  if(!v)return '<p>Bu bölüm hazırlanıyor.</p>';
  if(k==='irab')return '<table class="ir">'+v.map(function(a){return '<tr><td class="ar">'+esc(a[0])+'</td><td>'+zen(a[1])+'</td></tr>'}).join('')+'</table>';
  if(k==='garib')return '<table class="ir">'+v.map(function(a){return '<tr><td class="ar">'+esc(a[0])+'</td><td>'+zen(a[1])+'</td></tr>'}).join('')+'</table>';
  if(k==='meal')return v.map(function(a){return '<h3>'+esc(a[0])+'</h3><p>'+zen(a[1])+'</p>'}).join('');
  if(k==='fikh')return '<ul>'+v.map(function(a){return '<li>'+zen(a)+'</li>'}).join('')+'</ul>';
  return v.split('\n\n').map(function(a){return '<p>'+zen(a)+'</p>'}).join('')}
function hadis(i){cur=i;var x=E.h[i];document.getElementById('ttl').textContent=x.n+'. '+x.baslik;
  var isn=zen(x.isnad||'').replace(/<span class="rv"/g,'<span class="rv"');
  var h='<div class="kart"><div class="bas"><span>'+esc(E.kisaAd)+' · '+x.n+'</span><span>'+esc(x.kaynak||'')+'</span></div>'+
    (x.isnad?'<div class="isn ar">'+isn+'</div>':'')+'<div class="mtn ar">'+esc(x.matn)+'</div><div class="meal">'+esc(x.mealKisa)+'</div>'+
    '<div class="roz">'+(x.derece||[]).map(function(d){return '<span class="'+(d[2]||'d1')+'" data-t="'+d[0]+'">'+esc(d[1])+'</span>'}).join('')+'</div>'+
    '<div class="btns">'+PN.map(function(p){return '<button data-k="'+p[0]+'">'+p[1]+'</button>'}).join('')+'</div><div id="pn"></div></div>'+
    '<div class="nav"><button id="ön">‹ Önceki</button><button id="ls">Liste</button><button id="sn">Sonraki ›</button></div>';
  M.innerHTML=h;
  [].forEach.call(M.querySelectorAll('.btns button'),function(b){b.onclick=function(){var k=b.getAttribute('data-k'),pn=document.getElementById('pn');
    if(acik===k){acik='';pn.innerHTML='';b.classList.remove('on');return}
    [].forEach.call(M.querySelectorAll('.btns button'),function(z){z.classList.remove('on')});b.classList.add('on');acik=k;
    pn.innerHTML='<div class="pnl">'+panel(x,k)+'</div>'}});
  document.getElementById('ön').onclick=function(){if(i>0)hadis(i-1)};document.getElementById('sn').onclick=function(){if(i<E.h.length-1)hadis(i+1)};document.getElementById('ls').onclick=liste;
  acik='';history.replaceState(null,'','#h='+x.n);scrollTo(0,0)}
function usul(n){document.getElementById('pop').classList.remove('on');sek('U');
  var h='<p class="not"><b>'+esc(B.kitap)+'</b><br>'+esc(B.aciklama)+'</p>';
  B.nev.forEach(function(x){h+='<div class="nev'+(x.ozet?'':' kisa')+'" id="nv'+x.n+'"><h3>'+x.n+'. '+esc(x.tr)+'</h3><div class="ar t">'+esc(x.ar)+'</div>'+(x.tanim?'<div class="tn ar">'+esc(x.tanim)+'</div>':'')+(x.ozet?'<p>'+zen(x.ozet)+'</p>':'<p style="color:#6d7a72">Özeti hazırlanıyor.</p>')+(x.ornek?'<p><b>Kırk Hadis’ten örnek:</b> '+zen(x.ornek)+'</p>':'')+'</div>'});
  M.innerHTML=h;document.getElementById('ttl').textContent='Usûl · el-Bâis el-Hasîs';
  if(n){var e=document.getElementById('nv'+n);e&&e.scrollIntoView({block:'start'});history.replaceState(null,'','#u='+n)}else{scrollTo(0,0);history.replaceState(null,'','#u')}}
function sek(w){document.getElementById('sH').classList.toggle('on',w==='H');document.getElementById('sU').classList.toggle('on',w==='U')}
document.getElementById('sH').onclick=function(){sek('H');liste()};document.getElementById('sU').onclick=function(){usul(0)};
Promise.all([getJ('data/hadis/erbain.json'),getJ('data/hadis/bais.json')]).then(function(a){E=a[0];B=a[1];
  var hs=location.hash,m;if((m=/^#h=(\d+)/.exec(hs))){var n=+m[1];for(var i=0;i<E.h.length;i++)if(E.h[i].n===n){hadis(i);return}}
  if((m=/^#u=?(\d*)/.exec(hs))){usul(+m[1]||0);return}liste()}).catch(function(){M.innerHTML='<p class="not">Veri yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin.</p>'});
</script></body></html>
