<!DOCTYPE html>
<html lang="tr"><head>
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script src="kalkan.js"></script><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İhtisas · el-Mihrâb</title>
<meta name="theme-color" content="#3d2a5c">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#f4f0e8;--card:#fffdf8;--ink:#2a2620;--muted:#6f665a;--line:#e3d9c6;--acc:#3d2a5c;--soft:#efe7f7}
@media (prefers-color-scheme:dark){:root{--bg:#15131a;--card:#1f1c26;--ink:#ece6f2;--muted:#a59db0;--line:#332e3d;--soft:#2a2433}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:calc(56px + env(safe-area-inset-top,0px));padding-bottom:48px}
#top{position:fixed;top:0;left:0;right:0;z-index:9;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:var(--acc);color:#fff;transition:background .3s}
#top a{color:#fff;text-decoration:none;background:rgba(255,255,255,.18);border-radius:12px;padding:7px 12px;font-weight:700;cursor:pointer}
#top b{flex:1;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{max-width:820px;margin:0 auto;padding:12px 14px}
.ar{font-family:Amiri,"Noto Naskh Arabic",serif;direction:rtl}
h1{font-size:25px;margin:6px 0 4px}
.lead{color:var(--muted);margin:0 0 14px}
.yol{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:16px}
.yol span{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px 10px}.yol .on{background:#3d2a5c;color:#fff;border-color:#3d2a5c}
.alanlar{display:grid;gap:12px}
@media(min-width:700px){.alanlar{grid-template-columns:1fr 1fr}}
.alan{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.04);transition:transform .15s}
.alan:active{transform:scale(.98)}
.alan .bas{padding:14px 16px 52px;color:#fff;position:relative}
.alan .bas .ar{position:absolute;left:14px;bottom:4px;font-size:28px;opacity:.9;line-height:1.2}
.alan .bas b{display:block;font-size:18px;text-align:right}
.alan .bas small{display:block;text-align:right;opacity:.85;font-size:12.5px}
.alan .alt{padding:10px 16px 14px;font-size:14px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .3s}
.not{margin-top:18px;font-size:13px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:10px 12px}
/* alan sayfası */
.hero{border-radius:24px;color:#fff;padding:22px 18px 18px;margin-bottom:12px;position:relative;overflow:hidden}
.hero .ar{font-size:34px;line-height:1.3;display:block;text-align:right}
.hero h2{margin:6px 0 4px;font-size:22px}.hero p{margin:0;opacity:.9;font-size:14.5px}
.hero .ilr{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px}
.hero .bar{flex:1;background:rgba(255,255,255,.25);margin:0}.hero .bar i{background:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:5;background:var(--bg);padding:8px 0;margin-bottom:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 14px;font:600 14px system-ui;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.bsm{position:relative;padding-left:30px;margin:4px 0 18px}
.bsm:before{content:"";position:absolute;left:11px;top:30px;bottom:-18px;width:2px;background:var(--line)}
.bsm:last-child:before{display:none}
.bsm .nk{position:absolute;left:0;top:2px;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;font:700 13px system-ui;display:flex;align-items:center;justify-content:center}
.bsm h3{margin:0;font-size:17.5px}.bsm .st{font-size:12px;color:var(--acc);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.bsm .ac{color:var(--muted);font-size:14px;margin:2px 0 8px}
.kt{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.kt.ok{border-color:var(--acc)}
.kt .ust{display:flex;gap:10px;align-items:flex-start;padding:12px;cursor:pointer}
.kt .ck{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:none;cursor:pointer;color:#fff;font-weight:900;font-size:15px;line-height:1;padding:0}
.kt.ok .ck{background:var(--acc);border-color:var(--acc)}
.kt .bl{flex:1;min-width:0}
.kt .ad{font-weight:700;font-size:15.5px}.kt.ok .ad{opacity:.75}
.kt .mu{font-size:13px;color:var(--muted)}
.kt .kar{font-size:19px;color:var(--acc);text-align:right;line-height:1.5}
.kt .tur{display:inline-block;font-size:11px;background:var(--soft);color:var(--acc);border-radius:10px;padding:1px 8px;margin-top:3px;font-weight:700}
.kt .dty{display:none;padding:0 12px 12px 48px;font-size:14.5px}
.kt.acik .dty{display:block}
.kt .dty .zn{margin:8px 0 0;padding:0;list-style:none}
.kt .dty .zn li{position:relative;padding:2px 0 2px 18px;color:var(--muted);font-size:13.5px}
.kt .dty .zn li:before{content:"↳";position:absolute;left:0;color:var(--acc)}
.kt .dty a.app{display:inline-block;margin-top:10px;background:var(--acc);color:#fff;text-decoration:none;border-radius:12px;padding:7px 12px;font-weight:700;font-size:13.5px}
.kt .dty .lnk{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.kt .dty .lnk a{font-size:12.5px;color:var(--acc)}
.ok-tag{font-size:12px;color:var(--muted);margin-left:auto}
.sh{display:grid;gap:8px}@media(min-width:700px){.sh{grid-template-columns:1fr 1fr}}
.sh div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.sh b{display:block}.sh .ar{font-size:17px;color:var(--acc)}.sh small{color:var(--muted);font-size:13px;display:block}
.ara{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 12px;font:15px system-ui;margin-bottom:10px}
.tg h4{margin:14px 0 6px;color:var(--acc)}
.tm{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:6px 0;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.tm b{font-size:15px}.tm .ar{font-size:19px;color:var(--acc);grid-row:span 2;align-self:center}.tm small{color:var(--muted);font-size:13.5px}
.gr p{margin:0 0 10px}
.ns{counter-reset:n;list-style:none;padding:0}
.ns li{counter-increment:n;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px 10px 44px;margin:8px 0;position:relative}
.ns li:before{content:counter(n);position:absolute;left:12px;top:10px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font:700 12px system-ui;display:flex;align-items:center;justify-content:center}
.cps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 10px;padding-bottom:2px}.cps::-webkit-scrollbar{display:none}.cps button{flex:none}.cps button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:5px 11px;font:600 13px system-ui;cursor:pointer}.cps button.on{background:var(--soft);color:var(--acc);border-color:var(--acc)}
.sh2{display:grid;gap:8px}@media(min-width:700px){.sh2{grid-template-columns:1fr 1fr;align-items:start}}
.ks{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}.ks .ku{padding:10px 12px}.ks.ac .ku{cursor:pointer}.ks.ac .ku>b:after{content:" ›";color:var(--acc)}.ks.acik .ku>b:after{content:" ⌄"}
.ks .ku b{display:block}.ks .ku .ar{float:right;font-size:17px;color:var(--acc);margin-left:8px}.ks .ku small{color:var(--muted);font-size:13px;display:block}.ks .ku>b small{display:inline;font-weight:400}
.ks .kd{display:none;padding:0 12px 12px;font-size:14.5px}.ks.acik .kd{display:block}.ks .kd ul{margin:4px 0 8px;padding-left:20px}.ks .kd .nt{color:var(--muted);font-size:13.5px;border-left:3px solid var(--acc);padding-left:8px}.ks .kd p{margin:0 0 8px}
.kb{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:7px 0;font-size:14.5px}.kbu{display:flex;gap:10px;justify-content:space-between;align-items:baseline}.kbu .ar{font-size:18px;color:var(--acc);text-align:right}.kb small{color:var(--muted);display:block;margin-bottom:2px}
.dnm{display:grid;gap:8px;margin-bottom:14px}@media(min-width:700px){.dnm{grid-template-columns:1fr 1fr}}.dnm div{background:var(--soft);border-radius:14px;padding:10px 12px}.dnm small{display:block;color:var(--acc);font-weight:700;font-size:12.5px}.dnm p{margin:4px 0 0;font-size:14px}
.tl{position:relative;padding-left:22px}.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.to{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px;margin:0 0 9px}.to:before{content:"";position:absolute;left:-20px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--acc);border:2px solid var(--bg)}
.to .tt{font-size:12.5px;font-weight:800;color:var(--acc);margin-right:6px}.to p{margin:3px 0 0;font-size:14.5px}.to small{color:var(--muted);font-size:13px;display:block;margin-top:3px}
.agc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px}.agc summary{font-weight:700;cursor:pointer;color:var(--acc)}.agc p{font-size:14px;margin:6px 0}
ul.tr,ul.tr ul{list-style:none;padding-left:16px;margin:6px 0}ul.tr li{position:relative;font-size:14px;padding:3px 0}ul.tr ul li:before{content:"└";position:absolute;left:-14px;color:var(--acc)}
.mt{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}.mt p{font-size:14.5px;margin:6px 0}.mta{font-size:20px;line-height:1.9;background:var(--soft);border-radius:10px;padding:8px 12px;margin:6px 0}.mt small{color:var(--muted);display:block}
.edd{margin:0 0 16px}.edd .eh{display:flex;align-items:baseline;gap:8px}.edd .eh b{font-size:17px;color:var(--acc)}.edd .eh small{color:var(--muted)}.edd>p{font-size:14.5px;margin:4px 0 8px}.edd .ks{margin:6px 0}
.nsp{margin-top:8px;background:var(--soft);border-radius:10px;padding:7px 10px;font-size:13.5px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;transition:transform .25s;z-index:20}
#toast.on{transform:translateX(-50%) translateY(0)}
.yuk{padding:40px;text-align:center;color:var(--muted)}
</style></head>
<body>
<div id="top"><a id="geri">‹</a><b id="bas">İhtisas</b></div>
<main id="m"><div class="yuk">Yükleniyor…</div></main>
<div id="toast"></div>
<script>
(function(){
var $=function(s){return document.querySelector(s)},M=$('#m'),C={},LK='ihtisas.okudum.v1';
function oku(){try{return JSON.parse(localStorage.getItem(LK))||{}}catch(e){return{}}}
function yaz(o){try{localStorage.setItem(LK,JSON.stringify(o))}catch(e){}}
function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function nz(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f\u064b-\u0652\u0670’‘']/g,'').toLocaleLowerCase('tr').replace(/ı/g,'i')}
function toast(t){var x=$('#toast');x.textContent=t;x.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){x.classList.remove('on')},2000)}
function al(u){if(C[u])return Promise.resolve(C[u]);return fetch(u).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){return C[u]=j})}
function renk(c){document.documentElement.style.setProperty('--acc',c);$('#top').style.background=c;var m=document.querySelector('meta[name=theme-color]');m&&m.setAttribute('content',c)}
function sayi(id,n){var o=oku(),k=0;for(var x in o)if(o[x]&&x.indexOf(id)===0&&/^\D+\d+$/.test(x)&&x.replace(/\d+$/,'')===id)k++;return k}

function liste(){
 renk('#3d2a5c');$('#bas').textContent='İhtisas';$('#geri').onclick=function(){location.href='index.html'};document.title='İhtisas · el-Mihrâb';
 al('data/ihtisas/liste.json').then(function(L){
  var h='<h1>İhtisas</h1><p class="lead">Bir talebenin bir ilimde ihtiyaç duyduğu her şey: baştan sona okunacak kitaplar ve şerh zincirleri, ilmin tarihi, şahsiyetleri, kütüphanesi, terimleri ve çalışma rehberi.</p>'+
  '<div class="yol"><span>Medrese</span>→<span>Dirâset</span>→<span class="on">İhtisas</span></div><div class="alanlar">';
  L.forEach(function(a){var k=sayi(a.id),p=Math.round(100*k/a.n);
   h+='<a class="alan" href="#'+a.id+'"><div class="bas" style="background:'+a.renk+'"><span class="ar">'+e(a.ar)+'</span><b>'+e(a.ad)+'</b><small>'+a.b+' basamak · '+a.n+' kitap</small></div><div class="alt">'+e(a.kisa)+'<div class="bar" style="--acc:'+a.renk+'"><i style="width:'+p+'%;background:'+a.renk+'"></i></div><small>'+(k?k+' / '+a.n+' kitap okundu':'Henüz başlanmadı')+'</small></div></a>'});
  h+='</div><div class="not">Bu bölümde makale ve tez yoktur; yalnız klasik eserler ve temel kitaplar vardır. Vefat tarihleri hicrî/milâdî verilmiştir. Okuduğun kitapları işaretlersen ilerlemen bu cihazda saklanır.</div>';
  M.innerHTML=h;scrollTo(0,0)
 }).catch(function(){M.innerHTML='<div class="yuk">Liste yüklenemedi. İnternet bağlantını kontrol et.</div>'})
}

var SEK=[['yol','Okuma yolu'],['tar','Tarih'],['sah','Şahsiyetler'],['kut','Kütüphane'],['met','Metinler'],['edb','Edebiyat'],['ter','Terimler'],['nas','Rehber']];
var VAR={yol:'basamaklar',tar:'tarih',sah:'sahsiyetler',kut:'kutuphane',met:'metinler',edb:'edebiyat',ter:'terimler',nas:'nasil'};
function chips(L,on,at){return'<div class="cps">'+L.map(function(x){return'<button data-'+at+'="'+e(x[0])+'"'+(x[0]===on?' class="on"':'')+'>'+e(x[1])+'</button>'}).join('')+'</div>'}
function kisi(s){var ex=s.bio||(s.eserler&&s.eserler.length)||s.notu;return'<div class="ks'+(ex?' ac':'')+'"><div class="ku"><span class="ar">'+e(s.ar)+'</span><b>'+e(s.ad)+(s.v?' <small>(ö. '+e(s.v)+')</small>':'')+'</b><small>'+e([s.alan,s.ekol].filter(Boolean).join(' · '))+'</small><small>'+e(s.k)+'</small></div>'+(ex?'<div class="kd">'+(s.bio?'<p>'+e(s.bio)+'</p>':'')+(s.eserler&&s.eserler.length?'<b>Eserleri</b><ul>'+s.eserler.map(function(x){return'<li>'+e(x)+'</li>'}).join('')+'</ul>':'')+(s.notu?'<p class="nt">'+e(s.notu)+'</p>':'')+'</div>':'')+'</div>'}
function bagKisi(r){[].forEach.call(r.querySelectorAll('.ks.ac .ku'),function(k){k.onclick=function(){k.parentNode.classList.toggle('acik')}})}
function kitapL(L){return L.map(function(b){return'<div class="kb"><div class="kbu"><b>'+e(b.tr)+'</b>'+(b.ar&&b.ar!=='—'?'<span class="ar">'+e(b.ar)+'</span>':'')+'</div><small>'+e(b.mu)+(b.v&&b.v!=='—'?' · '+e(/^\d/.test(b.v)?'ö. '+b.v:b.v):'')+(b.ulke?' · '+e(b.ulke):'')+'</small>'+(b.d?'<div>'+e(b.d)+'</div>':'')+'</div>'}).join('')||'<p class="lead">Sonuç yok.</p>'}
function liste2(ic,L,ph,kat,ciz){var on='';var h='<input class="ara" placeholder="'+ph+'">';var cs=[];L.forEach(function(x){if(cs.indexOf(x[kat])<0)cs.push(x[kat])});
 h+=chips([['','Hepsi']].concat(cs.map(function(c){return[c,c]})),'','c')+'<div class="lst"></div>';ic.innerHTML=h;var q='';
 var f=function(){var Q=nz(q);var r=L.filter(function(x){return(!on||x[kat]===on)&&(!Q||nz(JSON.stringify(x)).indexOf(Q)>-1)});ic.querySelector('.lst').innerHTML=ciz(r);bagKisi(ic)};
 ic.querySelector('.ara').oninput=function(){q=this.value;f()};
 [].forEach.call(ic.querySelectorAll('[data-c]'),function(b){b.onclick=function(){on=b.dataset.c;[].forEach.call(ic.querySelectorAll('[data-c]'),function(x){x.classList.toggle('on',x===b)});f()}});f()}
function tarih(T){return(T.donemler.some(function(d){return d.d})?'<div class="dnm">'+T.donemler.map(function(d){return'<div><b>'+e(d.ad)+'</b>'+(d.aralik?'<small>'+e(d.aralik)+'</small>':'')+(d.d?'<p>'+e(d.d)+'</p>':'')+'</div>'}).join('')+'</div>':'')+
 '<div class="tl">'+T.olaylar.map(function(o){return'<div class="to"><span class="tt">'+e(o.t)+'</span><b>'+e(o.kim&&o.kim!=='—'?o.kim:'')+'</b><p>'+e(o.ne)+'</p>'+(o.neden?'<small>'+e(o.neden)+'</small>':'')+'</div>'}).join('')+'</div>'}
function agac(n){return'<li><span>'+e(n.name)+'</span>'+(n.children?'<ul>'+n.children.map(agac).join('')+'</ul>':'')+'</li>'}
function edb(ic,E,alt){alt=alt||'don';
 var h=chips([['don','Dönemler ve şahsiyetler'],['kla','Klasik eserler'],['rom','Roman'],['yol','Nasıl okunur']],alt,'e')+'<div id="ei"></div>';ic.innerHTML=h;var ei=ic.querySelector('#ei');
 [].forEach.call(ic.querySelectorAll('[data-e]'),function(b){b.onclick=function(){edb(ic,E,b.dataset.e)}});
 if(alt==='don')ei.innerHTML=E.donemler.map(function(d){var P=E.sahsiyetler.filter(function(p){return p.donem===d.k});return'<div class="edd"><div class="eh"><b>'+e(d.ad)+'</b><small>'+e(d.aralik)+'</small></div><p>'+e(d.d)+'</p>'+P.map(kisi).join('')+'</div>'}).join(''),bagKisi(ei);
 else if(alt==='kla')liste2(ei,E.klasikler,'Eser veya müellif ara…','c',kitapL);
 else if(alt==='rom')liste2(ei,E.romanlar,'Roman veya yazar ara…','c',kitapL);
 else ei.innerHTML='<ol class="ns">'+E.yol.map(function(x){return'<li>'+e(x)+'</li>'}).join('')+'</ol>'}
function alan(id,sek){
 al('data/ihtisas/'+id+'.json').then(function(A){
  renk(A.renk);$('#bas').textContent=A.ad;document.title=A.ad+' · İhtisas';$('#geri').onclick=function(){location.hash=''};
  var S=SEK.filter(function(s){var v=A[VAR[s[0]]];return v&&(v.length||v.olaylar||v.donemler)});
  if(!S.some(function(s){return s[0]===sek}))sek='yol';
  var o=oku(),k=0;A.basamaklar.forEach(function(s){s.kitaplar.forEach(function(b){if(o[b.id])k++})});
  var p=Math.round(100*k/A.kitapSayisi);
  var h='<div class="hero" style="background:linear-gradient(135deg,'+A.renk+','+A.renk+'cc)"><span class="ar">'+e(A.ar)+'</span><h2>'+e(A.ad)+'</h2><p>'+e(A.kisa)+'</p><div class="ilr"><div class="bar"><i style="width:'+p+'%"></i></div><span>'+k+' / '+A.kitapSayisi+'</span></div></div>';
  h+='<div class="tabs">'+S.map(function(s){return'<button data-s="'+s[0]+'"'+(s[0]===sek?' class="on"':'')+'>'+s[1]+'</button>'}).join('')+'</div><div id="ic"></div>';
  M.innerHTML=h;
  [].forEach.call(M.querySelectorAll('.tabs button'),function(b){b.onclick=function(){history.replaceState(null,'','#'+id+'/'+b.dataset.s);alan(id,b.dataset.s)}});
  var t=M.querySelector('.tabs .on');t&&t.scrollIntoView&&t.scrollIntoView({inline:'center',block:'nearest'});
