<style>
:root{--paper:#f6f1e7;--card:#fffdf8;--ink:#2a2620;--muted:#6f665a;--line:#e3d9c6;--accent:#8a3b12;--accent-soft:#f3e2d4;--gold:#a57c1b;--ok:#2f6b3f;--warn:#9a6a00;--bad:#9b2c2c;--fs:17px;--lh:1.7;--ar-scale:1.3;
--l1:#6b4a2b;--l2:#7a5530;--l3:#8a3b12;--l4:#9a4a1a;--l5:#a85a22;--l6:#b66a2a;--l7:#7b6a2a;--l8:#5d6a35;--l9:#3f6a45}
[data-theme="dark"]{--paper:#16130f;--card:#201c17;--ink:#ece4d6;--muted:#a69a88;--line:#3a332a;--accent:#e0905e;--accent-soft:#3a2619;--gold:#d8b25a;--ok:#7fbf8d;--warn:#e2b44c;--bad:#e08080}
*{box-sizing:border-box}html{font-size:var(--fs)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Source Serif 4",Georgia,serif;line-height:var(--lh)}
.ui{font-family:Inter,system-ui,sans-serif}a{color:var(--accent)}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:.6rem;padding:.55rem 1rem;max-width:920px;margin:0 auto}
.brand{font-weight:700;font-size:1.02rem;white-space:nowrap}.brand .ar{font-family:Amiri,serif;color:var(--accent);font-size:1.25rem;margin-left:.35rem}
.spacer{flex:1}.qs{flex:1;max-width:280px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.35rem .8rem;font:.82rem Inter,sans-serif;min-width:0}
nav{display:flex;gap:.25rem;overflow-x:auto;padding:0 1rem .5rem;max-width:920px;margin:0 auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.33rem .75rem;font:500 .79rem Inter,sans-serif;cursor:pointer}
nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
nav.sub{padding-top:0}nav.sub button{border-radius:8px;font-size:.74rem;padding:.25rem .6rem;background:transparent}nav.sub button.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}nav.sub:empty{display:none}#sec button{font-weight:600}
main{max-width:920px;margin:0 auto;padding:1rem 1rem 5rem}
h1{font-size:1.55rem;line-height:1.25;margin:.2rem 0 .6rem}h2{font-size:1.12rem;margin:1.6rem 0 .6rem;padding-top:.6rem;border-top:1px solid var(--line)}h3{font-size:1rem;margin:.8rem 0 .3rem}
.lead{font-size:1.05rem;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.95rem 1.05rem;margin:.65rem 0}
.muted{color:var(--muted)}.small{font-size:.85rem}.tiny{font-size:.75rem}
.chips{display:flex;flex-wrap:wrap;gap:.3rem;margin:.35rem 0}
.chip{font:500 .7rem Inter,sans-serif;padding:.12rem .5rem;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--muted);text-decoration:none;white-space:nowrap}
.chip.A{background:#e3f1e6;color:#225a31;border-color:#b9dcc2}.chip.B{background:#fbf0d6;color:#7a5600;border-color:#ecd59a}.chip.C{background:#f6dede;color:#8a2424;border-color:#e8b8b8}
[data-theme="dark"] .chip.A{background:#1d3324;color:#9fdcae;border-color:#2d5038}[data-theme="dark"] .chip.B{background:#3a2f12;color:#f0d38a;border-color:#5a4718}[data-theme="dark"] .chip.C{background:#3a1c1c;color:#f0a8a8;border-color:#5a2a2a}
.chip.read{background:var(--ok);color:#fff;border-color:var(--ok)}.chip.crit{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}.chip.lang{text-transform:uppercase}
p{margin:.5rem 0;unicode-bidi:plaintext}
[lang="ar"],.ar{font-family:Amiri,"Noto Naskh Arabic",serif;font-size:calc(1em * var(--ar-scale));line-height:1.6}
[lang="fa"]{font-family:"Noto Naskh Arabic",Amiri,serif;font-size:calc(1em * 1.15)}
.rtl{direction:rtl;text-align:right}
.arblock{direction:rtl;text-align:right;font-family:Amiri,"Noto Naskh Arabic",serif;font-size:calc(1.05rem * var(--ar-scale));line-height:2;background:var(--paper);border-right:3px solid var(--gold);padding:.8rem 1rem;border-radius:8px}
.btn{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:.5rem .85rem;font:600 .83rem Inter,sans-serif;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent)}.btn.done{background:var(--ok);border-color:var(--ok)}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.pyr{display:grid;gap:.35rem;margin:.8rem 0}
.pyr button{border:0;border-radius:10px;color:#fff;padding:.6rem .8rem;font:600 .86rem Inter,sans-serif;cursor:pointer;text-align:left;display:flex;justify-content:space-between;gap:.6rem;align-items:center}
.pyr button span.c{font-weight:500;opacity:.85;font-size:.75rem;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.5rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.7rem;text-align:center;cursor:pointer}
.stat b{display:block;font:700 1.5rem Inter,sans-serif;color:var(--accent)}.stat span{font:.78rem Inter,sans-serif;color:var(--muted)}
.list .it{padding:.65rem 0;border-bottom:1px solid var(--line)}
.cite{font-size:.94rem;unicode-bidi:plaintext}
.filters{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0}
select,input[type=search]{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:.4rem .5rem;font:.84rem Inter,sans-serif}input[type=search]{flex:1;min-width:10rem}
.seg{display:flex;gap:.25rem;overflow-x:auto;scrollbar-width:none;margin:.4rem 0}.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:.3rem .65rem;font:500 .78rem Inter,sans-serif;cursor:pointer}.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.copy{font:500 .7rem Inter,sans-serif;border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:6px;padding:.12rem .5rem;cursor:pointer}
.term{display:grid;grid-template-columns:minmax(6rem,auto) 1fr;gap:.15rem .8rem;padding:.6rem .7rem;border:1px solid var(--line);border-radius:10px;background:var(--card);margin:.4rem 0;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.term .a{font-family:Amiri,serif;font-size:calc(1.15rem * var(--ar-scale));color:var(--accent);direction:rtl;text-align:center;grid-row:span 3;align-self:center}
.term .t{font:600 .9rem Inter,sans-serif}.term .e{font:italic .78rem Inter,sans-serif;color:var(--muted)}.term .d{font-size:.9rem}
.term .x{grid-column:2;direction:rtl;text-align:right;font-family:Amiri,serif;font-size:calc(1rem*var(--ar-scale));color:var(--muted)}
.term.speaking{box-shadow:0 0 0 2px var(--gold) inset}
.tl{position:relative;padding-left:1.4rem}.tl:before{content:"";position:absolute;left:.45rem;top:.3rem;bottom:.3rem;width:2px;background:var(--line)}
.tl .ev{position:relative;margin:.2rem 0 1rem}.tl .ev:before{content:"";position:absolute;left:-1.18rem;top:.5rem;width:.7rem;height:.7rem;border-radius:50%;background:var(--accent);border:2px solid var(--paper)}
.tl .dt{font:700 .8rem Inter,sans-serif;color:var(--accent)}
.person summary{list-style:none;cursor:pointer}.person summary::-webkit-details-marker{display:none}
.person summary .tap{font:600 .75rem Inter,sans-serif;color:var(--accent);margin-top:.3rem;display:inline-block}
.person[open] summary .tap{display:none}.person .pd{border-top:1px dashed var(--line);margin-top:.55rem;padding-top:.55rem}
.person .pd h4{font:700 .8rem Inter,sans-serif;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:.6rem 0 .25rem}
.person .pd ul{margin:.2rem 0 .2rem 1.1rem;padding:0}.person .pd li{margin:.15rem 0}
.person{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:.75rem .9rem;margin:.5rem 0}
.person .nm{display:flex;justify-content:space-between;gap:.6rem;align-items:baseline;flex-wrap:wrap}.person .nm b{font:700 1rem Inter,sans-serif}
.tree ul{list-style:none;padding-left:1.1rem;margin:.2rem 0;border-left:2px solid var(--line)}.tree li{margin:.35rem 0;position:relative}.tree li:before{content:"";position:absolute;left:-1.1rem;top:.8rem;width:.8rem;border-top:2px solid var(--line)}
.tree>ul{border-left:0;padding-left:0}.tree>ul>li:before{display:none}
.node{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.25rem .55rem;font-size:.9rem}
dl.th{display:grid;grid-template-columns:8.5rem 1fr;gap:.3rem .8rem}dl.th dt{font:600 .74rem Inter,sans-serif;color:var(--muted);text-transform:uppercase;padding-top:.25rem}dl.th dd{margin:0;unicode-bidi:plaintext}
@media(max-width:560px){dl.th{grid-template-columns:1fr}.qs{max-width:none}.brand .t{display:none}}
textarea{width:100%;min-height:7rem;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);padding:.7rem;font:inherit;font-size:.95rem}
.note{border-left:3px solid var(--warn);background:var(--paper);padding:.55rem .8rem;border-radius:6px;font-size:.86rem}
ul.crit{padding-left:1.1rem}ul.crit li{margin:.3rem 0;unicode-bidi:plaintext}
.toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:.5rem 1rem;border-radius:999px;font:.85rem Inter,sans-serif;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}.toast.on{opacity:.95}
.mod{display:flex;gap:.8rem;align-items:flex-start;padding:.7rem .8rem;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit;margin:.45rem 0}
.mod .n{flex:none;width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;font:700 .85rem Inter,sans-serif;color:#fff}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:.35rem}.bar i{display:block;height:100%;background:var(--ok)}
.settings label{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.5rem 0;border-bottom:1px solid var(--line);font:.9rem Inter,sans-serif}
.more{border:0;background:none;color:var(--accent);font:600 .8rem Inter,sans-serif;cursor:pointer;padding:.3rem 0}
</style>

<div class="toast" id="toast"></div>
<script>
(()=>{
const D={};const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem('blk:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('blk:'+k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arwrap=s=>esc(s).replace(/([؀-ۿ][؀-ۿً-ْ\s«»،؛؟\.\-:0-9٠-٩\/()]*[؀-ۿ»)])/g,'<span lang="ar">$1</span>');
const N=s=>String(s??'').toLocaleLowerCase('tr').normalize('NFD').replace(/[\u0300-\u036f‘’'ʿʾ]/g,'').replace(/ı/g,'i');
const isAr=s=>{const a=(String(s).match(/[؀-ۿ]/g)||[]).length,l=(String(s).match(/[A-Za-zÇĞİÖŞÜçğıöşüâîû]/g)||[]).length;return a>l};
const LANG={ar:'Arapça',tr:'Türkçe',en:'İngilizce',de:'Almanca',fr:'Fransızca',fa:'Farsça'};
const KIND={makale:'Makale',tez:'Tez',kitap:'Kitap','kitap bölümü':'Kitap bölümü',ansiklopedi:'Ansiklopedi',birincil:'Klasik eser',kaynak:'Veri tabanı'};
const TOPIC={tarih:'Genel ve tarih',terim:'Terminoloji',ekol:'Ekoller ve ders geleneği',meani:'Meânî',beyan:'Beyân',badi:'Bedî‘',fesahat:'Fesâhat',icaz:'Kur’an ve i‘câz',sahsiyet:'Şahsiyetler',nakd:'Edebî tenkit ve şiir',osmanli:'Osmanlı belâgatı',modern:'Modern yaklaşımlar',ogretim:'Öğretim',nahiv:'Nahiv',sarf:'Sarf',roman:'Roman ve hikâye',siir:'Şiir',nesir:'Nesir, makâme ve edeb',ymodern:'Modern edebiyat: Nahda, Mehcer, tiyatro',edtarih:'Edebiyat tarihi',ahlak:'Edep ve ahlak'};
const LITT=['roman','siir','nesir','ymodern','edtarih','ahlak'];
const SRCH={sham:q=>`https://www.google.com/search?q=${encodeURIComponent('site:shamela.ws '+q)}`,arch:q=>`https://archive.org/search?query=${encodeURIComponent(q)}`,hind:q=>`https://www.google.com/search?q=${encodeURIComponent('site:hindawi.org OR site:safahat.org '+q)}`,gb:q=>`https://www.google.com/search?tbm=bks&q=${encodeURIComponent(q)}`};
function srchBtns(q,kinds){return kinds.map(k=>`<a class="copy" href="${SRCH[k](q)}" target="_blank" rel="noopener">${{sham:'Şâmile’de ara',arch:'archive.org’da ara',hind:'Hindâvî’de ara',gb:'Google Kitaplar'}[k]} ↗</a>`).join('')}
const PYR=[['tarih','Genel: tarih ve kaynaklar',1],['terim','Terminoloji',2],['ekol','Ekoller ve ders geleneği',2],['meani','Meânî',3],['beyan','Beyân',3],['badi','Bedî‘',3],['fesahat','Fesâhat ve kusurları',5],['icaz','Kur’an belâgatı ve i‘câz',6],['sahsiyet','Büyük isimler',7],['nakd','Edebî tenkit',7],['osmanli','Osmanlı belâgatı',7],['modern','Modern yaklaşımlar',8]];
const STATUS={okundu:'Okundu (tam metin)', 'künye görüldü':'Künye/özet görüldü','standart kaynak':'Standart kaynak','klasik eser':'Klasik eser','erişilemedi':'Erişilemedi'};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1600)}
function copy(t){try{navigator.clipboard.writeText(t).then(()=>toast('Kopyalandı'),()=>toast('Kopyalanamadı'))}catch(e){toast('Kopyalanamadı')}}
function speak(text,el){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ar-SA';u.rate=.8;const v=speechSynthesis.getVoices().find(v=>/^ar/i.test(v.lang));if(v)u.voice=v;else toast('Cihazda Arapça ses yoksa okuma İngilizce aksanlı olabilir');el&&el.classList.add('speaking');u.onend=u.onerror=()=>el&&el.classList.remove('speaking');speechSynthesis.speak(u)}catch(e){toast('Sesli okuma desteklenmiyor')}}
const readSet=()=>LS.get('read',{});const fav=()=>LS.get('fav',{});
function applySettings(){const s=LS.get('set',{fs:17,lh:1.7,ar:1.3,theme:''});const r=document.documentElement.style;r.setProperty('--fs',s.fs+'px');r.setProperty('--lh',s.lh);r.setProperty('--ar-scale',s.ar);document.documentElement.dataset.theme=s.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
async function J(u){const r=await fetch(u);if(!r.ok)throw new Error(u);return r.json()}
async function day(n){D.days=D.days||{};if(D.days[n])return D.days[n];return D.days[n]=await J(`data/days/day${String(n).padStart(2,'0')}.json`)}
const DEEP=[1,2,3,4,5,6,8,9,10,11,12,13,15,16,17,18,19,20,22,23,24,25,26,27,29,30];
function libItem(x,opts={}){const f=fav();const cit=x.cite||x.title;
 return `<div class="it"><div class="chips ui"><span class="chip lang">${x.lang}</span><span class="chip">${KIND[x.kind]||x.kind}</span><span class="chip">${TOPIC[x.topic]||x.topic}</span><span class="chip ${x.access}">${x.access}</span>${x.status==='okundu'?'<span class="chip read">okundu</span>':`<span class="chip">${STATUS[x.status]||x.status}</span>`}${x.critical?'<span class="chip crit">eleştirel okuma</span>':''}${x.day?`<a class="chip" href="#oku-${x.day}">özeti oku →</a>`:''}</div>
 <div class="cite ${isAr(cit)?'rtl':''}" ${isAr(cit)?'lang="ar"':x.lang==='fa'?'lang="fa"':''}>${esc(cit)}</div>
 <div class="row ui" style="margin-top:.25rem"><button class="copy" data-copy="${esc(cit)}">Künyeyi kopyala</button><button class="copy" data-fav="${x.id}">${f[x.id]?'★ listemde':'☆ listeme ekle'}</button>${x.url?`<a class="tiny" href="${esc(x.url)}" target="_blank" rel="noopener">kaynağı aç ↗</a>`:(x.kind==='birincil'?srchBtns(x.title,['sham','arch']):srchBtns(x.title,['gb']))}</div>
 ${opts.note!==false?`<div class="tiny muted ui">${esc(x.note||'')}</div>`:''}</div>`}
function bindCommon(){document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(b.dataset.copy));
 document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{const f=fav();f[b.dataset.fav]?delete f[b.dataset.fav]:f[b.dataset.fav]=1;LS.set('fav',f);b.textContent=f[b.dataset.fav]?'★ listemde':'☆ listeme ekle'});
 document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say,b));
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));}
// ------- views
function vHome(){
 const L=D.lib.items,c=(k,v)=>L.filter(x=>x[k]===v).length;const rs=readSet();const done=DEEP.filter(n=>rs[n]).length;
 const BL=L.filter(x=>x.area==='belagat'&&!['nahiv','sarf'].includes(x.topic)),EL=L.filter(x=>x.area==='edebiyat');
 let h=`<h1>Arap dili, belâgatı ve edebiyatı: genelden özele bir kütüphane</h1><p class="lead">Belâgat ve edebiyat için iki ayrı kanat: tarih, şahsiyetler, terimler ve kitaplardan başlayıp en dar konulara inen okuma yolları; klasik eserler, temel kitaplar ve romanlar dillere göre ayrılmış halde.</p>
 <div class="grid ui">
 <div class="stat" data-go="kutup"><b>${BL.length}</b><span>belâgat kaynağı</span></div>
 <div class="stat" data-go="edcal"><b>${EL.length}</b><span>edebiyat kaynağı</span></div>
 <div class="stat" data-go="kitap"><b>${D.books.items.length}</b><span>dil ve belâgat kitabı</span></div>
 <div class="stat" data-go="roman"><b>${D.novels.items.length}</b><span>roman ve anlatı</span></div>
 <div class="stat" data-go="klasik"><b>${D.adab.items.length}</b><span>klasik edebiyat ve ahlak</span></div>
 <div class="stat" data-go="nahiv"><b>${L.filter(x=>['nahiv','sarf'].includes(x.topic)).length}</b><span>nahiv ve sarf</span></div>
 <div class="stat" data-go="terim"><b>${D.terms.groups.reduce((a,g)=>a+g.items.length,0)}</b><span>terim</span></div>
 <div class="stat" data-go="kisi"><b>${D.persons.persons.length+D.edeb.persons.length}</b><span>şahsiyet</span></div>
 <div class="stat" data-go="rota"><b>${D.route.length}</b><span>okuma modülü</span></div></div>

function drawNav(v){const sk=secOf(v);$('#sec').innerHTML=SECS.map(([k,t,subs])=>`<button data-s="${k}" class="${k===sk?'on':''}">${t}</button>`).join('');
 const subs=(SECS.find(s=>s[0]===sk)||[])[2]||[];$('#tabs').innerHTML=subs.map(([k,t])=>`<button data-v="${k}" class="${k===v?'on':''}">${t}</button>`).join('');

 document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>go(b.dataset.v));
 const on=document.querySelector('#tabs button.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'})}
async function route(){const h=location.hash.slice(1)||'home';let v=h;
 if(/^modul-|^oku-/.test(h))v='rota';
