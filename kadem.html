<!DOCTYPE html>
<html lang="tr"><head>
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script src="kalkan.js"></script><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kadem · el-Mihrâb</title>
<meta name="theme-color" content="#1d5c4a">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f0e8;--card:#fffdf8;--ink:#2a2620;--muted:#6f665a;--line:#e3d9c6;--acc:#1d5c4a;--soft:#e9f1ec;--ok:#2f7d4f;--no:#b23a3a;--warn:#9a6a12;--warnbg:#fbf1dc}
@media (prefers-color-scheme:dark){:root{--bg:#15131a;--card:#1f1c26;--ink:#ece6f2;--muted:#a59db0;--line:#332e3d;--soft:#22302b;--warnbg:#3a2f1a;--warn:#e7b65a}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:calc(56px + env(safe-area-inset-top,0px));padding-bottom:48px}
#top{position:fixed;top:0;left:0;right:0;z-index:9;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:var(--acc);color:#fff;transition:background .3s}
#top a{color:#fff;text-decoration:none;background:rgba(255,255,255,.18);border-radius:12px;padding:7px 12px;font-weight:700;cursor:pointer}
#top b{flex:1;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#saat{font-weight:800;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.18);border-radius:12px;padding:6px 10px;display:none}
#saat.az{background:#b23a3a}
main{max-width:820px;margin:0 auto;padding:12px 14px}
h1{font-size:25px;margin:6px 0 4px}h2{font-size:19px;margin:18px 0 8px}
.lead{color:var(--muted);margin:0 0 14px}
.izgara{display:grid;gap:12px}@media(min-width:700px){.izgara{grid-template-columns:1fr 1fr}}
.kart{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;cursor:pointer;position:relative;overflow:hidden}
.kart:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--r,var(--acc))}
.kart b{display:block;font-size:18px}.kart small{display:block;color:var(--muted)}
.etk{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;border-radius:20px;padding:2px 10px;background:var(--soft);color:var(--acc)}
.etk.bos{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.satir{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 14px;margin-bottom:8px;cursor:pointer;text-decoration:none;color:inherit}
.satir .no{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-weight:700;font-size:14px}
.satir span{flex:1}.satir small{color:var(--muted)}
.satir.pasif{cursor:default;opacity:.62}
.dugmeler{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.btn{border:0;border-radius:14px;padding:10px 16px;font:inherit;font-weight:700;background:var(--acc);color:#fff;cursor:pointer}
.btn.ik{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.kucuk{padding:6px 12px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:default}
.metin{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 18px 12px}
.metin p{margin:10px 0}.metin h3{margin:18px 0 4px;font-size:17px;color:var(--acc)}
.metin .not{background:var(--soft);border-radius:12px;padding:8px 12px}
.metin .kontrol{background:var(--warnbg);color:var(--ink);border-left:4px solid var(--warn);border-radius:10px;padding:8px 12px;font-size:15px}
.metin .kontrol b{color:var(--warn)}
.alinti{border-left:4px solid var(--acc);background:var(--soft);border-radius:0 12px 12px 0;padding:8px 12px;margin:10px 0}
.alinti em{display:block;font-style:normal;font-size:13px;color:var(--muted);margin-top:4px}
.alinti .tur{font-size:12px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.04em}
.tablo{overflow-x:auto;margin:10px 0}
.tablo table{border-collapse:collapse;width:100%;font-size:14.5px}
.tablo th,.tablo td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tablo th{background:var(--soft)}
.sekmeler{display:flex;gap:6px;margin:8px 0 12px;overflow-x:auto}
.sekmeler a{flex:none;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-weight:600;font-size:15px;cursor:pointer}
.sekmeler a.on{background:var(--acc);border-color:var(--acc);color:#fff}
.ozet{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 18px 8px 34px}
.ozet li{margin:8px 0}
.bos-kutu{border:1.5px dashed var(--line);border-radius:18px;padding:22px 16px;text-align:center;color:var(--muted)}
.soru{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.soru .ust{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px;margin-bottom:6px}
.soru .kok{font-weight:600;margin-bottom:12px;white-space:pre-line}
.zor{font-size:11px;font-weight:700;border-radius:10px;padding:1px 8px;background:var(--soft);color:var(--acc)}
.sik{display:flex;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);background:transparent;color:inherit;border-radius:14px;padding:10px 12px;margin-bottom:8px;font:inherit;cursor:pointer}
.sik i{font-style:normal;font-weight:700;width:20px;flex:none}
.sik.secili{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.sik.dogru{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.sik.yanlis{border-color:var(--no);background:color-mix(in srgb,var(--no) 12%,transparent)}
.aciklama{margin-top:6px;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:15px}
.aciklama ul{margin:6px 0 0;padding-left:18px}.aciklama li{margin:4px 0}
.aciklama small{color:var(--muted)}
details summary{cursor:pointer;font-weight:600;margin-top:8px}
.sonuc{text-align:center;padding:10px 16px}.sonuc .buyuk{font-size:44px;font-weight:800;color:var(--acc)}
.sayilar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.sayilar div{background:var(--soft);border-radius:14px;padding:8px}.sayilar b{display:block;font-size:24px}
.cubuk{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:4px}
.cubuk i{display:block;height:100%;background:var(--acc)}
.ders{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:8px}
.ders .bas{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.ders ul{margin:6px 0 0;padding-left:18px;font-size:15px}.ders li{margin:4px 0}
.yildiz{color:var(--warn);font-size:12px;white-space:nowrap}
.hazir{font-size:11px;font-weight:700;border-radius:10px;padding:1px 8px;background:var(--ok);color:#fff;margin-left:4px}
.harita{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.harita button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;position:relative}
.harita button.cevap{background:var(--soft);border-color:var(--acc)}
.harita button.isaret:after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.harita button.simdi{outline:2px solid var(--acc);outline-offset:1px}
.flip{background:var(--card);border:1px solid var(--line);border-radius:22px;min-height:200px;display:grid;place-items:center;text-align:center;padding:24px 18px;cursor:pointer;font-size:20px;font-weight:700;user-select:none}
.flip.arka{font-size:17px;font-weight:500;background:var(--soft)}
.flip small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:10px}
.yuk{color:var(--muted);text-align:center;padding:40px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#222;color:#fff;border-radius:14px;padding:9px 16px;transition:transform .25s;z-index:20}
#toast.on{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="top"><a id="geri">‹</a><b id="bas">Kadem</b><span id="saat"></span></div>
<main id="m"><div class="yuk">Yükleniyor…</div></main>
<div id="toast"></div>
<script>
/* Kadem — Diyanet personeli için sınav hazırlık bölümü.
   Veri:
   - data/kadem/sinavlar.json : sınav listesi
   - data/kadem/<id>.json     : bir sınavın konuları. Konu ya doğrudan yazılır ya da {"ref":"hadis-1"} ile
                                data/kadem/konu/hadis-1.json dosyasından alınır (aynı konu birden çok sınavda kullanılır).
                                İsteğe bağlı: "harita" (dersler, soru sayıları, üniteler) ve "deneme" ({soru,dakika,yanlisGoturur}).
   - Konu: {id,ad,ders,anlatim:[...],ozet:[...],kartlar:[{o,a}],sorular:[{id,z,s,c:[5],d,a,ac:[5],kay}]}
     anlatim öğeleri: "paragraf" | {b} ara başlık | {not} | {ayet,kay} | {hadis,kay} | {tablo:[[başlıklar],[satır]...]} | {kontrol} (hoca kontrolü bekleyen bilgi)
   - Telefonda saklananlar (localStorage "kadem.v1"):
     p.<sınav>.<konu> son konu testi yüzdesi · d.<sınav> yanlış defteri {soruAnahtarı:{k:kutu,t:sıradaki tekrar zamanı,y:yanlış sayısı}}
     dn.<sınav> deneme geçmişi · a.<sınav> yarım kalan deneme
   Adresler: #s=mbsts · &k=<konu>[&g=ozet|kart] · &t=<konu> (konu testi) · &t=deneme · &t=sonuc · &t=tekrar · &t=defter · &t=harita */
(function(){
var $=function(s){return document.querySelector(s)},M=$('#m'),C={},LK='kadem.v1',HARF='ABCDE',GUN=864e5,
 ARALIK=[1,3,7,15,30],ZOR=['','Kolay','Orta','Zor'];
function oku(){try{return JSON.parse(localStorage.getItem(LK))||{}}catch(e){return{}}}
function yaz(o){try{localStorage.setItem(LK,JSON.stringify(o))}catch(e){}}
function guncelle(f){var o=oku();f(o);yaz(o)}
function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(t){var x=$('#toast');x.textContent=t;x.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){x.classList.remove('on')},2200)}
function al(u){if(C[u])return Promise.resolve(C[u]);return fetch(u,{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){return C[u]=j})}
function renk(c){document.documentElement.style.setProperty('--acc',c);$('#top').style.background=c;var m=document.querySelector('meta[name=theme-color]');m&&m.setAttribute('content',c)}
function hash(){var o={};location.hash.replace(/^#/,'').split('&').forEach(function(p){var a=p.split('=');if(a[0])o[a[0]]=decodeURIComponent(a[1]||'')});return o}
function git(h){location.hash=h}
function karistir(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function hata(){M.innerHTML='<div class="bos-kutu">İçerik yüklenemedi. İnternet bağlantını kontrol edip tekrar dene.</div>'}
function saatYaz(sn){sn=Math.max(0,Math.round(sn));var d=Math.floor(sn/60),s=sn%60;return d+':'+(s<10?'0':'')+s}
function tarih(t){var g=Math.round((t-Date.now())/GUN);return g<=0?'bugün':g===1?'yarın':g+' gün sonra'}
function saatGizle(){var s=$('#saat');s.style.display='none';s.className='';clearInterval(saatGizle.i)}

/* Sınav verisi: ref'li konuları yükler, her soruya kalıcı bir anahtar (_k) ve konu bilgisi verir */
function sinav(id){
 return al('data/kadem/'+id+'.json').catch(function(){return{konular:[]}}).then(function(V){
  if(V._hazir)return V;
  return Promise.all((V.konular||[]).map(function(k){
   return k.ref?al('data/kadem/konu/'+k.ref+'.json').catch(function(){return null}):Promise.resolve(k)})).then(function(K){
   V.konular=K.filter(Boolean);V.hepsi=[];
   V.konular.forEach(function(x){(x.sorular||[]).forEach(function(q,n){q._k=q.id||x.id+'.'+n;q._konu=x;V.hepsi.push(q)})});
   V._hazir=1;return V})})}
function soruBul(V,k){for(var i=0;i<V.hepsi.length;i++)if(V.hepsi[i]._k===k)return V.hepsi[i]}

/* Yanlış defteri ve aralıklı tekrar (kutu sistemi: 1-3-7-15-30 gün) */
function defter(S){var o=oku(),d=o['d.'+S.id];
 if(!d){d={};(o['y.'+S.id]||[]).forEach(function(k){d[k]={k:0,t:Date.now(),y:1}})}  /* eski sürümden taşıma */
 return d}
function defterYaz(S,d){guncelle(function(o){o['d.'+S.id]=d;delete o['y.'+S.id]})}
function isle(S,q,dogru){var d=defter(S),x=d[q._k],simdi=Date.now();
 if(!dogru){d[q._k]={k:0,t:simdi+GUN,y:(x?x.y:0)+1}}
 else if(x&&x.t<=simdi){if(x.k+1>=ARALIK.length)delete d[q._k];else{x.k++;x.t=simdi+ARALIK[x.k]*GUN}}
 defterYaz(S,d)}
function bugunku(S,V){var d=defter(S),n=Date.now();return Object.keys(d).filter(function(k){return d[k].t<=n&&soruBul(V,k)})}

function liste(){
 renk('#1d5c4a');saatGizle();$('#bas').textContent='Kadem';document.title='Kadem · el-Mihrâb';$('#geri').onclick=function(){location.href='index.html'};
 al('data/kadem/sinavlar.json').then(function(L){
  var h='<h1>Kadem</h1><p class="lead">Diyanet personeli için sınav hazırlığı: girişten müftülüğe, vaizlikten yurt dışı görevine kadar bütün sınavlar. Konu anlatımı, özetler, tekrar kartları, testler, gerçek sınav biçiminde denemeler ve yanlışlarının aralıklı tekrarı.</p>';
  return Promise.all(L.sinavlar.map(function(s){return sinav(s.id)})).then(function(V){
   (L.gruplar||[{id:void 0,ad:''}]).forEach(function(g){var S=L.sinavlar.filter(function(s){return s.grup===g.id});if(!S.length)return;
    h+=(g.ad?'<h2>'+e(g.ad)+'</h2>':'')+'<div class="izgara">';
    S.forEach(function(s){var v=V[L.sinavlar.indexOf(s)],k=v.konular||[],n=v.hepsi.length,b=bugunku(s,v).length;
     h+='<a class="kart" style="--r:'+e(s.renk)+'" href="#s='+e(s.id)+'"><b>'+e(s.ad)+'</b><small>'+e(s.tam)+'</small><small>'+e(s.bicim)+'</small>'+
      (k.length?'<span class="etk">'+k.length+' konu · '+n+' soru</span>'+(b?' <span class="etk" style="background:var(--warnbg);color:var(--warn)">Bugün '+b+' tekrar</span>':''):'<span class="etk bos">Hazırlanıyor</span>')+'</a>'});
    h+='</div>'});
   if(L.guncel)h+='<p class="lead" style="margin-top:18px;font-size:13px">Sınav bilgileri '+e(L.guncel)+' itibarıyla resmî duyurulardan derlenmiştir. Başvurmadan önce güncel duyuruyu kontrol et.</p>';
   M.innerHTML=h;scrollTo(0,0)})
 }).catch(hata)}

function bilgi(S){if(!(S.yapi||[]).length)return'';
 return'<h2>Sınav hakkında</h2><div class="metin"><ul style="padding-left:20px">'+S.yapi.map(function(y){return'<li style="margin:6px 0">'+e(y)+'</li>'}).join('')+'</ul>'+
  (S.kaynak&&/^https:\/\//.test(S.kaynak)?'<p style="font-size:13px"><a href="'+e(encodeURI(decodeURI(S.kaynak)))+'" target="_blank" rel="noopener" style="color:var(--acc)">Resmî duyuru / kaynak ›</a></p>':'')+'</div>'}

function sinavSayfa(S,V){
 var o=oku(),k=V.konular||[],d=defter(S),yan=Object.keys(d).filter(function(x){return soruBul(V,x)}).length,bug=bugunku(S,V).length,G=o['dn.'+S.id]||[],A=o['a.'+S.id];
 var h='<h1>'+e(S.ad)+'</h1><p class="lead">'+e(S.tam)+'<br>'+e(S.kim)+' · '+e(S.bicim)+'</p>';
 if(!k.length){M.innerHTML=h+'<div class="bos-kutu">Konu anlatımı ve sorular hazırlanıyor.</div>'+bilgi(S);return}
 h+='<div class="dugmeler"><button class="btn" id="dene">'+(A?'Yarım kalan denemeye dön':'Deneme sınavı')+'</button>'+
  '<button class="btn ik" id="tek"'+(bug?'':' disabled')+'>Bugünkü tekrar ('+bug+')</button>'+
  '<button class="btn ik" id="def"'+(yan?'':' disabled')+'>Yanlış defteri ('+yan+')</button>'+
  (V.harita?'<button class="btn ik" id="har">Konu haritası</button>':'')+'</div>';
 if(G.length){var g=G[G.length-1];h+='<p class="lead" style="font-size:14px">Son deneme: '+g.dogru+'/'+g.n+' doğru · <a href="#s='+e(S.id)+'&t=sonuc" style="color:var(--acc)">sonucu gör</a></p>'}
 var dersler=[];k.forEach(function(x){if(dersler.indexOf(x.ders)<0)dersler.push(x.ders)});
 dersler.forEach(function(ad){h+='<h2>'+e(ad||'Konular')+'</h2>';
  k.filter(function(x){return x.ders===ad}).forEach(function(x,i){var p=o['p.'+S.id+'.'+x.id],n=(x.sorular||[]).length;
   h+='<a class="satir" href="#s='+e(S.id)+'&k='+e(x.id)+'"><span class="no">'+(i+1)+'</span><span>'+e(x.ad)+'</span><small>'+(n?n+' soru'+(p!=null?' · %'+p:''):'')+'</small></a>'})});
 M.innerHTML=h+bilgi(S);
 $('#dene').onclick=function(){git('s='+S.id+'&t=deneme')};
 $('#tek').onclick=function(){git('s='+S.id+'&t=tekrar')};$('#def').onclick=function(){git('s='+S.id+'&t=defter')};
 if(V.harita)$('#har').onclick=function(){git('s='+S.id+'&t=harita')}}

function haritaSayfa(S,V){
 var H=V.harita,K={};(V.konular||[]).forEach(function(x){K[x.id]=x});
 var h='<h1>Konu haritası</h1><p class="lead">'+e(H.kaynak)+'</p><p class="lead" style="font-size:14px"><span class="yildiz">★★★</span> sık soru gelen, <span class="yildiz">★★</span> düzenli gelen ünite. Yeşil etiketli üniteler hazır.</p>';
 var top=0;H.dersler.forEach(function(d){top+=d.soru});
 H.dersler.forEach(function(d){h+='<div class="ders"><div class="bas"><span>'+e(d.ad)+'</span><span>'+d.soru+' soru · %'+Math.round(100*d.soru/top)+'</span></div><div class="cubuk"><i style="width:'+(100*d.soru/20)+'%"></i></div><ul>';
  d.uniteler.forEach(function(u){var x=u.konu&&K[u.konu];
   h+='<li>'+(x?'<a href="#s='+e(S.id)+'&k='+e(x.id)+'" style="color:var(--acc)">'+e(u.ad)+'</a><span class="hazir">Hazır</span>':e(u.ad))+' <span class="yildiz">'+'★★★'.slice(0,u.oncelik||1)+'</span></li>'});
  h+='</ul></div>'});
 M.innerHTML=h;scrollTo(0,0)}

/* Konu sayfası: Anlatım · Özet · Kartlar · Test */
function blok(p){
 if(typeof p==='string')return'<p>'+e(p)+'</p>';
 if(p.b)return'<h3>'+e(p.b)+'</h3>';
 if(p.not)return'<p class="not">'+e(p.not)+'</p>';
 if(p.kontrol)return'<p class="kontrol"><b>⚑ Kontrol bekliyor:</b> '+e(p.kontrol)+'</p>';
 if(p.ayet)return'<div class="alinti"><span class="tur">Ayet</span><div>“'+e(p.ayet)+'”</div><em>'+e(p.kay)+'</em></div>';
 if(p.hadis)return'<div class="alinti"><span class="tur">Hadis</span><div>“'+e(p.hadis)+'”</div><em>'+e(p.kay)+'</em></div>';
 if(p.tablo)return'<div class="tablo"><table><tr>'+p.tablo[0].map(function(c){return'<th>'+e(c)+'</th>'}).join('')+'</tr>'+
  p.tablo.slice(1).map(function(r){return'<tr>'+r.map(function(c){return'<td>'+e(c)+'</td>'}).join('')+'</tr>'}).join('')+'</table></div>';
 return''}
function konuSayfa(S,x,g){
 var n=(x.sorular||[]).length,adr='#s='+e(S.id)+'&k='+e(x.id);g=g||'anlatim';
 var h='<h1>'+e(x.ad)+'</h1>'+(x.ders?'<p class="lead">'+e(x.ders)+'</p>':'')+

 if(g==='kart'){M.innerHTML=h+'<div id="kart"></div>';kartlar(x.kartlar);return}
 h+=(x.anlatim||[]).length?'<div class="metin">'+x.anlatim.map(blok).join('')+'</div>':'<div class="bos-kutu">Konu anlatımı hazırlanıyor.</div>';
 h+='<div class="dugmeler">'+((x.ozet||[]).length?'<a class="btn ik" href="'+adr+'&g=ozet" style="text-decoration:none">Özete geç</a>':'')+(n?'<a class="btn" href="#s='+e(S.id)+'&t='+e(x.id)+'" style="text-decoration:none">Test çöz ('+n+')</a>':'')+'</div>';

/* Tekrar kartları: bilinmeyenler destenin sonuna eklenir */

 if((q.ac||[]).length){var digerleri=[];
  if(j!=null&&j!==q.d)h+='<br><small><b>Senin seçtiğin '+HARF[j]+':</b> '+e(q.ac[j])+'</small>';

/* Pratik test: her sorudan sonra açıklama gösterir */
function test(S,baslik,sorular,kayit,donus){
 var i=0,dogru=0;
 if(!sorular.length){M.innerHTML='<div class="bos-kutu">Burada çözülecek soru yok. Yanlış yaptığın sorular burada birikir ve birkaç gün arayla tekrar sorulur.</div>';return}
 function goster(){var q=sorular[i],h='<div class="soru"><div class="ust"><span>'+e(baslik)+'</span><span>'+(q.z?'<span class="zor">'+ZOR[q.z]+'</span> ':'')+(i+1)+' / '+sorular.length+'</span></div><div class="kok">'+e(q.s)+'</div>';
  q.c.forEach(function(c,j){h+='<button class="sik" data-j="'+j+'"><i>'+HARF[j]+')</i><span>'+e(c)+'</span></button>'});

  $('#ileri').onclick=function(){i++;i<sorular.length?goster():bitir()}}
 function bitir(){var p=Math.round(100*dogru/sorular.length);if(kayit)guncelle(function(o){o[kayit]=p});
  var y=sorular.length-dogru;

  $('#tekrar').onclick=function(){test(S,baslik,kolaydanZora(sorular),kayit,donus)};$('#don').onclick=function(){git(donus||'s='+S.id)}}

function kolaydanZora(L){var g={};karistir(L).forEach(function(q){(g[q.z||2]=g[q.z||2]||[]).push(q)});return[].concat(g[1]||[],g[2]||[],g[3]||[])}

/* Deneme: ÖSYM biçimi — süre sayacı, sorular arası geçiş, işaretleme, sonuç ekranı */
function denemeKur(S,V){
 var D=V.deneme||{soru:60,dakika:90},H=V.harita,sec=[],havuz={};
 V.hepsi.forEach(function(q){var d=q._konu.ders||'';(havuz[d]=havuz[d]||[]).push(q)});
 if(H)H.dersler.forEach(function(d){sec=sec.concat(karistir(havuz[d.ad]||[]).slice(0,d.soru))});
 else sec=karistir(V.hepsi).slice(0,D.soru);
 var dk=Math.max(5,Math.round(D.dakika*sec.length/D.soru));
 return{s:sec.map(function(q){return q._k}),c:{},i:{},bas:Date.now(),bit:Date.now()+dk*6e4,dk:dk}}
function deneme(S,V){
 var o=oku(),A=o['a.'+S.id],D=V.deneme||{soru:60,dakika:90};
 if(!A){var H=V.harita,hazir=[],top=0,eksik=[];
  if(H)H.dersler.forEach(function(d){var n=V.hepsi.filter(function(q){return q._konu.ders===d.ad}).length;top+=Math.min(n,d.soru);(n>=d.soru?hazir:eksik).push(d.ad+' '+d.soru)});
  else top=Math.min(V.hepsi.length,D.soru);
  var dk=Math.max(5,Math.round(D.dakika*top/D.soru));
  M.innerHTML='<h1>Deneme sınavı</h1><div class="metin"><p>Gerçek sınav: <b>'+D.soru+' soru, '+D.dakika+' dakika</b>. '+(D.yanlisGoturur?'Dört yanlış bir doğruyu götürür.':'Yanlış cevaplar doğruları götürmez; boş bırakmak avantaj sağlamaz.')+'</p>'+
   (top<D.soru?'<p class="not">Şu anda hazır olan derslerden <b>'+top+' soruluk</b> bir deneme hazırlanır ve süre buna göre <b>'+dk+' dakika</b> olur.'+(eksik.length?' Hazırlanmakta olan dersler: '+e(eksik.join(', '))+' soru.':'')+'</p>':'')+
   '<p>Sorular arasında serbestçe geçebilir, cevabını değiştirebilir ve emin olmadığın soruları işaretleyebilirsin. Süre bitince sınav kendiliğinden biter. Sayfayı kapatsan da deneme kaldığı yerden devam eder.</p></div>'+
   '<div class="dugmeler"><button class="btn" id="basla"'+(top?'':' disabled')+'>Başla</button></div>';
  $('#basla').onclick=function(){A=denemeKur(S,V);guncelle(function(o){o['a.'+S.id]=A});deneme(S,V)};return}
 var Q=A.s.map(function(k){return soruBul(V,k)}).filter(Boolean),i=A.n||0;
 if(!Q.length){guncelle(function(o){delete o['a.'+S.id]});return deneme(S,V)}
 function kaydet(){A.n=i;guncelle(function(o){o['a.'+S.id]=A})}
 if(Date.now()>=A.bit){bitir(true);return}
 var sa=$('#saat');sa.style.display='inline-block';clearInterval(saatGizle.i);
 function tik(){var k=(A.bit-Date.now())/1000;sa.textContent=saatYaz(k);sa.className=k<300?'az':'';if(k<=0){clearInterval(saatGizle.i);bitir(true)}}
 tik();saatGizle.i=setInterval(tik,1000);
 function ciz(){var q=Q[i],k=q._k,h='<div class="soru"><div class="ust"><span>'+e(q._konu.ders||'')+'</span><span>Soru '+(i+1)+' / '+Q.length+'</span></div><div class="kok">'+e(q.s)+'</div>';
  q.c.forEach(function(c,j){h+='<button class="sik'+(A.c[k]===j?' secili':'')+'" data-j="'+j+'"><i>'+HARF[j]+')</i><span>'+e(c)+'</span></button>'});
  h+='<div class="dugmeler"><button class="btn ik kucuk" id="onc"'+(i?'':' disabled')+'>‹ Önceki</button><button class="btn ik kucuk" id="isa">'+(A.i[k]?'İşareti kaldır':'İşaretle')+'</button>'+
   (A.c[k]!=null?'<button class="btn ik kucuk" id="sil">Cevabı sil</button>':'')+'<button class="btn kucuk" id="son">'+(i+1<Q.length?'Sonraki ›':'Bitir')+'</button></div></div>';
  h+='<div class="harita">'+Q.map(function(x,n){return'<button data-n="'+n+'" class="'+(A.c[x._k]!=null?'cevap ':'')+(A.i[x._k]?'isaret ':'')+(n===i?'simdi':'')+'">'+(n+1)+'</button>'}).join('')+'</div>'+
   '<div class="dugmeler"><button class="btn ik" id="bitir">Sınavı bitir</button></div>';
  M.innerHTML=h;
  [].forEach.call(M.querySelectorAll('.sik'),function(b){b.onclick=function(){A.c[k]=+b.dataset.j;kaydet();ciz()}});
  [].forEach.call(M.querySelectorAll('.harita button'),function(b){b.onclick=function(){i=+b.dataset.n;kaydet();ciz();scrollTo(0,0)}});
  $('#onc').onclick=function(){i--;kaydet();ciz();scrollTo(0,0)};
  $('#isa').onclick=function(){if(A.i[k])delete A.i[k];else A.i[k]=1;kaydet();ciz()};
  if($('#sil'))$('#sil').onclick=function(){delete A.c[k];kaydet();ciz()};
  $('#son').onclick=function(){if(i+1<Q.length){i++;kaydet();ciz();scrollTo(0,0)}else soruBitir()};
  $('#bitir').onclick=soruBitir}
 function soruBitir(){var bos=Q.filter(function(q){return A.c[q._k]==null}).length,isr=Object.keys(A.i).length;
  if(confirm('Sınavı bitirmek istiyor musun?'+(bos?'\n'+bos+' soru boş.':'')+(isr?'\n'+isr+' işaretli soru var.':'')))bitir(false)}
 function bitir(sureDoldu){clearInterval(saatGizle.i);
  var R={t:Date.now(),n:Q.length,dogru:0,yanlis:0,bos:0,sure:Math.round((Math.min(Date.now(),A.bit)-A.bas)/1000),dk:A.dk,ders:{},s:A.s,c:A.c,yg:!!D.yanlisGoturur};
  Q.forEach(function(q){var j=A.c[q._k],d=q._konu.ders||'Diğer';R.ders[d]=R.ders[d]||[0,0];R.ders[d][1]++;
   if(j==null)R.bos++;else if(j===q.d){R.dogru++;R.ders[d][0]++;isle(S,q,true)}else{R.yanlis++;isle(S,q,false)}});
  guncelle(function(o){var G=o['dn.'+S.id]||[];G.push(R);o['dn.'+S.id]=G.slice(-20);delete o['a.'+S.id]});
  if(sureDoldu)toast('Süre doldu, sınav bitti.');
  git('s='+S.id+'&t=sonuc')}
 ciz()}

function sonuc(S,V){
 saatGizle();var G=oku()['dn.'+S.id]||[],R=G[G.length-1];
 if(!R){M.innerHTML='<div class="bos-kutu">Henüz deneme çözmedin.</div>';return}
 var net=R.yg?R.dogru-R.yanlis/4:R.dogru,h='<h1>Deneme sonucu</h1><div class="soru sonuc"><div class="buyuk">'+(Math.round(net*100)/100)+'</div><p>'+(R.yg?'net (dört yanlış bir doğruyu götürür)':'ham puan = doğru sayısı (yanlışlar götürmez)')+'</p>'+
  '<div class="sayilar"><div><b>'+R.dogru+'</b>doğru</div><div><b>'+R.yanlis+'</b>yanlış</div><div><b>'+R.bos+'</b>boş</div></div>'+
  '<p style="color:var(--muted);font-size:14px">'+R.n+' soru · süre '+saatYaz(R.sure)+' / '+R.dk+':00</p></div><h2>Ders ders başarı</h2>';
 Object.keys(R.ders).forEach(function(d){var x=R.ders[d],p=Math.round(100*x[0]/x[1]);
  h+='<div class="ders"><div class="bas"><span>'+e(d)+'</span><span>'+x[0]+' / '+x[1]+' · %'+p+'</span></div><div class="cubuk"><i style="width:'+p+'%;background:'+(p>=70?'var(--ok)':p>=40?'var(--warn)':'var(--no)')+'"></i></div></div>'});
 if(G.length>1){h+='<h2>Önceki denemeler</h2>';G.slice(0,-1).slice(-5).reverse().forEach(function(g){var dt=new Date(g.t);
  h+='<div class="satir pasif"><span>'+dt.toLocaleDateString('tr-TR')+'</span><small>'+g.dogru+' / '+g.n+' doğru</small></div>'})}
 h+='<div class="dugmeler"><button class="btn" id="incele">Soruları incele</button><button class="btn ik" id="yeni">Yeni deneme</button><button class="btn ik" id="don">Sınava dön</button></div>'+
  (R.yanlis?'<p class="lead" style="font-size:14px">Yanlış yaptığın '+R.yanlis+' soru yanlış defterine eklendi. Yarından itibaren aralıklı olarak tekrar sorulacak.</p>':'')+'<div id="inc"></div>';
 M.innerHTML=h;scrollTo(0,0);
 $('#yeni').onclick=function(){git('s='+S.id+'&t=deneme')};$('#don').onclick=function(){git('s='+S.id)};
 $('#incele').onclick=function(){var t='';(R.s||[]).forEach(function(k,n){var q=soruBul(V,k);if(!q)return;var j=R.c[k];
   t+='<div class="soru" style="margin-bottom:10px"><div class="ust"><span>'+e(q._konu.ders||'')+'</span><span>'+(n+1)+'. soru · '+(j==null?'boş':j===q.d?'doğru':'yanlış')+'</span></div><div class="kok">'+e(q.s)+'</div>'+
    q.c.map(function(c,m){return'<div class="sik '+(m===q.d?'dogru':m===j?'yanlis':'')+'" style="cursor:default"><i>'+HARF[m]+')</i><span>'+e(c)+'</span></div>'}).join('')+aciklamaHTML(q,j)+'</div>'});
  $('#inc').innerHTML='<h2>Sorular</h2>'+t;$('#incele').disabled=true}}

function defterSayfa(S,V){
 var d=defter(S),K=Object.keys(d).filter(function(k){return soruBul(V,k)}),n=Date.now();
 K.sort(function(a,b){return d[a].t-d[b].t});
 var h='<h1>Yanlış defteri</h1><p class="lead">Yanlış yaptığın her soru buraya gelir ve 1, 3, 7, 15 ve 30 gün arayla yeniden sorulur. Beş tekrarda da doğru yaparsan defterden düşer. Bir tekrarda yanlış yaparsan baştan başlar.</p>';
 if(!K.length){M.innerHTML=h+'<div class="bos-kutu">Defterin boş. Test ve denemelerde yanlış yaptığın sorular burada birikecek.</div>';return}
 var bug=K.filter(function(k){return d[k].t<=n}).length;
 h+='<div class="dugmeler"><button class="btn" id="tek"'+(bug?'':' disabled')+'>Bugünküleri çöz ('+bug+')</button><button class="btn ik" id="hep">Hepsini şimdi çöz ('+K.length+')</button></div>';
 K.forEach(function(k){var q=soruBul(V,k),x=d[k];
  h+='<details class="ders"><summary style="font-weight:500"><b>'+e(q._konu.ders||'')+'</b> · '+e(q.s.split('\n')[0].slice(0,110))+(q.s.length>110?'…':'')+
   '<br><small style="color:var(--muted)">'+x.y+' kez yanlış · tekrar: '+tarih(x.t)+' · aşama '+(x.k+1)+'/'+ARALIK.length+'</small></summary>'+
   '<div class="kok" style="white-space:pre-line;margin:8px 0">'+e(q.s)+'</div>'+q.c.map(function(c,m){return'<div class="sik '+(m===q.d?'dogru':'')+'" style="cursor:default"><i>'+HARF[m]+')</i><span>'+e(c)+'</span></div>'}).join('')+aciklamaHTML(q,null)+'</details>'});
 M.innerHTML=h;
 $('#tek').onclick=function(){git('s='+S.id+'&t=tekrar')};
 $('#hep').onclick=function(){test(S,'Yanlış defteri',karistir(K.map(function(k){return soruBul(V,k)})),null,'s='+S.id+'&t=defter')}}

function ac(){var H=hash();saatGizle();if(!H.s)return liste();
 al('data/kadem/sinavlar.json').then(function(L){var S=L.sinavlar.filter(function(s){return s.id===H.s})[0];if(!S)return liste();
  renk(S.renk);$('#bas').textContent=S.ad;document.title=S.ad+' · Kadem';
  return sinav(S.id).then(function(V){var K=V.konular||[];
   function bul(id){return K.filter(function(x){return x.id===id})[0]}
   scrollTo(0,0);
   if(H.t){$('#geri').onclick=function(){git('s='+S.id)};
    if(H.t==='deneme')return deneme(S,V);
    if(H.t==='sonuc')return sonuc(S,V);

    if(H.t==='defter')return defterSayfa(S,V);
    if(H.t==='tekrar')return test(S,'Bugünkü tekrar',karistir(bugunku(S,V).map(function(k){return soruBul(V,k)})),null);
    var x=bul(H.t);if(x){$('#geri').onclick=function(){git('s='+S.id+'&k='+x.id)};return test(S,x.ad,kolaydanZora(x.sorular||[]),'p.'+S.id+'.'+x.id,'s='+S.id+'&k='+x.id)}}
   if(H.k){var y=bul(H.k);if(y){$('#geri').onclick=function(){git('s='+S.id)};return konuSayfa(S,y,H.g)}}
   $('#geri').onclick=function(){git('')};sinavSayfa(S,V)})
 }).catch(hata)}
addEventListener('hashchange',ac);ac();
})();
