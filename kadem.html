<!DOCTYPE html>
<html lang="tr"><head>
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script src="kalkan.js"></script><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kadem · el-Mihrâb</title>
<meta name="theme-color" content="#f3efe6">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f3efe6;--kagit:#fffdf9;--ink:#1d1b17;--muted:#6d665a;--line:#dcd3c1;--rule:#b9ad94;--acc:#1d5c4a;--yaldiz:#8c6d2c;--ok:#2d6a3e;--no:#9a2f2a;--uyari:#8a5d10;--uyaribg:#f6ecd5;
 --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,"Noto Serif",Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--kagit:#1c1c1a;--ink:#ebe6db;--muted:#a39b8c;--line:#302e29;--rule:#4a463d;--uyaribg:#33291a;--uyari:#d9a74f;--yaldiz:#c9a55a;--ok:#5fae74;--no:#e0726b}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);padding-top:calc(54px + env(safe-area-inset-top,0px));padding-bottom:56px;-webkit-font-smoothing:antialiased}
a{color:inherit}
#top{position:fixed;top:0;left:0;right:0;z-index:9;display:flex;align-items:center;gap:12px;padding:calc(9px + env(safe-area-inset-top,0px)) 14px 9px;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:inset 0 3px 0 var(--acc)}
#top a{color:var(--ink);text-decoration:none;font-size:15px;cursor:pointer;padding:4px 2px;white-space:nowrap}
#top a:before{content:"‹ ";color:var(--acc);font-weight:700}
#top b{flex:1;font:600 17px/1.2 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
#top .sag{min-width:56px;text-align:right}
#saat{font:700 15px var(--mono);border:1px solid var(--rule);border-radius:3px;padding:3px 8px;display:none;background:var(--kagit)}
#saat.az{color:#fff;background:var(--no);border-color:var(--no)}
main{max-width:860px;margin:0 auto;padding:14px 16px}
h1{font:600 28px/1.2 var(--serif);margin:10px 0 6px;letter-spacing:-.01em}
h2{display:flex;align-items:center;gap:10px;font:700 12.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:30px 0 12px}
h2:after{content:"";flex:1;border-top:1px solid var(--line)}
h2 em{font-style:normal;color:var(--acc)}
.lead{color:var(--muted);margin:0 0 14px;max-width:62ch}
.kucukyazi{font-size:13.5px;color:var(--muted)}
.ust-etiket{font:700 11.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
/* Ana liste */
.izgara{display:grid;gap:10px}@media(min-width:680px){.izgara{grid-template-columns:1fr 1fr}}
.kart{display:block;text-decoration:none;color:inherit;background:var(--kagit);border:1px solid var(--line);border-radius:4px;padding:14px 16px 12px;cursor:pointer;transition:border-color .15s}
.kart:hover{border-color:var(--rule)}
.kart .kod{display:flex;align-items:center;gap:8px;font:700 11px var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.kart .kod i{width:9px;height:9px;background:var(--r,var(--acc));display:inline-block}
.kart b{display:block;font:600 19px/1.3 var(--serif);margin:6px 0 2px}
.kart small{display:block;color:var(--muted);font-size:14px}
.kart .alt{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
.kart .alt strong{color:var(--ink);font-weight:600}
.kart.bos{background:transparent}
.kart.bos b{color:var(--muted)}
.serit{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:4px;background:var(--kagit);margin:14px 0}
.serit div{padding:10px 12px;border-left:1px solid var(--line)}.serit div:first-child{border-left:0}
.serit b{display:block;font:600 24px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.serit span{font-size:12px;color:var(--muted);letter-spacing:.04em}
@media(max-width:520px){.serit{grid-template-columns:1fr 1fr}.serit div:nth-child(3){border-left:0}.serit div:nth-child(n+3){border-top:1px solid var(--line)}}
/* Ana sayfa: iki ana sınav + diğerleri */
.anakart{display:block;text-decoration:none;color:inherit;background:var(--kagit);border:1px solid var(--line);border-top:3px solid var(--r,var(--acc));border-radius:4px;padding:16px 18px 14px;margin-bottom:12px}
.anakart .kod{font:700 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.anakart b{display:block;font:600 24px/1.25 var(--serif);margin:4px 0 2px}
.anakart small{display:block;color:var(--muted);font-size:14px}
.anakart .devam{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:14.5px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.anakart .devam span{color:var(--muted)}.anakart .devam strong{font-weight:600;color:var(--ink)}
.anakart .devam em{font-style:normal;color:var(--r,var(--acc));font-weight:700;white-space:nowrap}
details.diger{margin-top:26px;border-top:1px solid var(--line);padding-top:6px}
details.diger>summary{font:700 12.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:10px 0;list-style:none}
details.diger>summary::-webkit-details-marker{display:none}
details.diger>summary:before{content:"+ ";color:var(--acc)}details.diger[open]>summary:before{content:"− "}
.grup-ad{font:600 13px var(--sans);color:var(--muted);margin:16px 0 6px}
/* Sınav sayfası: sade çalışma listesi */
.araclar{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;margin:18px 0 4px}
.araclar a{display:flex;align-items:center;justify-content:center;min-height:42px;text-align:center;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--kagit);border-radius:4px;padding:6px 8px;font-size:14px;line-height:1.2}
.dersgrup{border-top:1px solid var(--line)}
.dersgrup:first-child{border-top:0}
.dersgrup>summary{list-style:none;border-top:0}
.dersgrup>summary::-webkit-details-marker{display:none}
.dersgrup>summary .ok{flex:none;color:var(--muted);font-size:13px;transition:transform .15s}
.dersgrup[open]>summary .ok{transform:rotate(90deg)}
.dersgrup .ic{border-top:1px solid var(--line);background:var(--bg)}
.dersgrup .ic .satir{padding-left:24px}
.dersgrup .ic .satir.alt small{color:var(--acc)}
.araclar a.vurgu{border-color:var(--yaldiz);color:var(--yaldiz);font-weight:600}
.satir span small{white-space:normal}
/* Sınav ana sayfası */
.bugunkart{display:block;text-decoration:none;color:inherit;background:var(--kagit);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:4px;padding:13px 16px;margin:16px 0 10px}
.bugunkart b{display:block;font:600 20px/1.3 var(--serif);margin:3px 0 2px}
.bugunkart small{color:var(--muted);font-size:14px}
.karolar{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(min-width:680px){.karolar{grid-template-columns:repeat(4,1fr)}}
.karo{display:block;text-decoration:none;color:inherit;background:var(--kagit);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.karo b{display:block;font-size:15.5px}.karo span{font-size:13px;color:var(--muted)}
.karo.vurgu{border-color:var(--yaldiz)}.karo.vurgu b{color:var(--yaldiz)}
.ders-kart .cubuk{margin-top:10px}
.ozet-bas{font:600 17px/1.35 var(--serif);margin:18px 0 6px}.ozet-bas a{text-decoration:none}
details.ders>summary{color:var(--ink)}
@media print{#top{display:none}body{padding:0;background:#fff}.ozet{border:0}}
/* Giriş */
.giris{max-width:380px;margin:40px auto;text-align:center}
.giris input{width:100%;font:17px var(--sans);padding:11px 12px;border:1px solid var(--rule);border-radius:3px;background:var(--kagit);color:var(--ink);margin:14px 0 10px;text-align:center}
/* Künye tablosu */
.kunye{width:100%;border-collapse:collapse;background:var(--kagit);border:1px solid var(--line);font-size:15px;margin:6px 0 4px}
.kunye th{width:34%;text-align:left;font-weight:600;color:var(--muted);font-size:13px;letter-spacing:.03em;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.kunye td{padding:8px 12px;border-bottom:1px solid var(--line)}
.kunye tr:last-child th,.kunye tr:last-child td{border-bottom:0}
/* Düğmeler */
.dugmeler{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:12px 0 14px}
.dugmeler .btn{text-align:center;padding:9px 6px;font-size:14px;white-space:nowrap}
.btn{display:inline-block;border:1px solid var(--acc);border-radius:3px;padding:9px 16px;font:600 15px var(--sans);background:var(--acc);color:#fff;cursor:pointer;text-decoration:none}
.btn.ik{background:var(--kagit);color:var(--ink);border-color:var(--rule)}
.btn.kucuk{padding:6px 11px;font-size:14px}
.btn[disabled]{opacity:.4;cursor:default}
.btn .say{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:2px;background:rgba(0,0,0,.12);font-variant-numeric:tabular-nums;font-size:13px}
.btn.ik .say{background:var(--bg)}
/* Konu satırları */
.konular{border:1px solid var(--line);border-radius:4px;background:var(--kagit)}
.satir{display:flex;align-items:baseline;gap:12px;padding:11px 14px;border-top:1px solid var(--line);text-decoration:none;color:inherit;cursor:pointer;position:relative}
.satir:first-child{border-top:0}
.satir:hover{background:color-mix(in srgb,var(--acc) 5%,transparent)}
.satir .no{flex:none;font:600 15px var(--serif);color:var(--acc);min-width:22px;font-variant-numeric:oldstyle-nums}
.satir span{flex:1}
.satir small{color:var(--muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.satir .ilerle{position:absolute;left:0;bottom:0;height:2px;background:var(--acc);opacity:.55}
.satir.pasif{cursor:default}
.satir.bugun{background:color-mix(in srgb,var(--yaldiz) 10%,transparent)}
.satir.bitti span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rule)}
/* Deneme tablosu */
.cizelge{width:100%;border-collapse:collapse;background:var(--kagit);border:1px solid var(--line);font-size:15px}
.cizelge th{font:700 11.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule)}
.cizelge td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
.cizelge tr:last-child td{border-bottom:0}
.cizelge td.ad{font:600 16px var(--serif)}
.cizelge td.sag{text-align:right}
/* Metin */
.metin{background:var(--kagit);border:1px solid var(--line);border-radius:4px;padding:8px 22px 16px;font-size:16.5px;line-height:1.7}
.metin p{margin:12px 0}
.metin h3{font:600 19px/1.3 var(--serif);margin:24px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.metin .not{border-left:3px solid var(--yaldiz);padding:6px 12px;background:color-mix(in srgb,var(--yaldiz) 8%,transparent);font-size:15.5px}
.metin .not:before{content:"Not";display:block;font:700 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--yaldiz);margin-bottom:2px}
.metin .merak{font:italic 17px/1.55 var(--serif);color:var(--ink);margin:4px 0 12px;padding-left:12px;border-left:2px solid var(--acc)}
.metin .sinav,.metin .akil{padding:8px 12px;font-size:15.5px;border-radius:3px}
.metin .sinav{border:1px dashed var(--no);background:color-mix(in srgb,var(--no) 5%,transparent)}
.metin .sinav:before{content:"Sınavda nasıl sorulur?";display:block;font:700 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--no);margin-bottom:2px}
.metin .akil{border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);background:color-mix(in srgb,var(--acc) 6%,transparent)}
.metin .akil:before{content:"Aklında kalsın";display:block;font:700 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin-bottom:2px}
.metin .kontrol{background:var(--uyaribg);border-left:3px solid var(--uyari);padding:8px 12px;font-size:15px}
.metin .kontrol b{color:var(--uyari)}
.alinti{margin:14px 0;padding:10px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-family:var(--serif);font-size:17px}
.alinti .tur{display:block;font:700 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
.alinti em{display:block;font:normal 13px var(--sans);color:var(--muted);margin-top:6px;text-align:right}
.tablo{overflow-x:auto;margin:12px 0}
.tablo table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.45}
.tablo th,.tablo td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.tablo th{border-bottom:1.5px solid var(--rule);font-weight:700;font-size:13px;letter-spacing:.02em}
.tablo tr:nth-child(even) td{background:color-mix(in srgb,var(--ink) 2.5%,transparent)}
.sekmeler{display:flex;gap:0;margin:10px 0 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.sekmeler a{flex:none;text-decoration:none;color:var(--muted);padding:8px 14px;font-weight:600;font-size:15px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.sekmeler a.on{color:var(--ink);border-bottom-color:var(--acc)}
.ozet{background:var(--kagit);border:1px solid var(--line);border-radius:4px;padding:8px 20px 8px 40px;counter-reset:o;list-style:none}
.ozet li{margin:10px 0;position:relative;counter-increment:o}
.ozet li:before{content:counter(o);position:absolute;left:-28px;top:0;font:600 14px var(--serif);color:var(--acc)}
.bos-kutu{border:1px dashed var(--rule);border-radius:4px;padding:22px 16px;text-align:center;color:var(--muted)}
/* Soru */
.soru{background:var(--kagit);border:1px solid var(--line);border-radius:4px;padding:16px 18px}
.soru .ust{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.soru .ust b{color:var(--ink);font:600 15px var(--serif);flex:1;min-width:0}
.soru .ust>span:last-child{white-space:nowrap;flex:none}
.soru .kok{font:17px/1.6 var(--serif);margin-bottom:14px;white-space:pre-line}
.zor{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:2px;padding:0 5px;margin-right:4px}
.sik{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:1px solid transparent;background:transparent;color:inherit;border-radius:3px;padding:8px 8px;margin-bottom:4px;font:16px/1.5 var(--sans);cursor:pointer}
.sik:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.sik i{font:700 13px/24px var(--sans);font-style:normal;width:26px;height:26px;flex:none;border:1.5px solid var(--rule);border-radius:50%;text-align:center;margin-top:-1px}
.sik.secili i{background:var(--ink);border-color:var(--ink);color:var(--kagit)}
.sik.dogru{border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 8%,transparent)}
.sik.dogru i{background:var(--ok);border-color:var(--ok);color:#fff}
.sik.yanlis{border-color:color-mix(in srgb,var(--no) 45%,transparent);background:color-mix(in srgb,var(--no) 7%,transparent)}
.sik.yanlis i{background:var(--no);border-color:var(--no);color:#fff}
.aciklama{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;font-size:15.5px}
.aciklama>b:first-child{font-family:var(--serif)}
.aciklama ul{margin:6px 0 0;padding-left:18px}.aciklama li{margin:5px 0}
.aciklama small{color:var(--muted)}
details summary{cursor:pointer;font-weight:600;margin-top:8px;font-size:14.5px;color:var(--acc)}
/* Sonuç */
.sonuc{text-align:center;padding:18px 16px}
.sonuc .buyuk{font:600 52px/1 var(--serif);color:var(--ink);font-variant-numeric:tabular-nums}
.sayilar{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);margin:16px 0 8px}
.sayilar div{padding:8px;border-left:1px solid var(--line)}.sayilar div:first-child{border-left:0}
.sayilar b{display:block;font:600 24px var(--serif)}
.cubuk{height:4px;background:var(--line);overflow:hidden;margin-top:6px}
.adimlar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:14px 0 18px}
.adimlar a{display:flex;flex-direction:column;align-items:center;gap:5px;text-decoration:none;color:var(--muted);font:600 12.5px var(--sans);padding:6px 2px 9px;border-bottom:3px solid var(--line)}
.adimlar a b{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--rule);display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--kagit)}
.adimlar a.tam{color:var(--ok)}.adimlar a.tam b{background:var(--ok);border-color:var(--ok);color:#fff}
.adimlar a.on{color:var(--acc);border-bottom-color:var(--acc)}.adimlar a.on b{border-color:var(--acc);color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 15%,transparent)}
.adimlar a.on.tam b{color:#fff}
.bolumust{display:flex;justify-content:space-between;align-items:baseline;font:600 13px var(--sans);color:var(--muted);margin-bottom:4px}
.bolumust+.cubuk{margin:0 0 6px}
.icindekiler{margin:8px 0 4px;font-size:14px}.icindekiler summary{color:var(--acc);cursor:pointer;font-weight:600}
.icindekiler ol{margin:8px 0 0 20px;padding:0}.icindekiler li{margin:3px 0}.icindekiler a{color:inherit}.icindekiler li.on a{color:var(--acc);font-weight:700}
.adimdugme{display:flex;gap:8px;margin:22px 0 6px}.adimdugme .btn{flex:1;text-align:center;padding:12px 8px}
.adimdugme .btn.ik{flex:0 0 auto}
.kucuklink{display:block;text-align:center;font-size:13.5px;color:var(--muted);margin:8px 0}
.nokta{display:inline-flex;gap:3px;flex:none;align-self:center}.nokta i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--rule);box-sizing:border-box}
.nokta i.tam{background:var(--acc);border-color:var(--acc)}.nokta i.simdi{border-color:var(--acc)}
.yolkart{background:var(--kagit);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:4px;padding:14px 16px;margin:16px 0 8px}
.yolkart b{display:block;font:600 20px/1.3 var(--serif);margin:4px 0 2px}.yolkart small{color:var(--muted);font-size:14px}
.yolkart .nokta{margin:10px 0 2px}.yolkart .btn{display:block;text-align:center;margin-top:12px;padding:12px}
.genel{display:flex;justify-content:space-between;font:600 13px var(--sans);color:var(--muted);margin-top:14px}
.genel+.cubuk{height:6px;border-radius:3px}.genel+.cubuk i{border-radius:3px}
.anaarac{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:18px 0 6px}
.anaarac a{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:56px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--kagit);border-radius:4px;font:600 14px var(--sans);text-align:center;line-height:1.2;padding:6px}
.anaarac a small{color:var(--muted);font-weight:400;font-size:12px;margin-top:2px}.anaarac a.vurgu{border-color:var(--yaldiz);color:var(--yaldiz)}
.cubuk i{display:block;height:100%;background:var(--acc)}
.ders{background:var(--kagit);border:1px solid var(--line);border-radius:4px;padding:10px 14px;margin-bottom:6px}
.ders .bas{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.ders .bas span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500;font-size:14px;white-space:nowrap}
.ders ul{margin:8px 0 0;padding-left:18px;font-size:15px}.ders li{margin:4px 0}
.yildiz{color:var(--yaldiz);font-size:12px;white-space:nowrap;letter-spacing:1px}

function sinav(id){
 return al('data/kadem/'+id+'.json').catch(function(x){if(x==='sifre')throw x;return{konular:[]}}).then(function(V){
  if(V._hazir)return V;
  var yukle=function(liste,klasor){return Promise.all((liste||[]).map(function(k){
   return k.ref?al('data/kadem/'+klasor+'/'+k.ref+'.json').catch(function(){return null}):Promise.resolve(k)}))};
  return Promise.all([yukle(V.konular,'konu'),yukle(V.denemeler,'deneme')]).then(function(R){
   V.konular=R[0].filter(Boolean);V.denemeler=R[1].filter(Boolean);V.hepsi=[];V.havuz=[];
   V.konular.forEach(function(x){(x.sorular||[]).forEach(function(q,n){q._k=q.id||x.id+'.'+n;q._konu=x;V.hepsi.push(q);V.havuz.push(q)})});
   V.denemeler.forEach(function(D){(D.sorular||[]).forEach(function(q,n){q._k=q.id||D.id+'.'+n;q._konu={id:D.id,ad:D.ad,ders:q.ders};q._deneme=D.id;V.hepsi.push(q)})});
   V._hazir=1;return V})})}
function soruBul(V,k){if(!V._idx){V._idx={};V.hepsi.forEach(function(q){V._idx[q._k]=q})}return V._idx[k]}

function isle(S,q,dogru){gunKaydet(S);var d=defter(S),x=d[q._k],simdi=Date.now();

function bugunku(S,V){var d=defter(S),n=Date.now();return Object.keys(d).filter(function(k){return d[k].t<=n&&soruBul(V,k)})}
