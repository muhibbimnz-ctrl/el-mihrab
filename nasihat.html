<!DOCTYPE html><html lang="tr"><head>
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script src="kalkan.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Nasihatler — el-Mihrâb</title><meta name="theme-color" content="#0D1B18">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#F5F0E4;color:#1F2A26;font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif}
#hd{background:#0D1B18;color:#EFE6D2;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 22px}
#hd .top{display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto}#hd a{color:#EFE6D2;text-decoration:none;border:1px solid rgba(217,184,104,.4);border-radius:11px;padding:7px 12px;font-weight:600;font-size:14px;white-space:nowrap}
#hd .bas{max-width:720px;margin:18px auto 0}#hd h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:34px;line-height:1.1;margin:0;color:#F4ECDA}#hd p{margin:6px 0 0;color:rgba(239,230,210,.75);font-size:14.5px;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:18px 16px 60px}
.gun{background:#fff;border:1px solid #E4DAC4;border-left:3px solid #B8963E;border-radius:6px 14px 14px 6px;padding:18px 18px 16px;margin:0 0 26px}
.et{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8C6F2A;margin:0 0 8px}
h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;margin:0 0 8px;color:#1F2A26}
blockquote{margin:0;font-family:"Source Serif 4",Georgia,serif;font-size:17px;line-height:1.65}
.kay{font-size:13px;color:#7A705E;margin:6px 0 10px}.s{margin:0;font-size:15px;line-height:1.6;color:#3C4642}
.lh{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#7A705E;margin:0 2px 8px}
.bl{border-top:1px solid #E4DAC4;padding:16px 2px}.bl:last-child{border-bottom:1px solid #E4DAC4}
.kay b{color:#5E4B1E;font-weight:600}.kim{font-family:"Cormorant Garamond",Georgia,serif;font-size:19px;font-weight:700;color:#8C6F2A;margin:20px 2px 2px}.sek{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}.sek a{flex:1 1 30%;min-width:140px;text-align:center;text-decoration:none;color:#1F2A26;background:#fff;border:1px solid #E4DAC4;border-radius:12px;padding:11px 8px;font-weight:600;font-size:14.5px}.sek a span{color:#8C6F2A;margin-left:4px}.bl .no{font-family:"Cormorant Garamond",Georgia,serif;font-size:15px;color:#B8963E;margin-right:6px}.bl h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:21px;margin:0 0 6px}
.bl blockquote{font-size:16px}.bl.bu{background:rgba(184,150,62,.07)}
@media(prefers-color-scheme:dark){body{background:#101714;color:#E6DFCF}.sek a{background:#17211D;border-color:#2A3631;color:#E6DFCF}.kay b{color:#D9B868}.kim{color:#D9B868}.gun{background:#17211D;border-color:#2A3631}h2,.bl h3{color:#F0E8D6}.s{color:#C9C3B4}.kay,.lh{color:#9C9483}.bl{border-color:#2A3631}.bl:last-child{border-color:#2A3631}.et{color:#D9B868}}
</style></head><body>
<div id="hd"><div class="top"><a href="index.html#namaz">‹ Namaz ve Kur’an</a></div>
<div class="bas"><h1>Nasihatler</h1><p>İlme ve okumaya teşvik eden âyetler, hadisler; büyük âlimlerle tasavvuf büyüklerinin sözleri. Uygulama açılırken gösterilen günün nasihati bu kitaptan gelir; her gün yenilenir.</p></div></div>
<main id="m"><p class="s">Yükleniyor…</p></main>
<script src="salavat.js?v=4"></script>
<script>
(function(){var M=document.getElementById('m');
 function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
 fetch('data/nasihat.json').then(function(r){return r.json()}).then(function(j){var L=j.n||[],g=window.gunNasihati(L),x=L[g];
  function kay(y){return '<div class="kay">'+(y.kim?'<b>'+esc(y.kim)+'</b> · ':'')+esc(y.k)+'</div>'}
  function bl(y){var i=L.indexOf(y);return '<article class="bl'+(i===g?' bu':'')+'"><h3>'+esc(y.b)+'</h3><blockquote>“'+esc(y.n)+'”</blockquote>'+kay(y)+'<p class="s">'+esc(y.s)+'</p></article>'}
  var h='<section class="gun"><div class="et">Günün nasihati</div><h2>'+esc(x.b)+'</h2><blockquote>“'+esc(x.n)+'”</blockquote>'+kay(x)+'<p class="s">'+esc(x.s)+'</p></section>';
  var IL=L.filter(function(y){return y.il}),H=L.filter(function(y){return !y.il&&y.t!=='s'}),Z=L.filter(function(y){return !y.il&&y.t==='s'});
  h+='<nav class="sek"><a href="#il">İlim ve okumak <span>'+IL.length+'</span></a><a href="#ah">Âyet ve hadisler <span>'+H.length+'</span></a><a href="#bs">Büyüklerin sözleri <span>'+Z.length+'</span></a></nav>';
  var ILh=IL.filter(function(y){return y.t!=='s'}),ILs=IL.filter(function(y){return y.t==='s'});
  h+='<div class="lh" id="il">İlim ve okumak</div><div class="kim">Âyet ve hadisler</div>'+ILh.map(bl).join('')+'<div class="kim">Büyüklerin sözleri</div>'+ILs.map(bl).join('');
  h+='<div class="lh" id="ah" style="margin-top:30px">Âyet ve hadisler</div>'+H.map(bl).join('');
  var kimler=[];Z.forEach(function(y){if(kimler.indexOf(y.kim)<0)kimler.push(y.kim)});
  h+='<div class="lh" id="bs" style="margin-top:30px">Büyüklerin sözleri</div>';
  kimler.forEach(function(k){h+='<div class="kim">'+esc(k)+'</div>'+Z.filter(function(y){return y.kim===k}).map(bl).join('')});
  M.innerHTML=h}).catch(function(){M.innerHTML='<p class="s">Nasihatler yüklenemedi. İnternet bağlantını kontrol et.</p>'})})();
</script>
<script>(function(){if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(function(){})})();</script>
</body></html>
