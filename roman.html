<script>
var M=document.getElementById('m'),Q=new URLSearchParams(location.search),DIL=Q.get('dil')||'',LIST=[],K=null,CUR=null;

function kitap(){CUR=null;ttl.textContent=K.tr_baslik;bk('‹ Kitaplar',function(){history.back()});
 var h='<div class="note"><b class="'+K.dil+'" style="font-size:24px;display:block">'+esc(K.baslik)+'</b>'+esc(K.yazar)+' · Seviye '+K.seviye+(K.not?'<br><small>'+esc(K.not)+'</small>':'')+'</div><h2>Bölümler</h2>';
 K.bolumler.forEach(function(b,i){h+='<div class="ch" data-i="'+i+'"><span><b class="'+K.dil+'" style="font-size:19px">'+esc(b.b)+'</b>'+(b.tr_b?' · '+esc(b.tr_b):'')+'</span><span class="ok">'+(st.ok[K.id+'#'+i]?'✓':'›')+'</span></div>'});
 M.innerHTML=h;M.querySelectorAll('.ch').forEach(function(e){e.onclick=function(){git('#k='+K.id+'&b='+e.dataset.i)}});scrollTo(0,0)}
function tok(s,d){if(K&&K.uzun)return tokU(s,d);if(d==='en')return s.split(/(\s+)/).map(function(p){if(/^\s+$/.test(p))return p;var m=p.match(/^([^A-Za-z']*)([A-Za-z']+)(.*)$/);if(!m)return esc(p);var n=norm(m[2],d);return esc(m[1])+'<span class="w'+(st.d[d+'|'+n]?' kn':'')+'" data-n="'+esc(n)+'">'+esc(m[2])+'</span>'+esc(m[3])}).join('');
 return s.split(/(\s+)/).map(function(p){if(/^\s+$/.test(p)||!p)return p;var n=norm(p,d);return n?'<span class="w'+(st.d[d+'|'+n]?' kn':'')+'" data-n="'+esc(n)+'">'+esc(p)+'</span>':esc(p)}).join('')}
function tokU(s,d){return s.split(/(\s+)/).map(function(p){if(/^\s+$/.test(p)||!p)return p;
 if(d==='en'){var m=p.match(/^([^A-Za-z']*)([A-Za-z']+)(.*)$/);if(!m)return esc(p);var n=norm(m[2],d);return esc(m[1])+'<span class="w'+(st.d[d+'|'+n]?' kn':'')+'" data-n="'+esc(n)+'">'+esc(m[2])+'</span>'+esc(m[3])}
 var n=norm(p,d);return n?'<span class="w'+(st.d[d+'|'+n]?' kn':'')+'" data-n="'+esc(n)+'">'+esc(p)+'</span>':esc(p)}).join('')}
/* Ortak sözlük: aynı dildeki bütün kitapların sözlükleri (data/roman/sozluk_<dil>.json); kitapta yoksa buradan, önek/sonek ayıklanarak bakılır */
function hz(w){return w.replace(/[إأآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ي/g,'ی').replace(/ك/g,'ک')}

function bul(n,d,G){BULK=n;if(G[n])return G[n];if(d==='ar'&&window.arAday){var A=arAday(n);for(var a=0;a<A.length;a++)if(G[A[a]]){BULK=A[a];return G[A[a]]}for(var a2=0;a2<A.length;a2++){var z2='~'+hz(A[a2]);if(G[z2]){BULK=z2;return G[z2]}}if(G['~'+hz(n)]){BULK='~'+hz(n);return G['~'+hz(n)]}return ''}var c=[];
 if(d==='ar'){['وال','بال','فال','كال','لل','ال','و','ف','ب','ل','ك','وب','ول','فب','وك','س'].forEach(function(pr){if(n.indexOf(pr)===0&&n.length-pr.length>=3){var r=n.slice(pr.length);c.push(r,'ال'+r);if(r.indexOf('ال')===0)c.push(r.slice(2))}});
  ['ها','هم','هما','هن','كم','كما','نا','ني','ه','ك','ي','ون','ين','ات','ة'].forEach(function(sf){var t=n.replace(/^(وال|بال|فال|ال|و|ف|ب)/,'');if(t.length-sf.length>=3&&t.slice(-sf.length)===sf){c.push(t.slice(0,-sf.length),'ال'+t.slice(0,-sf.length))}})}
 else if(d==='fa'){var t=n.replace(/\u200c/g,'');[n.replace(/^(و|ب|می|نمی|ن)/,''),n.replace(/(ها|های|هایی|ای|اش|ام|ات|یم|ید|ند|ی|ش|م)$/,''),n.replace(/\u200c?(ها|های|هایی|ای|اش|ام|ات)$/,'')].forEach(function(x){if(x&&x.length>=2)c.push(x)});c.push(t)}
 else{[n.replace(/(ing|ed|es|s|ly)$/,''),n.replace(/ies$/,'y'),n.replace(/ied$/,'y'),n.replace(/ing$/,'e'),n.replace(/ed$/,'e')].forEach(function(x){if(x.length>=2)c.push(x)})}
 if(d==='ar'&&n.length>=4&&/[اى]$/.test(n)){var u=n.slice(0,-1);c.push(u,'ال'+u)}
 for(var i=0;i<c.length;i++)if(c[i]&&c[i]!==n&&G[c[i]])return G[c[i]];
 if(d!=='en'){c.unshift(n);for(var j=0;j<c.length;j++){var z='~'+hz(c[j]||'');if(c[j]&&G[z])return G[z]}}return ''}
function bolumH(i){var b=K.bolumler[i],d=K.dil,h='<section class="chap" data-i="'+i+'"><h2 class="'+d+'" style="text-align:center;font-size:24px;margin:22px 0 4px">'+esc(b.b)+'</h2><p class="chs">'+(i+1)+'. '+esc(b.tr_b)+'</p>';
 b.c.forEach(function(c){h+=c[1]?'<div class="cm '+d+'" lang="'+d+'"><div class="s '+d+'">'+tok(c[0],d)+'</div><button class="trb">Türkçesi ▾</button><div class="tr">'+esc(c[1])+'</div></div>':'<p class="pr '+d+'" lang="'+d+'">'+tok(c[0],d)+'</p>'});
 return h+'</section>'}
/* Bölümler alt alta akar: aşağı kaydırdıkça sıradaki bölüm kendiliğinden eklenir */
var AK=null,AKS=null,NX=0;
function bolum(i){CUR=i;var d=K.dil;ttl.textContent=(i+1)+'. '+K.bolumler[i].tr_b;bk('‹ Bölümler',function(){history.back()});
 if(AK)AK.disconnect();if(AKS)AKS.disconnect();
 M.innerHTML=(K.uzun?'<div class="bar" style="display:none"><button id="tumtr"></button></div>':'<div class="bar"><button id="tumtr">Bütün Türkçeyi aç/kapat</button></div>')+'<div class="txt" id="akis"></div><div id="son" style="height:40px"></div>';

  akis.insertAdjacentHTML('beforeend',bolumH(NX));var sec=akis.lastElementChild;if(AKS)AKS.observe(sec);NX++}

  if(n!==CUR){for(var k=CUR;k<n;k++)st.ok[K.id+'#'+k]=1;sv();CUR=n;ttl.textContent=(n+1)+'. '+K.bolumler[n].tr_b;try{history.replaceState(null,'','#k='+K.id+'&b='+n)}catch(x){}}})},{rootMargin:'-45% 0px -50% 0px'});
 ekle();scrollTo(0,0);
