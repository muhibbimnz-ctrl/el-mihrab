<!DOCTYPE html><html lang="tr"><head>

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#eef1ec;color:#22302a}
#hd{background:#f7f6ef;border-bottom:1px solid #d9dccf;padding:10px 12px;position:sticky;top:0;z-index:5}
#hd .top{display:flex;align-items:center;gap:8px}#hd a.bk{color:#2f5d4e;text-decoration:none;font:600 15px system-ui;padding:8px 10px;border-radius:12px;background:#e3eae2;white-space:nowrap}
#hd h1{margin:0;font:600 17px system-ui;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sek{display:flex;gap:6px;margin-top:10px}.sek button,.sek a{flex:1;text-align:center;border:1px solid #c9d3c6;background:#fff;border-radius:14px;padding:9px 6px;font:600 14px system-ui;color:#3d4d45;cursor:pointer;text-decoration:none}
.sek .on{background:#2f5d4e;color:#fff;border-color:#2f5d4e}
main{max-width:760px;margin:0 auto;padding:12px 12px 90px}
.ar{direction:rtl;font-family:Amiri,serif}
.lst{display:flex;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:12px 14px;margin:8px 0;cursor:pointer;border:1px solid #e1e6dc}
.lst .no{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid #b8975a;color:#8a6a2c;display:flex;align-items:center;justify-content:center;font:600 15px system-ui}
.lst .t{flex:1;min-width:0}.lst b{display:block;font-size:16px}.lst small{color:#6d7a72}.lst .a{font-size:20px;color:#2f5d4e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42%}
.kart{content-visibility:auto;contain-intrinsic-size:auto 420px;background:#fff;border-radius:24px;padding:16px 16px 12px;margin:12px 0;border:1px solid #e1e6dc;box-shadow:0 2px 10px rgba(30,50,40,.05)}
.kart .bas{display:flex;justify-content:space-between;align-items:center;color:#8a6a2c;font:600 13px system-ui;margin-bottom:6px}
.isn{font-size:17px;color:#6d7a72;line-height:1.9}.isn .rv{color:#2f5d4e;border-bottom:1.5px dotted #2f5d4e;cursor:pointer}
.mtn{font-size:27px;line-height:2.05;color:#173a2e;margin:4px 0 8px}
.meal{font-family:Lora,Georgia,serif;font-style:italic;font-size:17px;line-height:1.6;color:#33403a;margin:6px 0 10px}
.roz{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.roz span{font-size:12.5px;padding:4px 10px;border-radius:10px;cursor:pointer}
.roz .d1{background:#e1f2e4;color:#22663a}.roz .d2{background:#e6eef8;color:#244f80}.roz .d3{background:#f6ecd9;color:#7a5418}
.btns{display:flex;flex-wrap:wrap;gap:8px;border-top:1px dashed #cfd8cb;padding-top:10px}
.btns button{border:1px solid #c9d3c6;background:#fbfcfa;border-radius:16px;padding:9px 14px;font:600 14.5px system-ui;color:#2f3d36;cursor:pointer}
.btns button.on{background:#2f5d4e;color:#fff;border-color:#2f5d4e}
.pnl{margin-top:10px;background:#f6f8f3;border-radius:16px;padding:12px 14px;font-size:16px;line-height:1.7}
.pnl h3{margin:0 0 6px;font-size:15px;color:#2f5d4e}.pnl p{margin:0 0 8px}.pnl ul{margin:0;padding-left:20px}.pnl li{margin:0 0 6px}
.pnl .ar{font-size:21px;line-height:1.9}
.trm{color:#244f80;border-bottom:1.5px dotted #244f80;cursor:pointer}
table.ir{width:100%;border-collapse:collapse}table.ir td{border-bottom:1px solid #e1e6dc;padding:6px 4px;vertical-align:top}table.ir td.ar{font-size:21px;width:32%;white-space:nowrap}
.zn{display:flex;flex-direction:column;gap:6px}.zn .h{display:flex;gap:8px;align-items:flex-start}.zn .h i{font-style:normal;color:#b8975a}.zn .rv{background:#fff;border:1px solid #d9e1d5;border-radius:12px;padding:8px 10px;cursor:pointer;flex:1}
.zn .rv .ar{font-size:19px}.zn .rv small{color:#6d7a72;display:block}
#pop{position:fixed;left:50%;bottom:14px;transform:translateX(-50%) translateY(140%);width:min(600px,calc(100% - 20px));max-height:72vh;overflow:auto;background:#fff;border-radius:22px;padding:16px;box-shadow:0 14px 40px rgba(0,0,0,.28);transition:transform .2s;z-index:20;visibility:hidden;line-height:1.65}
#pop.on{transform:translateX(-50%) translateY(0);visibility:visible}#pop .x{float:right;border:0;background:#e3eae2;border-radius:10px;padding:6px 10px;font:600 14px system-ui;cursor:pointer}
#pop h3{margin:0 0 4px;font-size:18px}#pop .ar{font-size:21px}
.nev{background:#fff;border-radius:18px;padding:14px;margin:10px 0;border:1px solid #e1e6dc}.nev h3{margin:0 0 4px;font-size:17px}.nev .ar.t{font-size:22px;color:#2f5d4e}
.nev .tn{background:#f6f8f3;border-radius:12px;padding:10px 12px;margin:8px 0}.nev.kisa{opacity:.75}
.not{font-size:13px;color:#6d7a72;background:#fff;border-radius:14px;padding:10px 12px;line-height:1.5;margin:8px 0}
.nav{display:flex;justify-content:space-between;gap:8px;margin:14px 0}.nav button{border:0;border-radius:14px;padding:11px 16px;background:#2f5d4e;color:#fff;font:600 14.5px system-ui;cursor:pointer}
@media(prefers-color-scheme:dark){body{background:#121815;color:#e2e8e2}#hd{background:#18201c;border-color:#2a352f}#hd a.bk{background:#24302a;color:#9fd1bd}
.lst,.kart,.nev,.not,.sek button,.sek a,#pop{background:#1b231f;color:#e2e8e2;border-color:#2a352f}.pnl,.nev .tn{background:#222c27}.btns button{background:#1f2823;color:#e2e8e2;border-color:#34413a}
.mtn{color:#bfe3d3}.meal{color:#cfd8d2}.zn .rv{background:#1f2823;border-color:#34413a}#pop .x{background:#2a352f;color:#e2e8e2}}
.sek a,.sek button{font-size:13.5px;padding:9px 4px}</style></head><body>
<div id="hd"><div class="top"><a class="bk" href="./">‹ el-Mihrâb</a><h1 id="ttl">Siyer Dirâsesi</h1><span style="width:70px"></span></div>
<div class="sek"><a href="./?dirase=kuran">Kur'an</a><a href="fikih.html">Fıkıh</a><button id="sB" class="on">Kitap</button><button id="sH">Harita</button></div></div>
<main id="m"><p class="not">Yükleniyor…</p></main>
<script>setTimeout(function(){if(!window.SIYER_HAZIR){var m=document.getElementById("m");if(m)m.innerHTML='<p class="not">Sayfa açılamadı. <button onclick="location.reload()" style="border:0;border-radius:10px;padding:6px 12px;font:600 14px system-ui;background:#2f5d4e;color:#fff">Yenile</button> <a href="./?onar">Uygulamayı onar</a></p>'}},9000)</script>
<div id="pop"><button class="x" id="px">Kapat</button><div id="pc"></div></div>
<script>window.SIYER_HAZIR=1;
var M=document.getElementById('m'),OL=[],YR={},acik='',HV='6';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function getJ(u){return fetch(u+'?v='+HV,{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json()})}
function pop(h){document.getElementById('pc').innerHTML=h;document.getElementById('pop').classList.add('on')}
document.getElementById('px').onclick=function(){document.getElementById('pop').classList.remove('on')};
function sek(w){document.getElementById('sB').classList.toggle('on',w==='B');document.getElementById('sH').classList.toggle('on',w==='H')}
var OK='mihrab.siyerOkundu';function okunan(){try{return JSON.parse(localStorage.getItem(OK)||'[]')}catch(e){return []}}
function okDegis(id){var L=okunan(),i=L.indexOf(id);if(i>=0)L.splice(i,1);else L.push(id);try{localStorage.setItem(OK,JSON.stringify(L))}catch(e){}return i<0}
function gl(p){return esc(p).replace(/\{([^|{}]+)\|([^{}]+)\}/g,function(_,w,a){return '<span class="gl" data-m="'+a+'" style="border-bottom:1.5px dotted #8a6a2c;cursor:pointer">'+w+'</span>'})}
function duz(p){return p.replace(/\{([^|{}]+)\|[^{}]+\}/g,'$1')}
/* ===== Kitap ===== */
var KT={bolum:[],plan:[]},OI={};
var KY='mihrab.siyerKaldim',YZ='mihrab.siyerYazi';
function kaldim(){try{return localStorage.getItem(KY)||''}catch(e){return ''}}
function yazi(){try{return +(localStorage.getItem(YZ)||17)}catch(e){return 17}}
function liste(){sek('B');document.getElementById('ttl').textContent='Siyer-i Nebî';var ok=okunan(),don='',kl=kaldim(),ki=-1;
  KT.bolum.forEach(function(b,i){if(b.n===kl)ki=i});
  var yaz=KT.plan.filter(function(p){return p[3]}).length;
  var h='<div class="kart" style="padding-bottom:12px"><div style="font:600 22px system-ui">Siyer-i Nebî</div><div class="ar" style="font-size:22px;color:#6d7a72">السيرة النبوية</div><p style="font-size:15px;line-height:1.6;margin:6px 0 8px">Peygamberimizin hayatı, doğumundan vefatına ve şemâiline kadar bölüm bölüm. Altı noktalı kelimelere dokununca anlamı açılır; her bölüm sesli dinlenebilir.</p>'+
    '<div style="font:600 13px system-ui;color:#6d7a72">'+KT.bolum.length+' bölüm yayında · yaklaşık '+KT.sayfa+' sayfa · plan: '+KT.plan.length+' bölüm</div>'+
    '<div style="display:flex;align-items:center;gap:10px;margin-top:8px"><div style="flex:1;height:8px;border-radius:4px;background:#e3eae2;overflow:hidden"><div style="height:100%;width:'+Math.round(100*ok.length/Math.max(1,KT.bolum.length))+'%;background:#2f5d4e"></div></div><span style="font:600 13px system-ui;color:#2f5d4e">'+ok.length+' okundu</span></div>'+
    (ki>=0?'<button id="devam" style="margin-top:10px;width:100%;border:0;border-radius:14px;padding:12px;font:600 15px system-ui;background:#2f5d4e;color:#fff;cursor:pointer">Kaldığın yerden devam et: '+esc(KT.bolum[ki].baslik)+' ›</button>':'<button id="devam" style="margin-top:10px;width:100%;border:0;border-radius:14px;padding:12px;font:600 15px system-ui;background:#2f5d4e;color:#fff;cursor:pointer">Okumaya başla ›</button>')+'</div>';
  KT.plan.forEach(function(p){if(p[2]!==don){don=p[2];h+='<h2 style="font-size:15px;margin:16px 4px 4px;color:'+(don.indexOf('Mekke')===0?'#8a6a2c':don.indexOf('Medine')===0?'#2f5d4e':'#1f5b6e')+'">'+esc(don)+'</h2>'}
    var bi=-1;KT.bolum.forEach(function(b,i){if(+b.n===p[0])bi=i});
    if(bi<0){h+='<div class="lst" style="opacity:.45;cursor:default"><div class="no">'+p[0]+'</div><div class="t"><b>'+esc(p[1])+'</b><small>Yazılıyor</small></div></div>';return}
    var b=KT.bolum[bi],o=ok.indexOf('k'+b.n)>=0;
    h+='<div class="lst" data-i="'+bi+'"><div class="no" style="'+(o?'background:#2f5d4e;color:#fff':'')+'">'+(o?'✓':p[0])+'</div><div class="t"><b>'+esc(b.baslik)+'</b><small>'+esc(b.tarih)+' · '+Math.max(1,Math.round(b.kelime/250))+' sayfa</small></div><div class="a">›</div></div>'});
  M.innerHTML=h;[].forEach.call(M.querySelectorAll('.lst[data-i]'),function(d){d.onclick=function(){bolum(+d.getAttribute('data-i'))}});
  document.getElementById('devam').onclick=function(){bolum(ki>=0?ki:0)};history.replaceState(null,'','#');scrollTo(0,0)}
function bolum(i){var x=KT.bolum[i],ol=x.olay?OI[x.olay]:null;sek('B');document.getElementById('ttl').textContent=x.baslik;acik='';var ok=okunan().indexOf('k'+x.n)>=0;
  try{localStorage.setItem(KY,x.n)}catch(e){}
  var fs=yazi();
  var h='<div class="kart"><div class="bas"><span>Bölüm '+(+x.n)+'</span><span>'+Math.max(1,Math.round(x.kelime/250))+' sayfa</span></div>'+
    '<div style="font:600 22px system-ui;margin:2px 0 6px">'+esc(x.baslik)+'</div>'+
    '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px"><span style="font:600 12.5px system-ui;background:#f3ead6;color:#6b4f12;border-radius:10px;padding:4px 9px">'+esc(x.tarih)+'</span><button id="yer" style="border:0;font:600 12.5px system-ui;background:#e1f2e4;color:#1d5531;border-radius:10px;padding:4px 9px;cursor:pointer">⌖ '+esc((YR[x.yer]||[''])[0])+'</button><span style="flex:1"></span><button id="ak" style="border:1px solid #c9d3c6;background:#fff;border-radius:10px;padding:3px 9px;font:600 13px system-ui">A−</button><button id="ab" style="border:1px solid #c9d3c6;background:#fff;border-radius:10px;padding:3px 9px;font:600 15px system-ui">A+</button></div>'+
    '<div id="mt" style="font-size:'+fs+'px">'+x.metin.map(function(p){return '<p style="font-size:inherit;line-height:1.8;margin:0 0 14px">'+gl(p)+'</p>'}).join('')+'</div>'+
    '<div class="btns"><button data-k="dinle">Dinle</button>'+(ol?'<button data-k="ayet">Âyetler ('+ol.ayet.length+')</button><button data-k="hadis">Hadisler ('+ol.hadis.length+')</button>'+(ol.fikih.length?'<button data-k="fikih">Fıkıh ('+ol.fikih.length+')</button>':'')+'<button data-k="kisi">Kişiler</button><button data-k="ders">Dersler</button>':'')+'<button data-k="ok">'+(ok?'Okundu ✓':'Okudum')+'</button><button data-k="pay">Paylaş</button></div><div id="pn"></div></div>'+
    '<div class="nav"><button id="ön">‹ Önceki</button><button id="ls">İçindekiler</button><button id="sn">Sonraki ›</button></div>';
  M.innerHTML=h;var pn=document.getElementById('pn');
  function glb(){[].forEach.call(M.querySelectorAll('.gl'),function(s){s.onclick=function(){pop('<h3>'+esc(s.textContent)+'</h3><p>'+esc(s.getAttribute('data-m'))+'</p>')}})}glb();
  function boy(d){var v=Math.min(26,Math.max(14,yazi()+d));try{localStorage.setItem(YZ,v)}catch(e){}document.getElementById('mt').style.fontSize=v+'px'}
  document.getElementById('ak').onclick=function(){boy(-1)};document.getElementById('ab').onclick=function(){boy(1)};
  document.getElementById('yer').onclick=function(){harita(x.yer)};
  [].forEach.call(M.querySelectorAll('.btns button'),function(b){b.onclick=function(){var k=b.getAttribute('data-k');
    if(k==='dinle'){oku(x.baslik+'. '+x.metin.map(duz).join(' '),b);return}
    if(k==='ok'){b.textContent=okDegis('k'+x.n)?'Okundu ✓':'Okudum';return}
    if(k==='pay'){var u=location.origin+location.pathname+'#b='+x.n;if(navigator.share)navigator.share({title:x.baslik,url:u}).catch(function(){});else{try{navigator.clipboard.writeText(u)}catch(e){}pop('<p>Bağlantı kopyalandı.</p>')}return}
    if(acik===k){acik='';pn.innerHTML='';b.classList.remove('on');return}
    [].forEach.call(M.querySelectorAll('.btns button'),function(z){z.classList.remove('on')});b.classList.add('on');acik=k;var y='';
    function link(u,et,ac,bt){return '<div style="margin-bottom:10px"><b>'+esc(et)+'</b>'+(ac?'<p style="margin:3px 0">'+esc(ac)+'</p>':'')+'<a href="'+u+'" style="display:inline-block;border:1px solid #c9d3c6;border-radius:12px;padding:5px 11px;text-decoration:none;color:#2f5d4e;font:600 13.5px system-ui">'+bt+' ›</a></div>'}
    if(k==='ayet')y=ol.ayet.map(function(a){return link(a[1],a[0],a[2],'Kur’an’da aç')}).join('');
    if(k==='hadis')y=ol.hadis.map(function(a){return link(a[1],a[0],a[2],'Hadis Dirâsesi’nde ara')}).join('');
    if(k==='fikih')y='<p>Bu olayla ilgili fıkıh meseleleri:</p>'+ol.fikih.map(function(f){return '<a class="lst" href="fikih.html#m='+f+'" style="text-decoration:none;color:inherit;padding:10px 12px"><div class="t"><b>'+esc(FK[f]||f)+'</b><small>Fıkıh Dirâsesi</small></div><div class="a">›</div></a>'}).join('');
    if(k==='kisi')y=ol.kisi.map(function(p){return '<div style="margin-bottom:8px"><b>'+esc(p[0])+'</b> — '+esc(p[1])+'</div>'}).join('');
    if(k==='ders')y='<h3>Bu bölümden dersler</h3><ul style="margin:0;padding-left:20px;line-height:1.7">'+ol.ders.map(function(d){return '<li>'+esc(d)+'</li>'}).join('')+'</ul>';
    pn.innerHTML='<div class="pnl">'+y+'</div>'}});
  document.getElementById('ön').onclick=function(){if(i>0)bolum(i-1)};document.getElementById('sn').onclick=function(){if(i<KT.bolum.length-1)bolum(i+1);else pop('<p>Sonraki bölümler yazılıyor.</p>')};document.getElementById('ls').onclick=function(){liste()};
  history.replaceState(null,'','#b='+x.n);scrollTo(0,0)}
/* ===== Harita ===== */
function harita(sec){sek('H');document.getElementById('ttl').textContent='Siyer haritası';
  var L0=35.4,L1=41.6,B0=20.4,B1=29,W=360,Hh=Math.round(W*(B1-B0)/(L1-L0));
  function P(lat,lon){return [((lon-L0)/(L1-L0)*W).toFixed(1),((B1-lat)/(B1-B0)*Hh).toFixed(1)]}
  var dogu=[[29.2,34.9],[28,35.2],[27,35.8],[26,36.5],[25,37.2],[24,38],[23,38.6],[22,39.1],[21,39.4],[20.2,39.9]],bati=[[20.2,37.3],[21,37.1],[22,36.9],[23,35.7],[24,35.3],[25,34.9],[27,33.9],[29.2,32.9]];
  var deniz=dogu.concat(bati).map(function(p){return P(p[0],p[1]).join(',')}).join(' ');
  var s='<svg viewBox="0 0 '+W+' '+Hh+'" style="width:100%;height:auto;background:#f3efe4;border-radius:16px;display:block"><polygon points="'+deniz+'" fill="#cfe3ea"/>'+
    '<text x="'+P(24.3,36.4)[0]+'" y="'+P(24.3,36.4)[1]+'" font-size="12" fill="#5d8796" font-style="italic" transform="rotate(-50 '+P(24.3,36.4).join(' ')+')">Kızıldeniz</text>'+
    '<text x="'+P(27.3,38.6)[0]+'" y="'+P(27.3,38.6)[1]+'" font-size="13" fill="#b49a62" font-style="italic">Hicaz</text><text x="'+P(23.2,40.6)[0]+'" y="'+P(23.2,40.6)[1]+'" font-size="13" fill="#b49a62" font-style="italic">Necid</text>';
  var say={};KT.bolum.forEach(function(o){say[o.yer]=(say[o.yer]||0)+1});
  var LB={hudeybiye:[-10,4,'end'],mekke:[-8,20,'end'],arafat:[0,38,'middle'],taif:[10,6,'start'],huneyn:[10,-6,'start'],uhud:[-9,-4,'end'],medine:[10,2,'start'],hendek:[10,14,'start'],bedir:[-10,4,'end'],tebuk:[-10,4,'end'],hayber:[10,4,'start']};
  Object.keys(YR).forEach(function(k){var y=YR[k],on=k===sec;
    if(k==='habesistan'){var q=P(20.9,36.1);s+='<g class="yn" data-y="'+k+'" style="cursor:pointer"><rect x="'+(q[0]-14)+'" y="'+(q[1]-14)+'" width="150" height="28" rx="14" fill="'+(on?'#8a6a2c':'#fff')+'" stroke="#2f5d4e"/><text x="'+(+q[0]+61)+'" y="'+(+q[1]+4.5)+'" font-size="12.5" font-weight="600" fill="'+(on?'#fff':'#26352e')+'" text-anchor="middle">↙ Habeşistan'+(say[k]?' ('+say[k]+')':'')+'</text></g>';return}
    var p=P(y[1],y[2]),l=LB[k]||[10,4,'start'];
    s+='<g class="yn" data-y="'+k+'" style="cursor:pointer"><circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(on?8.5:6)+'" fill="'+(on?'#8a6a2c':'#2f5d4e')+'" stroke="#fff" stroke-width="2"/><circle cx="'+p[0]+'" cy="'+p[1]+'" r="14" fill="transparent"/><text x="'+(+p[0]+l[0])+'" y="'+(+p[1]+l[1])+'" font-size="12.5" font-weight="600" fill="#26352e" text-anchor="'+l[2]+'" paint-order="stroke" stroke="#f3efe4" stroke-width="3">'+esc(y[0].replace(' (Aksum)',''))+(say[k]?' ('+say[k]+')':'')+'</text></g>'});
  s+='</svg>';
  M.innerHTML='<p class="not">Bir yere dokunun; orada yaşanan olaylar aşağıda listelenir. Harita yaklaşık konumları gösterir.</p>'+s+'<div id="hl"></div>';
  [].forEach.call(M.querySelectorAll('.yn'),function(g){g.onclick=function(){harita(g.getAttribute('data-y'))}});
  var hl=document.getElementById('hl');

  var parca=t.match(/[^.!?…]+[.!?…]*/g)||[t],j=0;okuyan=bt;bt.textContent='Durdur';
  (function sira(){if(okuyan!==bt||j>=parca.length){if(okuyan===bt){okuyan=null;bt.textContent='Dinle'}return}var u=new SpeechSynthesisUtterance(parca[j++]);u.lang='tr-TR';u.rate=.95;if(e)u.voice=e;else if(V[0]){u.voice=V[0];u.pitch=.8}u.onend=sira;u.onerror=sira;ss.speak(u)})()}
