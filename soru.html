<!DOCTYPE html><html lang="tr"><head>
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script src="kalkan.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fetva Sor — el-Mihrâb</title><meta name="theme-color" content="#efe7d6">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="arac.css?v=1"><script src="arac.js?v=1"></script>
<style>
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden}
.ust{flex:none;border-bottom:1px solid var(--line)}
.kim{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.av{width:40px;height:40px;border-radius:50%;background:var(--acc);display:grid;place-items:center;flex:none}
.av svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[data-theme="gece"] .av svg{stroke:#0f1513}
.kim b{display:block;font-size:17px}.kim small{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12.5px}
.kim small i{width:7px;height:7px;border-radius:50%;background:var(--gold)}.kim small i.on{background:#2fae6a}
#akis{flex:1;overflow-y:auto;padding:14px 14px 20px;-webkit-overflow-scrolling:touch}
.ms{display:flex;gap:8px;margin:0 0 14px;max-width:680px;margin-left:auto;margin-right:auto}
.ms .bl{padding:11px 14px;border-radius:20px;font-size:16px;line-height:1.6;max-width:86%;word-wrap:break-word}
.ms.k{justify-content:flex-end}.ms.k .bl{background:var(--acc);color:#fff;border-bottom-right-radius:6px}
[data-theme="gece"] .ms.k .bl{color:#0f1513}
.ms.a .av{width:30px;height:30px;margin-top:2px}.ms.a .av svg{width:17px;height:17px}
.ms.a .bl{background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:6px;color:var(--ink)}
.ms.a .bl p{margin:0 0 9px}.ms.a .bl p:last-child{margin:0}
.ms.a .bl b{color:var(--acc)}
.kay{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line2);font-size:13px;color:var(--muted)}
.kay a{display:inline-block;margin:4px 6px 0 0;padding:4px 10px;border-radius:999px;background:var(--accS);color:var(--acc);text-decoration:none;font-weight:600;font-size:13px}
.ara{display:flex;gap:14px;margin-top:8px;font-size:13px}.ara button{border:0;background:none;color:var(--muted);padding:0;cursor:pointer;font-weight:600}
.yz{display:inline-flex;gap:4px;padding:4px 2px}.yz i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:yz 1.2s infinite}.yz i:nth-child(2){animation-delay:.15s}.yz i:nth-child(3){animation-delay:.3s}
@keyframes yz{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.oneri{display:flex;flex-wrap:wrap;gap:8px;max-width:680px;margin:0 auto 14px;padding-left:38px}
.oneri button{border:1px solid var(--line2);background:none;border-radius:999px;padding:8px 13px;font-size:14px;color:var(--ink2);cursor:pointer;text-align:left}
.giris{flex:none;background:var(--bg);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.giris form{max-width:680px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.giris textarea{flex:1;border:1px solid var(--line2);border-radius:22px;background:var(--paper);padding:11px 16px;font-size:16px;outline:0;color:var(--ink);resize:none;max-height:130px;line-height:1.4;font-family:inherit}
.giris textarea:focus{border-color:var(--acc)}
.giris button{border:0;background:var(--acc);color:#fff;border-radius:50%;width:46px;height:46px;flex:none;cursor:pointer;display:grid;place-items:center}
.giris button:disabled{opacity:.4}
[data-theme="gece"] .giris button{color:#0f1513}
.alt2{max-width:680px;margin:2px auto 0;font-size:11.5px;color:var(--muted);text-align:center}
</style></head><body>
<div class="ust"><a class="geri"></a><div class="kim"><span class="av"><svg viewBox="0 0 24 24"><path d="M5 21V11a7 7 0 0 1 14 0v10"/><path d="M9 21v-5a3 3 0 0 1 6 0v5M12 4V2.5M3 21h18"/></svg></span><span><b>Fetva Asistanı</b><small><i id="dot"></i><span id="dur">Hanefî ilmihal ve fıkıh meselelerine dayanır</span></small></span></div><div class="sag"><button id="yeni" aria-label="Yeni sohbet">Yeni</button></div></div>
<div id="akis"></div>
<div class="giris"><form id="fr"><textarea id="q" rows="1" placeholder="Fetva sorun… (ör. Kan aldırmak orucu bozar mı?)" enterkeyhint="send"></textarea><button id="gn" aria-label="Gönder" disabled><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></form>
<div class="alt2">Cevaplar el-Mihrâb meselelerine dayanır; kişisel durumunuz için müftülüğe veya ALO 190’a danışın.</div></div>
<script>
var MS=null,AD=[],IX=[],MZ=[['maliki','Mâlikî'],['safii','Şâfiî'],['hanbeli','Hanbelî']];
function nz(s){return String(s||'').toLocaleLowerCase('tr').replace(/[âàá]/g,'a').replace(/[îì]/g,'i').replace(/[ûù]/g,'u').replace(/ç/g,'c').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ü/g,'u').replace(/[’'‘`ʿʾ]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
var DUR=nz('mi mı mu mü midir mıdır mudur müdür ne nedir neler nasıl niye neden hangi hangisi kaç bir ve veya ile için icin olur olurmu olarak hükmü hukmu var yok ben benim bana beni biz bu şu o de da ki gibi kadar ise ama acaba lazım gerekir gerekiyor yapılır yapmak etmek eder edilir mıdır caiz mi sence hocam diye olan olanın kişi kimse vardır yoktur durumunda zaman ne zaman peki ya eğer şayet iyi tamam hocam efendim lütfen merhaba selam sence bana söyler misin söyle açıkla anlat bilgi istiyorum öğrenmek').split(' ');
var ES=[['adet','regl','aybasi','period','hayiz','hayz','hayizli'],['lohusa','lohusalik','nifas','dogum'],['istihaze','ozur','akinti'],['yolcu','yolculuk','seyahat','sefer','seferi','misafir'],['kisalt','kasr','kisaltma'],['gusul','boy','cunup','yikanma'],['mesh','meshetmek'],['oruc','oruclu','savm'],['zekat','zekati'],['fitre','fitir','fitra'],['bosanma','bosamak','talak','bosanmak'],['nikah','evlilik','evlenmek','evlenme'],['faiz','riba'],['kurban','kurbanlik','udhiye'],['sehiv','yanilma','unutma','unutarak','unutursa'],['abdest','vudu'],['bozar','bozulur','bozar','bozan','bozmak'],['teravih','terav'],['cenaze','olu','olum','meyyit'],['kaza','kazasi','telafi'],['altin','ziynet','taki','bilezik'],['kuran','mushaf','kurani'],['hasta','hastalik'],['kadin','kadinin','bayan'],['imam','imamlik','imamet'],['namaz','salat','namazi'],['kiraat','okumak','okuma','okuyabilir'],['kan','kanama'],['hamile','gebe'],['emzik','emzikli','emzirme','emziren'],['kahkaha','gulmek'],['necaset','pislik','necis','kirli'],['kopek','kopegin'],['kedi'],['et','eti'],['kesim','kesmek','kesilir','kesilen'],['gun','gunu','gunler','sure','suresi'],['hac','hacca'],['umre'],['ihram','ihramli'],['tavaf'],['kible'],['ezan'],['kamet'],['cuma'],['bayram'],['vitir'],['kunut'],['secde'],['fatiha'],['rukat','rekat','rekati']];
var EM={};ES.forEach(function(g,i){g.forEach(function(w){EM[nz(w)]=i})});
function kok(w){return w.length>5?w.slice(0,5):w}
function kavram(q){var T=nz(q).split(' ').filter(function(w){return w&&w.length>1&&DUR.indexOf(w)<0}),K=[],gor={};
  T.forEach(function(w){var g=EM[w];if(g==null){for(var k in EM)if(k.length>3&&w.length>3&&(w.indexOf(k)===0||k.indexOf(w)===0)){g=EM[k];break}}
    var v=g!=null?ES[g].map(nz):[w],key=g!=null?'g'+g:w;if(gor[key])return;gor[key]=1;K.push(v.map(kok))});return K}
function sozler(s){return nz(s).split(' ').filter(Boolean)}
function idx(){IX=MS.map(function(m){return{t:sozler(m.baslik),y:sozler(m.yol.join(' ')),h:sozler(m.hanefi),d:sozler(m.sebep+' '+MZ.map(function(z){return m.mez[z[0]].join(' ')}).join(' '))}});
  AD.forEach(function(a){IX.push({t:sozler(a.baslik),y:sozler('nasil yapilir kilinir adim'),h:sozler(a.giris),d:sozler(a.adim.map(function(x){return x[0]}).join(' ')),a:a})})}
function var_(L,v){for(var i=0;i<L.length;i++)for(var j=0;j<v.length;j++)if(L[i].indexOf(v[j])===0)return true;return false}
function ara(q){var K=kavram(q);if(!K.length)return[];var R=[];
  IX.forEach(function(x,i){var p=0,tb=0,hit=0;K.forEach(function(v){var s=0;if(var_(x.t,v)){s=4;tb++}else if(var_(x.y,v))s=2;else if(var_(x.h,v))s=1.4;else if(var_(x.d,v))s=.5;if(s)hit++;p+=s});
    if(p>0){var nasil=/nasil/.test(nz(q))&&x.a;R.push({i:i,s:p+(tb===K.length?3:0)+(nasil?3:0),c:tb/K.length,h:hit===K.length})}});
  R.sort(function(a,b){return b.s-a.s});return R.slice(0,6).map(function(r){r.k=K.length;return r})}
var AV='<span class="av"><svg viewBox="0 0 24 24"><path d="M5 21V11a7 7 0 0 1 14 0v10"/><path d="M9 21v-5a3 3 0 0 1 6 0v5M12 4V2.5M3 21h18"/></svg></span>';
var ORN=['Kan aldırmak orucu bozar mı?','Yolculukta namaz nasıl kısaltılır?','Çorap üzerine mesh olur mu?','Âdetli kadın Kur’an okuyabilir mi?','Takılan altına zekât düşer mi?','Abdest nasıl alınır?'];
var SH=LS.get('mihrab.fetva',[]),AI=null,mesgul=false; /* AI: null bilinmiyor, true açık, false kapalı */
function kaydet(){if(SH.length>40)SH=SH.slice(-40);LS.set('mihrab.fetva',SH)}
function md(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^#+\s*/gm,'').split(/\n{2,}/).map(function(p){return '<p>'+p.replace(/\n/g,'<br>')+'</p>'}).join('')}
function asagi(){var a=$('#akis');a.scrollTop=a.scrollHeight}
function durum(){$('#dot').className=AI?'on':'';$('#dur').textContent=AI?'Yapay zekâ açık · meselelere dayanır':AI===false?'Meselelerden cevaplar':'Hanefî ilmihal ve fıkıh meselelerine dayanır'}
function kaynakHTML(ids,yakin){var L=ids.map(function(id){var m=MS.filter(function(x){return x.id===id})[0];if(m)return '<a href="fikih.html#m='+esc(id)+'">'+esc(m.baslik)+'</a>';var a=AD.filter(function(x){return x.id===id})[0];return a?'<a href="fikih.html#a='+esc(id)+'">'+esc(a.baslik)+'</a>':''}).filter(Boolean);
  return L.length?'<div class="kay">'+(yakin?'Yakın meseleler':'Dayandığı meseleler')+'<br>'+L.join('')+'</div>':''}
function balon(m,anim){var d=document.createElement('div');d.className='ms '+(m.r==='k'?'k':'a');
  if(m.r==='k'){d.innerHTML='<div class="bl">'+esc(m.t)+'</div>'}
  else{d.innerHTML=AV+'<div class="bl"><div class="tx"></div>'+(m.ids?kaynakHTML(m.ids,m.yk):'')+'<div class="ara"><button data-k="1">Kopyala</button><button data-p="1">Paylaş</button></div></div>';
    var tx=d.querySelector('.tx'),h=md(m.t);
    if(anim){var ham=m.t,i=0,adim=Math.max(3,Math.round(ham.length/90));(function yaz(){i=Math.min(ham.length,i+adim);tx.innerHTML=md(ham.slice(0,i));asagi();if(i<ham.length)setTimeout(yaz,16);else tx.innerHTML=h})()}else tx.innerHTML=h;
    d.querySelector('[data-k]').onclick=function(){try{navigator.clipboard.writeText(m.t);toast('Kopyalandı')}catch(e){}};
    d.querySelector('[data-p]').onclick=function(){var t=m.t+'\n\n— el-Mihrâb Fetva Asistanı';if(navigator.share)navigator.share({text:t}).catch(function(){});else{try{navigator.clipboard.writeText(t);toast('Kopyalandı')}catch(e){}}}}
  $('#akis').appendChild(d);asagi();return d}
function karsila(){$('#akis').innerHTML='';balon({r:'a',t:'Selâmün aleyküm! Ben el-Mihrâb’ın fetva asistanıyım.\n\nAbdest, namaz, oruç, zekât, hac, kurban, nikâh, alışveriş… aklınıza takılan dinî soruyu yazın. Cevabı **Hanefî mezhebine** göre, diğer mezheplerin görüşü ve delilleriyle birlikte veririm.'});
  var o=document.createElement('div');o.className='oneri';o.id='orn';o.innerHTML=ORN.map(function(x){return '<button>'+esc(x)+'</button>'}).join('');$('#akis').appendChild(o);
  $$('#orn button').forEach(function(b){b.onclick=function(){sor(b.textContent)}})}
/* İnternetsiz/yapay zekâsız cevap: meselelerden konuşur gibi kurulur */
function kur(q,R){var en=R[0],yeter=en&&((en.h&&en.c>=.5)||en.c>=.75);
  if(!yeter)return{t:'Bu soruya meselelerimiz arasında doğrudan bir cevap bulamadım.'+(R.length?'\n\nŞu meseleler yakın olabilir; açıp bakabilirsiniz. Soruyu “oruç”, “abdest”, “zekât” gibi ana kelimeyle tekrar sorarsanız daha iyi bulurum.':'\n\nSoruyu ana kelimeyle (ör. “oruç”, “abdest”, “zekât”) tekrar sorabilirsiniz.')+'\n\nKişisel durumunuz için müftülüğe ya da Diyanet’in **ALO 190** hattına danışmanızı tavsiye ederim.',ids:R.slice(0,3).map(function(r){return IX[r.i].a?IX[r.i].a.id:MS[r.i].id}),yk:1};
  var x=IX[en.i];
  if(x.a){var a=x.a;return{t:'**'+a.baslik+'** (Hanefî) şöyle yapılır:\n\n'+a.giris+'\n\n'+a.adim.map(function(s,i){return (i+1)+'. '+s[0]+(s[1]?' ('+s[1]+')':'')}).join('\n'),ids:[a.id]}}
  var m=MS[en.i],t='Bu, “'+m.baslik+'” meselesidir.\n\n**Hanefî mezhebine göre:** '+m.hanefi+(m.sebep?'\n\n'+m.sebep:'');
  var fark=MZ.filter(function(z){return m.mez[z[0]][0]&&m.mez[z[0]][0]!==m.hanefi});
  if(fark.length)t+='\n\nDiğer mezheplerde: '+MZ.map(function(z){return z[1]+' — '+m.mez[z[0]][0]}).join('; ')+'.';
  if(m.delil&&m.delil[0])t+='\n\nDelil: '+String(m.delil[0][3]).slice(0,240)+' ('+m.delil[0][1]+')';
  var bz=R.slice(1,3).filter(function(r){return r.s>=4}).map(function(r){return IX[r.i].a?IX[r.i].a.id:MS[r.i].id});
  return{t:t,ids:[m.id].concat(bz)}}
function sor(q){q=String(q||'').trim();if(!q||mesgul)return;if(!MS){toast('Meseleler yükleniyor…');return}
  var o=$('#orn');if(o)o.remove();var k={r:'k',t:q};SH.push(k);balon(k);kaydet();
  /* takip sorularında önceki soruyu da arama için kullan */
  var R=ara(q),onceki=SH.filter(function(x){return x.r==='k'}).slice(-2)[0];
  if(onceki&&onceki!==k&&(!R[0]||R[0].c<.5)){var R2=ara(onceki.t+' '+q);if(R2[0]&&(!R[0]||R2[0].s>R[0].s))R=R2}
  var ids=R.filter(function(r){return r.s>=2}).slice(0,4).map(function(r){return IX[r.i].a?IX[r.i].a.id:MS[r.i].id});
  mesgul=true;$('#gn').disabled=true;var y=document.createElement('div');y.className='ms a';y.innerHTML=AV+'<div class="bl"><span class="yz"><i></i><i></i><i></i></span></div>';$('#akis').appendChild(y);asagi();
  var bitir=function(c){y.remove();var m={r:'a',t:c.t,ids:c.ids,yk:c.yk};SH.push(m);kaydet();balon(m,true);mesgul=false;$('#gn').disabled=!$('#q').value.trim()};
  var yerel=function(){setTimeout(function(){bitir(kur(q,R))},550)};
  if(AI===false||navigator.onLine===false)return yerel();
  var ctl=new AbortController(),zm=setTimeout(function(){ctl.abort()},25000);
  fetch('/api/fetva',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({soru:q,ids:ids,gecmis:SH.slice(-6,-1).map(function(x){return{r:x.r,t:x.t}})}),signal:ctl.signal})
   .then(function(r){clearTimeout(zm);if(r.status===503||r.status===404||r.status===405){AI=false;durum();throw 0}if(!r.ok)throw 0;return r.json()})
   .then(function(j){if(!j||!j.cevap)throw 0;AI=true;durum();bitir({t:j.cevap,ids:ids})})
   .catch(function(){clearTimeout(zm);yerel()})}
var T=$('#q');T.oninput=function(){T.style.height='auto';T.style.height=Math.min(130,T.scrollHeight)+'px';$('#gn').disabled=mesgul||!T.value.trim()};
T.onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey&&!('ontouchstart' in window)){e.preventDefault();$('#fr').onsubmit(e)}};
$('#fr').onsubmit=function(e){e.preventDefault();var v=T.value;T.value='';T.oninput();sor(v)};
$('#yeni').onclick=function(){SH=[];kaydet();karsila()};
function getJ(u){return fetch(u+'?v=16',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json()})}
Promise.all([getJ('data/fikih/meseleler.json'),getJ('data/fikih/adim.json').catch(function(){return[]})]).then(function(a){MS=a[0];AD=a[1]||[];idx();
  if(SH.length){SH.forEach(function(m){balon(m)})}else karsila();durum();
  var u=new URLSearchParams(location.search).get('q');if(u)sor(u)}).catch(function(){$('#akis').innerHTML='<p class="bos">Meseleler yüklenemedi. İnternet bağlantınızı kontrol edin.</p>'});
</script></body></html>
